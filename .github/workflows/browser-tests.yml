name: Browser Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-chrome-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build WebSocket servers
        working-directory: server
        run: cargo build
      - name: Start WebSocket servers
        working-directory: server
        run: |
          cargo run -- --config test-space/config.example.toml &
          cargo run -- --config test-space/config2.toml &
          echo "Waiting for servers to start..."
          sleep 3
      - uses: ofajs/sibyl-test@v1
        with:
          browsers: 'chrome,firefox'

  test-webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build WebSocket servers
        working-directory: server
        run: cargo build
      - name: Start WebSocket servers
        working-directory: server
        run: |
          cargo run -- --config test-space/config.example.toml &
          cargo run -- --config test-space/config2.toml &
          echo "Waiting for servers to start..."
          sleep 3
      - uses: ofajs/sibyl-test@v1
        with:
          browsers: 'webkit'
