name: Browser Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/handshake

      - name: Build handshake server
        working-directory: server/handshake
        run: cargo build

      - name: Start handshake server 8081
        working-directory: server/handshake
        run: nohup cargo run -- --config test-space/config.example.toml > server1.log 2>&1 &

      - name: Start handshake server 8082
        working-directory: server/handshake
        run: nohup cargo run -- --config test-space/config2.toml > server2.log 2>&1 &

      - name: Wait for handshake servers
        run: |
          for i in {1..30}; do
            if (echo >/dev/tcp/localhost/8081) 2>/dev/null && (echo >/dev/tcp/localhost/8082) 2>/dev/null; then
              echo "Handshake servers are ready"
              exit 0
            fi
            sleep 1
          done
          echo "Handshake servers did not start in time"
          exit 1

      - uses: ofajs/sibyl-test@v1
        with:
          browsers: 'chrome'

  test-dev-bridge:
    # dev-bridge 注入测试：需独占 SW 与 system.json，在独立 origin（端口 3003）运行，
    # 不依赖握手服务器，因此不走 sibyl-test action，直接运行专用 npm script。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run dev-bridge tests
        run: xvfb-run -a npm run test:dev-bridge

  test-firefox:
