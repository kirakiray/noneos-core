  <div class="container">
    <h1>系统信息</h1>

    <div

    >
      <span>{{connected ? '已连接' : '未连接'}}</span>

    <div class="controls">
      <button id="connectBtn" on:click="connect" :disabled="connecting">

      <button id="refreshBtn" on:click="fetchSystemInfo" :disabled="!connected">

    <o-if :value="connected && systemInfo">
      <div class="info-section">
        <!-- 内存 -->

                <span class="info-value">{{$host.formatBytes($data.total_space)}}</span>

                <span class="info-label">可用</span>

    <o-else>

    </o-else>
  </div>

  <script>
    export default async ({ query, load }) => {
      const ADMIN_JSON_URL = "/tests/user/local/admin.json";
      const WS_URL = "ws://127.0.0.1:8081";

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          systemInfo: null,
          lastUpdate: "",
          _ws: null,
          _adminUser: null,
        },

        proto: {
          formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            const val = (bytes / Math.pow(1024, i)).toFixed(1);
            return val + " " + units[i];
          },

          clampPercent(pct) {
            return Math.min(100, Math.max(0, pct));
          },

          diskUsagePercent(disk) {
            if (!disk || !disk.total_space || disk.total_space === 0) return 0;
            const used = disk.total_space - disk.available_space;
            return this.clampPercent((used / disk.total_space) * 100);
          },

          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              const { saveUserKeys, saveUserInfo } = await load("/nos/user/db.js");
              const { getUser, deleteUser } = await load("/nos/user/main.js");

              const adminData = await fetch(ADMIN_JSON_URL).then((r) =>
                r.json(),
              );
              const sysNs = "sys-info-console-ns";

              try {
                await deleteUser(sysNs, { skipConfirm: true });
              } catch (e) {
                /* ignore */
              }
              await saveUserKeys(sysNs, adminData.keys);
              await saveUserInfo(sysNs, adminData.info);

              const adminUser = await getUser(sysNs);
              this._adminUser = adminUser;
              const adminInfo = await adminUser.getInfo();

              await this._handshake(adminUser, adminInfo);
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          _handshake(adminUser, adminInfo) {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(WS_URL);
              let isHandshaked = false;
              let pendingSend = null;

              const handshakeTimeout = setTimeout(() => {
                if (!isHandshaked) {
                  ws.close();
                  this.connecting = false;
                  reject(new Error("Handshake timeout"));
                }
              }, 5000);

              ws.onopen = () => {
                if (pendingSend !== null) {
                  ws.send(pendingSend);
                  pendingSend = null;
                }
              };

              ws.onmessage = async (e) => {
                const data = JSON.parse(e.data);

                if (data.type === "handshake_challenge") {
                  const response = await adminUser._sign({
                    type: "handshake_response",
                    challenge: data.challenge,
                    userId: adminUser.userId,
                    sessionId: adminUser.sessionId,
                    username: adminInfo.username,
                  });
                  const payload = JSON.stringify(response);
                  if (ws.readyState === WebSocket.OPEN) {
                    ws.send(payload);
                  } else {
                    pendingSend = payload;
                  }
                  return;
                }

                if (data.type === "handshake") {
                  clearTimeout(handshakeTimeout);

                  if (data.status === "success" && data.is_admin) {
                    isHandshaked = true;
                    this._ws = ws;
                    this.connected = true;
                    this.connecting = false;

                    ws.onmessage = (msgEvent) => this._handleMessage(msgEvent);
                    ws.onclose = () => this._onClose();

                    // 连接成功后自动获取系统信息
                    this.fetchSystemInfo();
                    resolve(true);
                  } else {
                    this.connecting = false;
                    ws.close();
                    reject(new Error(data.message || "Not authorized as admin"));
                  }
                  return;
                }
              };

              ws.onerror = (err) => {
                if (!isHandshaked) {
                  clearTimeout(handshakeTimeout);
                  this.connecting = false;
                  reject(err);
                }
              };

              ws.onclose = (event) => {
                if (!isHandshaked) {
                  clearTimeout(handshakeTimeout);
                  this.connecting = false;
                  reject(new Error(event.reason || "Connection closed during handshake"));
                }
              };
            });
          },

          _sendAdmin(cmd) {
            if (!this._ws || this._ws.readyState !== WebSocket.OPEN) return;
            this._ws.send(JSON.stringify({ type: "admin", ...cmd }));
          },

          _handleMessage(event) {
            try {
              const data = JSON.parse(event.data);

              if (data.type === "admin_response" && data.action === "get_system_info") {
                if (data.status === "ok" && data.system_info) {
                  this.systemInfo = data.system_info;
                  this.lastUpdate = new Date().toLocaleTimeString();
                }
              }
            } catch (e) {
              console.error("Failed to parse message:", e);
            }
          },

          _onClose() {
            this.connected = false;
            this._ws = null;
            this.systemInfo = null;
            this.lastUpdate = "";
          },

          fetchSystemInfo() {
            if (this.connected) {
              this._sendAdmin({ action: "get_system_info" });
            }
          },
        },

        detached() {
          if (this._ws) {
            this._ws.close();
            this._ws = null;
          }
        },
      };
    };
  </script>
</template>
