<template page>
  <style>
    :host {
      display: block;
      font-family: Arial, sans-serif;
    }

    .container {
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      color: var(--md-sys-color-on-surface);
      text-align: center;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }

    .status.connected {
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
    }

    .status.disconnected {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #connectBtn {
      background-color: var(--md-sys-color-success);
      color: var(--md-sys-color-on-success);
    }

    #disconnectBtn {
      background-color: var(--md-sys-color-error);
      color: var(--md-sys-color-on-error);
    }

    #sendBtn {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    #clearBtn {
      background-color: var(--md-sys-color-neutral);
      color: var(--md-sys-color-on-neutral);
    }

    .message-input {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    #messageInput {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 5px;
      font-size: 14px;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid var(--md-sys-color-surface-variant);
      padding: 10px;
      background-color: var(--md-sys-color-surface-variant);
      border-radius: 5px;
      font-family: monospace;
    }

    .message {
      margin: 5px 0;
      padding: 5px;
      border-radius: 3px;
    }

    .message[type="sent"] {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .message[type="received"] {
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
    }

    .message[type="system"] {
      background-color: var(--md-sys-color-neutral-container);
      color: var(--md-sys-color-on-neutral-container);
    }
  </style>

  <div class="container">
    <h1>WebSocket 客户端示例</h1>

    <div
      id="status"
      class="status"
      class:connected="connected"
      class:disconnected="!connected"
    >
      {{connected ? '已连接' : '未连接'}}
    </div>

    <div class="controls">
      <button id="connectBtn" on:click="connect" :disabled="connected">
        连接
      </button>
      <button id="disconnectBtn" on:click="disconnect" :disabled="!connected">
        断开
      </button>
      <button id="clearBtn" on:click="clearMessages">清空消息</button>
    </div>

    <div class="message-input">
      <input
        type="text"
        id="messageInput"
        placeholder="输入消息..."
        :disabled="!connected"
        sync:value="messageInput"
        on:keypress="handleKeyPress"
      />
      <button id="sendBtn" on:click="sendMessage" :disabled="!connected">
        发送
      </button>
    </div>

    <div id="messages">
      <o-fill :value="messages">
        <div class="message" attr:type="$data.type">
          [{{$data.time}}] {{$data.text}}
        </div>
      </o-fill>
    </div>
  </div>

  <script>
    export default async ({ query }) => {
      return {
        data: {
          connected: false,
          messageInput: "",
          messages: [
            {
              type: "system",
              text: '点击"连接"按钮开始',
              time: new Date().toLocaleTimeString(),
            },
          ],
          _ws: null,
        },
        proto: {
          connect() {
            if (this._ws && this._ws.readyState === WebSocket.OPEN) {
              return;
            }

            this._ws = new WebSocket("ws://127.0.0.1:8081");

            this._ws.onopen = () => {
              this.addMessage("已连接到服务器", "system");
              this.connected = true;
            };

            this._ws.onmessage = (event) => {
              this.addMessage(event.data, "received");
            };

            this._ws.onerror = (error) => {
              this.addMessage("连接错误", "system");
              console.error("WebSocket error:", error);
            };

            this._ws.onclose = () => {
              this.addMessage("连接已关闭", "system");
              this.connected = false;
              this._ws = null;
            };
          },

          disconnect() {
            if (this._ws) {
              this._ws.close();
              this._ws = null;
            }
          },

          sendMessage() {
            const message = this.messageInput.trim();
            if (message && this._ws && this._ws.readyState === WebSocket.OPEN) {
              this._ws.send(message);
              this.addMessage(message, "sent");
              this.messageInput = "";
            }
          },

          handleKeyPress(e) {
            if (e.key === "Enter") {
              this.sendMessage();
            }
          },

          addMessage(text, type) {
            this.messages.push({
              type: type,
              text: text,
              time: new Date().toLocaleTimeString(),
            });

            // 自动滚动到底部
            const messagesDiv = this.shadow.$("#messages");
            if (messagesDiv) {
              setTimeout(() => {
                messagesDiv.ele.scrollTop = messagesDiv.ele.scrollHeight;
              }, 0);
            }
          },

          clearMessages() {
            this.messages = [];
          },
        },
        detached() {
          // 页面卸载时关闭连接
          if (this._ws) {
            this._ws.close();
            this._ws = null;
          }
        },
      };
    };
  </script>
</template>
