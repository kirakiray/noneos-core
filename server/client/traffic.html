<template page>
  <style>
    :host {
      display: block;
      font-family: Arial, sans-serif;
      height: 100%;
    }

    .container {
      padding: 24px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: bold;
      font-size: 14px;
    }

    .status-bar.connected {
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
    }

    .status-bar.disconnected {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .top-bar .status-bar {
      margin-bottom: 0;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .traffic-content {
      flex: 1;
      overflow-y: auto;
    }

    .traffic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 220px);
      gap: 16px;
      margin-bottom: 24px;
    }

    .traffic-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .traffic-card .label {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .traffic-card .value {
      font-size: 24px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      margin-top: 6px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 20px 0 12px;
      color: var(--md-sys-color-on-surface);
    }

    .traffic-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .traffic-table th {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 2px solid var(--md-sys-color-surface-variant);
      font-weight: bold;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
      white-space: nowrap;
    }

    .traffic-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
      font-variant-numeric: tabular-nums;
    }

    .traffic-table tr:hover td {
      background-color: var(--md-sys-color-surface-container);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
    }

    /* ── 服务器月度总限额 ── */
    .quota-card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 8px;
    }

    .quota-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .quota-used {
      font-size: 24px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .quota-total {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }

    .quota-badge {
      font-size: 12px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .quota-badge[level="ok"] {
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
    }

    .quota-badge[level="warn"] {
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .quota-badge[level="exceeded"] {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .quota-bar {
      height: 8px;
      border-radius: 4px;
      background-color: var(--md-sys-color-surface-variant);
      overflow: hidden;
      margin: 12px 0 10px;
    }

    .quota-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
      background-color: var(--md-sys-color-primary);
    }

    .quota-bar-fill[level="warn"] {
      background-color: var(--md-sys-color-tertiary);
    }

    .quota-bar-fill[level="exceeded"] {
      background-color: var(--md-sys-color-error);
    }

    .quota-meta {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }

    .quota-note {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.5;
      padding: 8px 12px;
      border-radius: 8px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
  </style>

  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="./comps/line-chart.html"></l-m>

  <div class="container">
    <div class="top-bar">
      <div
        class="status-bar"
        class:connected="connected"
        class:disconnected="!connected"
      >
        <span>{{connected ? '已连接' : '未连接'}}</span>
        <span :style.display="connected ? '' : 'none'"
          >— {{adminUsername}}</span
        >
      </div>

      <st-button
        variant="outlined"
        on:click="refreshTraffic"
        attr:disabled="!connected"
      >
        刷新
      </st-button>
    </div>

    <div class="traffic-content">
      <!-- 服务器月度总限额 -->
      <o-if :value="quotaData">
        <div class="section-title">服务器月度总限额</div>
        <div class="quota-card">
          <div class="quota-head">
            <div>
              <span class="quota-used">{{quotaUsedText}}</span>
              <span class="quota-total">{{quotaTotalText}}</span>
            </div>
            <span class="quota-badge" attr:level="quotaLevel">{{quotaBadgeText}}</span>
          </div>

          <o-if :value="!quotaUnlimited">
            <div class="quota-bar">
              <div
                class="quota-bar-fill"
                attr:level="quotaLevel"
                :style.width="quotaPercent + '%'"
              ></div>
            </div>
            <div class="quota-meta">
              <span>入站 {{quotaInboundText}}</span>
              <span>出站 {{quotaOutboundText}}</span>
              <span>剩余 {{quotaRemainingText}}</span>
              <span>本周期始于 {{quotaPeriodStartText}}（{{quotaResetDayText}}重置）</span>
            </div>
          </o-if>
          <o-else>
            <div class="quota-meta" style="margin-top: 10px">
              <span>入站 {{quotaInboundText}}</span>
              <span>出站 {{quotaOutboundText}}</span>
              <span>本周期始于 {{quotaPeriodStartText}}（{{quotaResetDayText}}重置）</span>
            </div>
          </o-else>

          <o-if :value="quotaExceeded">
            <div class="quota-note">
              已达服务器月度限额：非管理员的中继已降级为仅放行小消息（≤ 配置的
              relay_small_message_max_bytes）。WebRTC 信令与名片交换仍可通行，用户可继续建立
              P2P 直连。到下个重置日（{{quotaResetDayText}}）自动恢复。
            </div>
          </o-if>
        </div>
      </o-if>

      <!-- 全局流量 -->
      <o-if :value="trafficData">
        <div class="section-title">全局流量</div>
        <div class="traffic-grid">
          <div class="traffic-card">
            <div class="label">入站流量</div>
            <div class="value">{{trafficInbound}}</div>
          </div>
          <div class="traffic-card">
            <div class="label">出站流量</div>
            <div class="value">{{trafficOutbound}}</div>
          </div>
          <div class="traffic-card">
            <div class="label">转发流量</div>
            <div class="value">{{trafficRelayForwarded}}</div>
          </div>
          <div class="traffic-card">
            <div class="label">握手明文</div>
            <div class="value">{{trafficHandshake}}</div>
          </div>
        </div>
      </o-if>

      <!-- 用户流量明细 -->
      <o-if :value="hasTrafficUsers">
        <div class="section-title">
          流量最多 TOP {{trafficUsersLimit}}（共 {{trafficUserCount}} 个在线用户）
        </div>
        <table class="traffic-table">
          <thead>
            <tr>
              <th>用户</th>
              <th style="text-align:right">Session</th>
              <th style="text-align:right">入站</th>
              <th style="text-align:right">出站</th>
              <th style="text-align:right">转发</th>
              <th style="text-align:right">握手</th>
            </tr>
          </thead>
          <tbody :html="trafficUserRowsHtml"></tbody>
        </table>
      </o-if>

      <!-- 时间分布 -->
      <o-if :value="hasTrafficTimeDist">
        <div class="section-title">分钟级流量分布（最近 {{trafficTimeDistCount}} 分钟）</div>
        <n-line-chart :points="trafficData.time_distribution"></n-line-chart>
      </o-if>

      <div
        class="loading"
        :style.display="trafficData ? 'none' : ''"
      >
        <o-if :value="!connected">请先连接到服务器</o-if>
        <o-else>正在加载流量数据...</o-else>
      </div>
    </div>
  </div>

  <script>
    export default async ({ query, load }) => {
      const { getAdmin, getCurrentServerUrl, showServerError } = await load("./admin-shared.js");
      const WS_URL = getCurrentServerUrl();

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connectedOnce: false,
          adminUsername: "",
          adminUserId: "",
          trafficData: null,
          quotaData: null,
          _adminUser: null,
        },

        proto: {
          async connect() {
            if (this.connectedOnce) return;

            try {
              if (!this._adminUser) {
                const { adminUser, adminInfo } = await getAdmin(load);
                this._adminUser = adminUser;
                this.adminUserId = adminInfo.userId;
                this.adminUsername = adminInfo.username;
              }

              // 先尝试连接（如果尚未连接）
              await this._adminUser.server.connect(WS_URL);
              this.connected = true;
              this.connectedOnce = true;

              // 自动加载流量数据
              await this.refreshTraffic();
            } catch (e) {
              console.error("Traffic page connect failed:", e);
              showServerError(WS_URL, e);
            }
          },

          get hasTrafficUsers() {
            return this.trafficData && this.trafficData.users && this.trafficData.users.length > 0;
          },

          // ── 服务器月度总限额 ──

          get quotaUnlimited() {
            return !this.quotaData || this.quotaData.unlimited || !this.quotaData.quotaBytes;
          },

          get quotaExceeded() {
            return !!this.quotaData?.exceeded;
          },

          /** 已用占比（0-100，用于进度条宽度） */
          get quotaPercent() {
            if (this.quotaUnlimited) return 0;
            const pct = (this.quotaData.usedBytes / this.quotaData.quotaBytes) * 100;
            return Math.min(100, Math.max(0, Math.round(pct * 10) / 10));
          },

          /** 限额水位：ok / warn（≥80%）/ exceeded */
          get quotaLevel() {
            if (this.quotaUnlimited) return "ok";
            if (this.quotaExceeded) return "exceeded";
            return this.quotaPercent >= 80 ? "warn" : "ok";
          },

          get quotaBadgeText() {
            if (this.quotaUnlimited) return "未设置限额";
            if (this.quotaExceeded) return "已超限 · 中继降级";
            return "已用 " + this.quotaPercent + "%";
          },

          get quotaUsedText() {
            return this.formatBytes(this.quotaData?.usedBytes);
          },

          get quotaTotalText() {
            if (this.quotaUnlimited) return "（本月已转发，未设置上限）";
            return "/ " + this.formatBytes(this.quotaData.quotaBytes);
          },

          get quotaInboundText() {
            return this.formatBytes(this.quotaData?.inboundBytes);
          },

          get quotaOutboundText() {
            return this.formatBytes(this.quotaData?.outboundBytes);
          },

          get quotaRemainingText() {
            return this.formatBytes(this.quotaData?.remainingBytes);
          },

          get quotaPeriodStartText() {
            const ts = this.quotaData?.periodStartAt;
            if (!ts) return "-";
            const d = new Date(ts);
            return d.getFullYear() + "-"
              + String(d.getMonth() + 1).padStart(2, "0") + "-"
              + String(d.getDate()).padStart(2, "0") + " "
              + String(d.getHours()).padStart(2, "0") + ":"
              + String(d.getMinutes()).padStart(2, "0");
          },

          /** 服务器配置的重置日，如「每月 15 号」 */
          get quotaResetDayText() {
            const day = this.quotaData?.periodResetDay || 1;
            return "每月 " + day + " 号";
          },

          get hasTrafficTimeDist() {
            return this.trafficData && this.trafficData.time_distribution && this.trafficData.time_distribution.length > 0;
          },

          get trafficTimeDistCount() {
            return this.trafficData && this.trafficData.time_distribution ? this.trafficData.time_distribution.length : 0;
          },

          get trafficUsersLimit() {
            return this.trafficData?.users?.length || 0;
          },

          get trafficUserCount() {
            return this.trafficData?.user_count || 0;
          },

          get trafficInbound() {
            return this.formatBytes(this.trafficData?.global?.inbound_bytes);
          },

          get trafficOutbound() {
            return this.formatBytes(this.trafficData?.global?.outbound_bytes);
          },

          get trafficRelayForwarded() {
            return this.formatBytes(this.trafficData?.global?.relay_forwarded_bytes);
          },

          get trafficHandshake() {
            return this.formatBytes(this.trafficData?.global?.handshake_bytes);
          },

          get trafficUserRowsHtml() {
            if (!this.hasTrafficUsers) return "";
            return this.trafficData.users.map(u => {
              const name = u.username || (u.user_id ? u.user_id.slice(0, 8) : "?");
              return '<tr>'
                + '<td>' + this._escapeHtml(name) + '</td>'
                + '<td style="text-align:right">' + u.session_count + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.inbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.outbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.relay_forwarded_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.handshake_bytes) + '</td>'
                + '</tr>';
            }).join("");
          },

          _escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          },

          async refreshTraffic() {
            if (!this.connected || !this._adminUser) return;
            try {
              const result = await this._adminUser.getTrafficStats(WS_URL, { limit: 20 });
              if (result.status === "ok") {
                this.trafficData = result.traffic;
              }
            } catch (e) {
              console.error("refreshTraffic failed:", e);
            }
            try {
              const quotaRes = await this._adminUser.getGlobalRelayQuota(WS_URL);
              if (quotaRes.status === "ok") {
                this.quotaData = quotaRes.quota;
              }
            } catch (e) {
              console.error("refresh global quota failed:", e);
            }
          },

          formatBytes(bytes) {
            if (bytes == null || bytes === 0) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            const val = bytes / Math.pow(1024, i);
            return val.toFixed(i > 0 ? 1 : 0) + " " + units[i];
          },
        },

        attached() {
          this.connect();
        },

        detached() {
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
