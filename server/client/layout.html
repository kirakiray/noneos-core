<template page>
  <style>
    :host {
      height: 100%;
    }

    main {
      position: relative;
      display: block;
      height: 100%;
      box-sizing: border-box;
      overflow: auto;
    }
  </style>

  <l-m
    src="https://punch-ui-v2.pages.dev/packages/navigation/nav-layout.html"
  ></l-m>
  <l-m
    src="https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html"
  ></l-m>

  <p-nav-layout>
    <main>
      <slot></slot>
    </main>

    <p-nav-bar slot="nav">
      <p-nav-item attr:active="activeAdmin" on:click="navigateToAdmin">
        <span slot="icon">⚙️</span>
        <span>控制台</span>
      </p-nav-item>
      <p-nav-item attr:active="activeSysInfo" on:click="navigateToSysInfo">
        <span slot="icon">📊</span>
        <span>系统信息</span>
      </p-nav-item>
      <p-nav-item attr:active="activeTraffic" on:click="navigateToTraffic">
        <span slot="icon">📈</span>
        <span>流量统计</span>
      </p-nav-item>
    </p-nav-bar>
  </p-nav-layout>

  <script>
    export default () => {
      return {
        data: {
          activeAdmin: true,
          activeSysInfo: false,
          activeTraffic: false,
        },
        routerChange() {
          this.refreshActive();
        },
        attached() {
          this.refreshActive();
        },
        proto: {
          refreshActive() {
            const { current } = this.app;
            if (!current) return;
            const path = current.src || "";
            this.activeAdmin = path.endsWith("admin.html");
            this.activeSysInfo = path.endsWith("system-info.html");
            this.activeTraffic = path.endsWith("traffic.html");
          },
          navigateToAdmin() {
            window.location.hash = "./admin.html";
          },
          navigateToSysInfo() {
            window.location.hash = "./system-info.html";
          },
          navigateToTraffic() {
            window.location.hash = "./traffic.html";
          },
        },
      };
    };
  </script>
</template>
