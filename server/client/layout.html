  <script>
    export default () => {
      return {
        data: {
          activeChat: true,
          activeAdmin: false,
        },
        routerChange() {
          this.refreshActive();
        },
        ready() {
          this.refreshActive();
        },
        proto: {
          refreshActive() {
            const { current } = this.app;
            if (!current) return;
            const path = current.src || "";
            this.activeChat = path.endsWith("page.html");
            this.activeAdmin = path.endsWith("admin.html");
          },
        },
      };
    };
