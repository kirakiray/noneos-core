<template page>
  <style>
    :host {
      height: 100%;
    }

    main {
      position: relative;
      display: block;
      height: 100%;
      box-sizing: border-box;
      overflow: auto;
    }

    .server-avatar {
      margin-top: auto;
      align-self: center;
      margin-bottom: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .server-avatar:hover {
      background-color: var(--md-sys-color-primary-container);
    }

    .dialog-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 320px;
    }

    .dialog-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dialog-row label {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    st-list-item.active {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: 12px;
    }

    .url-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>

  <l-m
    src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/navigation/nav-layout.html"
  ></l-m>
  <l-m
    src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/navigation/nav-bar.html"
  ></l-m>
  <l-m
    src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/navigation/nav-item.html"
  ></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/dialog/dialog.html"></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/input/input.html"></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/list/list.html"></l-m>

  <st-dialog id="server-dialog" sync:open="serverDialogOpen" auto-close>
    <style>
      #server-dialog::part(panel) {
        width: auto;
      }
    </style>
    <span slot="headline">切换管理服务器</span>
    <div class="dialog-body">
      <st-list>
        <o-fill :value="savedUrls">
          <st-list-item class:active="$host.currentUrl === $data">
            <div style="flex: 1; min-width: 0; cursor: pointer;" on:click="$host.switchToServer($data)">
              <span class="url-text">{{$data}}</span>
            </div>
            <st-icon-button slot="suffix" color="error" style="font-size: 13px;" on:click="$host.removeServer($event, $data)">×</st-icon-button>
          </st-list-item>
        </o-fill>
      </st-list>
      <div class="dialog-row add-row">
        <st-input placeholder="https://example.com/ctrl-x7k2m9" sync:value="newUrl">
          <span slot="suffix">
            <st-icon-button color="primary" style="font-size: 13px;" on:click="addNewServer">+</st-icon-button>
          </span>
        </st-input>
      </div>
      <div class="dialog-row">
        <label>当前服务器的管理 Token</label>
        <st-input placeholder="Bearer Token" sync:value="currentToken" type="password">
          <span slot="suffix">
            <st-icon-button color="primary" style="font-size: 13px;" on:click="saveToken">保存</st-icon-button>
          </span>
        </st-input>
      </div>
    </div>
    <div slot="actions">
      <st-button variant="text" on:click="closeServerDialog">关闭</st-button>
    </div>
  </st-dialog>

  <st-nav-layout>
    <main>
      <slot></slot>
    </main>

    <st-nav-bar slot="nav">
      <st-nav-item attr:active="activeAdmin" on:click="navigateToAdmin">
        <span slot="icon">⚙️</span>
        <span>在线会话</span>
      </st-nav-item>
      <st-nav-item attr:active="activeAllUsers" on:click="navigateToAllUsers">
        <span slot="icon">👥</span>
        <span>所有用户</span>
      </st-nav-item>
      <st-nav-item attr:active="activeSysInfo" on:click="navigateToSysInfo">
        <span slot="icon">📊</span>
        <span>系统信息</span>
      </st-nav-item>
      <st-nav-item attr:active="activeTraffic" on:click="navigateToTraffic">
        <span slot="icon">📈</span>
        <span>流量统计</span>
      </st-nav-item>

      <div class="server-avatar" on:click="openServerDialog" attr:title="currentUrl">🌐</div>
    </st-nav-bar>

  <script>
    import toast from "https://cdn.jsdelivr.net/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js";
    export default async ({ load }) => {
      const {
        getCurrentServerUrl,
        getServerHistory,
        setCurrentServerUrl,
        addServerHistory,
        removeServerHistory,
        getServerToken,
        setServerToken,
      } = await load("./admin-shared.js");

      return {
        data: {
          activeAdmin: true,
          activeAllUsers: false,
          activeSysInfo: false,
          activeTraffic: false,
          currentUrl: getCurrentServerUrl(),
          serverDialogOpen: false,
          savedUrls: getServerHistory(),
          newUrl: "",
          currentToken: "",
        },
        routerChange() {
          this.refreshActive();
        },
        attached() {
          this.refreshActive();
        },
        proto: {
          refreshActive() {
            const { current } = this.app;
            if (!current) return;
            const path = current.src || "";
            this.activeAdmin = path.endsWith("admin.html");
            this.activeAllUsers = path.endsWith("all-users.html");
            this.activeSysInfo = path.endsWith("system-info.html");
            this.activeTraffic = path.endsWith("traffic.html");
          },
          navigateToAdmin() {
            this.goto("./admin.html");
          },
          navigateToAllUsers() {
            this.goto("./all-users.html");
          },
          navigateToSysInfo() {
            this.goto("./system-info.html");
          },
          navigateToTraffic() {
            this.goto("./traffic.html");
          },
          openServerDialog() {
            this.savedUrls = getServerHistory();
            this.currentUrl = getCurrentServerUrl();
            this.currentToken = getServerToken(this.currentUrl);
            this.newUrl = "";
            this.serverDialogOpen = true;
          },
          saveToken() {
            const url = this.currentUrl;
            if (!url) return;
            setServerToken(url, (this.currentToken || "").trim());
            toast({ message: "Token 已保存", duration: 2000 });
          },
          closeServerDialog() {
            this.serverDialogOpen = false;
          },
          switchToServer(url) {
            if (!url) return;
            setCurrentServerUrl(url);
            addServerHistory(url);
            this.serverDialogOpen = false;
            window.location.reload();
          },
          addNewServer() {
            const url = (this.newUrl || "").trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) {
              alert("服务器地址必须以 http:// 或 https:// 开头");
              return;
            }
            addServerHistory(url);
            this.savedUrls = getServerHistory();
            this.newUrl = "";
          },
          removeServer(event, url) {
            event.stopPropagation();
            removeServerHistory(url);
            this.savedUrls = getServerHistory();
          },
        },
      };
    };
  </script>
</template>
