<template page>
  <style>
    :host {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    p-nav-bar {
      flex-shrink: 0;
      --label-parallel: true;
    }

    .content {
      flex: 1;
      overflow: auto;
      background-color: var(--md-sys-color-surface);
    }
  </style>

  <l-m
    src="https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html"
  ></l-m>

  <p-nav-bar style="padding: 16px">
      <p-nav-item attr:active="activeChat" on:click="navigateToChat">
        <span slot="icon">💬</span>
        <span>普通WS连接</span>
      </p-nav-item>
      <p-nav-item attr:active="activeAdmin" on:click="navigateToAdmin">
        <span slot="icon">⚙️</span>
        <span>管理员控制台</span>
      </p-nav-item>
      <p-nav-item attr:active="activeSysInfo" on:click="navigateToSysInfo">
        <span slot="icon">📊</span>
        <span>系统信息</span>
      </p-nav-item>
    </p-nav-bar>

  <main class="content">
    <slot></slot>
  </main>

  <script>
    export default () => {
      return {
        data: {
          activeChat: true,
          activeAdmin: false,
          activeSysInfo: false,
        },
        routerChange() {
          this.refreshActive();
        },
        attached() {
          this.refreshActive();
        },
        proto: {
          refreshActive() {
            const { current } = this.app;
            if (!current) return;
            const path = current.src || "";
            this.activeChat = path.endsWith("page.html");
            this.activeAdmin = path.endsWith("admin.html");
            this.activeSysInfo = path.endsWith("system-info.html");
          },
          navigateToChat() {
            window.location.hash = "./page.html";
          },
          navigateToAdmin() {
            window.location.hash = "./admin.html";
          },
          navigateToSysInfo() {
            window.location.hash = "./system-info.html";
          },
        },
      };
    };
  </script>
</template>
