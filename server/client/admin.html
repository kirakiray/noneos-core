<template page>
  <l-m src="https://punch-ui-v2.pages.dev/packages/list/list.html"></l-m>

      width: 40px;

    .kick-all-btn:disabled {

    .empty-state {

    .latency-badge {
      display: inline-block;
      font-size: 11px;

    }

    .latency-badge.high {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }
  </style>

  <div class="container">
    <h1>管理员控制台</h1>

    <div
      class="status-bar"
      class:connected="connected"
      class:disconnected="!connected"
    >
      <span>{{connected ? '已连接' : '未连接'}}</span>
      <span :style.display="connected ? '' : 'none'">— {{adminUsername}}</span>
    </div>

    <div class="controls">
      <button id="connectBtn" on:click="connect" :disabled="connecting">
        {{connecting ? '连接中...' : '连接服务器'}}
      </button>
      <button id="refreshBtn" on:click="refreshUsers" :disabled="!connected">
        刷新用户列表
      </button>
    </div>

    <div class="user-count" :style.display="connected ? '' : 'none'">
      在线用户：{{users.length}} 人
    </div>

    <p-list class="user-list">
      <o-fill :value="users">
        <p-list-item>
          <span slot="prefix" class="user-avatar" class:admin="$data.isAdmin"
            >{{$data.avatar}}</span
          >
          <span>{{$data.username}}</span>
          <div secondary>
            {{$data.host || $data.addr}}
            <span
               class="latency-badge"
               class:high="$data.latencyMs > 200"
               :style.display="$data.latencyMs != null ? '' : 'none'"
               >{{$data.latencyMs}}ms</span
             >
          </div>
          <span
            slot="suffix"
            style="display: flex; align-items: center; gap: 4px"
          >
            <span
              class="admin-badge"
              :style.display="$data.isAdmin ? '' : 'none'"
              >管理员</span
            >
            <button
              class="kick-btn"
              on:click="$host.kickSession($data.userId, $data.sessionId)"
              :disabled="$data.isSelf"
              :style.display="$data.isSelf ? 'none' : ''"
            >
              断开会话
            </button>
            <button
              class="kick-all-btn"
              on:click="$host.kickUser($data.userId)"
              :disabled="$data.isSelf"
              :style.display="$data.isSelf ? 'none' : ''"
            >
              断开所有
            </button>
          </span>
        </p-list-item>
      </o-fill>
    </p-list>

    <div
      class="empty-state"
      :style.display="users.length === 0 && connected ? '' : 'none'"
    >
      暂无在线用户
    </div>
  </div>

  <script>
    export default async ({ query, load }) => {
      const ADMIN_JSON_URL = "/tests/user/local/admin.json";
      const WS_URL = "ws://localhost:8081";

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          adminUsername: "",
          adminUserId: "",
          users: [],
          _adminUser: null,
          _refreshTimer: null,
        },

        proto: {
          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              if (!this._adminUser) {
                const { saveUserKeys, saveUserInfo } = await load("/nos/user/db.js");
                const { deleteUser } = await load("/nos/user/main.js");
                const { AdminUser } = await load("/nos/user/admin-user.js");

                const adminData = await fetch(ADMIN_JSON_URL).then((r) => r.json());
                const adminNs = "admin-console-ns";

                // 清理旧数据并重新写入
                try {
                  await deleteUser(adminNs, { skipConfirm: true });
                } catch (e) {
                  /* ignore */
                }
                await saveUserKeys(adminNs, adminData.keys);
                await saveUserInfo(adminNs, adminData.info);

                const adminUser = new AdminUser(adminNs);
                await adminUser.ready();
                this._adminUser = adminUser;
                this.adminUserId = adminUser.userId;
                const adminInfo = await adminUser.getInfo();
                this.adminUsername = adminInfo.username || "Admin";

                // 监听连接关闭
                adminUser.addEventListener("close", () => this._onClose());
              }

              // 通过执行 list_users 验证管理员身份并获取初始数据
              const response = await this._adminUser.listUsers(WS_URL);

              if (response.status === "ok") {
                this.connected = true;
                this.connecting = false;
                this.users = (response.users || []).map((u) => ({
                  ...u,
                  avatar: (u.username || "?")[0].toUpperCase(),
                  isSelf: u.userId === this.adminUserId,
                  isAdmin: u.userId === this.adminUserId,
                }));

                // 自动每 5 秒刷新用户列表（用于更新延迟等动态数据）
                this._refreshTimer = setInterval(() => {
                  this.refreshUsers();
                }, 5000);
              } else {
                throw new Error(response.message || "Not authorized as admin");
              }
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          async refreshUsers() {
            if (!this.connected || !this._adminUser) return;
            try {
              const response = await this._adminUser.listUsers(WS_URL);
              if (response.status === "ok") {
                this.users = (response.users || []).map((u) => ({
                  ...u,
                  avatar: (u.username || "?")[0].toUpperCase(),
                  isSelf: u.userId === this.adminUserId,
                  isAdmin: u.userId === this.adminUserId,
                }));
              }
            } catch (e) {
              console.error("refreshUsers failed:", e);
            }
          },

          async kickUser(userId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectUser(WS_URL, userId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickUser failed:", e);
            }
          },

          async kickSession(userId, sessionId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectSession(WS_URL, userId, sessionId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickSession failed:", e);
            }
          },

          _onClose() {
            this.connected = false;
            this.users = [];
            if (this._refreshTimer) {
              clearInterval(this._refreshTimer);
              this._refreshTimer = null;
            }
          },
        },

        detached() {
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
