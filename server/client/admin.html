  <script>
    export default async ({ query, load }) => {
      const { getAdmin, WS_URL } = await load("./admin-shared.js");

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          adminUsername: "",
          adminUserId: "",
          users: [],
          userGroupList: [],
          currentPage: 1,
          pageSize: 20,
          totalUsers: 0,
          totalPages: 0,
          groupByUser: false,
          _adminUser: null,
          _refreshTimer: null,
          // 流量历史弹窗状态
          historyDialogOpen: false,
          historyPageSrc: "",
          historyTarget: null, // { userId, username }
        },

        proto: {
          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              if (!this._adminUser) {
                const { adminUser, adminInfo } = await getAdmin(load);
                this._adminUser = adminUser;
                this.adminUserId = adminInfo.userId;
                this.adminUsername = adminInfo.username;

                adminUser.addEventListener("close", () => this._onClose());
              }

              // 通过执行 list_users 验证管理员身份并获取初始数据（同时加载第一页）
              this.currentPage = 1;
              const response = await this._adminUser.listUsers(WS_URL, {
                page: 1,
                pageSize: this.pageSize,
              });

              if (response.status === "ok") {
                this.connected = true;
                this.connecting = false;
                this._applyUsersResponse(response);

                // 自动每 5 秒刷新用户列表（用于更新延迟等动态数据）
                this._refreshTimer = setInterval(() => {
                  this.refreshUsers();
                }, 5000);
              } else {
                throw new Error(response.message || "Not authorized as admin");
              }
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          async refreshUsers() {
            if (!this.connected || !this._adminUser) return;
            try {
              if (this.groupByUser) {
                const response = await this._adminUser.listUserGroups(WS_URL, {
                  page: this.currentPage,
                  pageSize: this.pageSize,
                });
                if (response.status === "ok") {
                  this._applyUserGroupsResponse(response);
                }
              } else {
                const response = await this._adminUser.listUsers(WS_URL, {
                  page: this.currentPage,
                  pageSize: this.pageSize,
                });
                if (response.status === "ok") {
                  this._applyUsersResponse(response);
                }
              }
            } catch (e) {
              console.error("refreshUsers failed:", e);
            }
          },

          /**
           * 跳转到指定页
           */
          async goToPage(page) {
            if (!this.connected || !this._adminUser) return;
            page = Math.max(1, Math.min(page, this.totalPages || 1));
            if (page === this.currentPage) return;
            this.currentPage = page;
            try {
              if (this.groupByUser) {
                const response = await this._adminUser.listUserGroups(WS_URL, {
                  page: this.currentPage,
                  pageSize: this.pageSize,
                });
                if (response.status === "ok") {
                  this._applyUserGroupsResponse(response);
                }
              } else {
                const response = await this._adminUser.listUsers(WS_URL, {
                  page: this.currentPage,
                  pageSize: this.pageSize,
                });
                if (response.status === "ok") {
                  this._applyUsersResponse(response);
                }
              }
            } catch (e) {
              console.error("goToPage failed:", e);
            }
          },

          goFirstPage() {
            this.goToPage(1);
          },
          goPrevPage() {
            this.goToPage(this.currentPage - 1);
          },
          goNextPage() {
            this.goToPage(this.currentPage + 1);
          },
          goLastPage() {
            this.goToPage(this.totalPages);
          },

          changePageSize(event) {
            const newSize = parseInt(event.target.value, 10);
            if (newSize === this.pageSize) return;
            this.pageSize = newSize;
            this.currentPage = 1;
            this.refreshUsers();
          },

          /**
           * 将 listUserGroups 响应应用到视图状态
           */
          _applyUserGroupsResponse(response) {
            this.totalUsers = response.total || 0;
            this.currentPage = response.page || 1;
            this.pageSize = response.page_size || this.pageSize;
            this.totalPages = Math.max(
              1,
              Math.ceil(this.totalUsers / this.pageSize),
            );
            this.userGroupList = (response.users || []).map((g) => ({
              ...g,
              avatar: (g.username || "?")[0].toUpperCase(),
              isSelf: g.userId === this.adminUserId,
              isAdmin: g.userId === this.adminUserId,
              sessions: (g.sessions || []).map((s) => ({
                ...s,
                userId: g.userId,
                host: s.host || "",
                connectedTime: this._formatTime(s.connectedAt),
              })),
            }));
            // 在用户模式下，users 也清空以释放内存
            this.users = [];
          },

          /**
           * 按 userId 分组计算属性
           * 将扁平的 session 列表按用户分组，返回用户数组
           * 每个用户包含：userId, username, avatar, isAdmin, isSelf, sessionCount, sessions[]
           */
          get userGroups() {
            const groups = {};
            for (const u of this.users) {
              if (!groups[u.userId]) {
                groups[u.userId] = {
                  userId: u.userId,
                  username: u.username,
                  avatar: u.avatar,
                  isAdmin: u.isAdmin,
                  isSelf: u.isSelf,
                  sessions: [],
                  sessionCount: 0,
                };
              }
              groups[u.userId].sessions.push(u);
              groups[u.userId].sessionCount++;
            }
            return Object.values(groups);
          },

          /**
           * 将 listUsers 响应应用到视图状态
           */
          _applyUsersResponse(response) {
            this.totalUsers = response.total || 0;
            this.currentPage = response.page || 1;
            this.pageSize = response.page_size || this.pageSize;
            this.totalPages = Math.max(
              1,
              Math.ceil(this.totalUsers / this.pageSize),
            );
            this.users = (response.users || []).map((u) => ({
              ...u,
              avatar: (u.username || "?")[0].toUpperCase(),
              isSelf: u.userId === this.adminUserId,
              isAdmin: u.userId === this.adminUserId,
              connectedTime: this._formatTime(u.connectedAt),
            }));
          },

          async kickUser(userId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectUser(WS_URL, userId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickUser failed:", e);
            }
          },

          async kickSession(userId, sessionId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectSession(
                WS_URL,
                userId,
                sessionId,
              );
              await this.refreshUsers();
            } catch (e) {
              console.error("kickSession failed:", e);
            }
          },

          /**
           * 打开指定用户的流量历史弹窗
           * @param {string} userId
           * @param {string} username
           */
          showTrafficHistory(userId, username) {
            if (!this.connected || !this._adminUser) return;
            this.historyTarget = { userId, username };
            // 加一个时间戳强制 o-page 每次都重新挂载，确保拉到最新数据
            this.historyPageSrc = `./traffic-history-page.html?userId=${encodeURIComponent(
              userId,
            )}&t=${Date.now()}`;
            this.historyDialogOpen = true;
          },

          /**
           * 关闭流量历史弹窗并清空临时数据
           */
          closeTrafficHistory() {
            this.historyDialogOpen = false;
            this.historyPageSrc = "";
            this.historyTarget = null;
          },

          _formatTime(epochMs) {
            if (!epochMs) return "";
            const d = new Date(epochMs);
            const pad = (n) => String(n).padStart(2, "0");
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          },

          /**
           * 流量历史弹窗标题
           */
          get historyDialogTitle() {
            if (!this.historyTarget) return "流量历史";
            const name = this.historyTarget.username || "未命名用户";
            return `${name} 的流量历史`;
          },

          _onClose() {
            this.connected = false;
            this.users = [];
            this.userGroupList = [];
            this.currentPage = 1;
            this.totalUsers = 0;
            this.totalPages = 0;
            if (this._refreshTimer) {
              clearInterval(this._refreshTimer);
              this._refreshTimer = null;
            }
          },
        },

        watch: {
          groupByUser() {
            this.currentPage = 1;
            this.refreshUsers();
          },
          historyDialogOpen(open) {
            if (!open) {
              // 关闭弹窗时清空 src 释放子页面实例
              this.historyPageSrc = "";
              this.historyTarget = null;
            }
          },
        },

        attached() {
          this.connect();
        },

        detached() {
          if (this._refreshTimer) {
            clearInterval(this._refreshTimer);
            this._refreshTimer = null;
          }
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
