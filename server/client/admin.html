<template page>
  <style>

    button {
      padding: 10px 20px;
      border: none;

      color: var(--md-sys-color-on-primary-container);

    .user-avatar.admin {

      font-family: monospace;

    .kick-btn:disabled {
      opacity: 0.4;

    }

    .kick-all-btn {
      padding: 5px 10px;
      border: 1px solid var(--md-sys-color-error);
      border-radius: 6px;
      cursor: pointer;

      font-weight: bold;
      background-color: transparent;
      color: var(--md-sys-color-error);

    .kick-all-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
    }

    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 12px 0;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .pagination-bar button {
      padding: 6px 12px;
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      transition: background-color 0.2s;
    }

    .pagination-bar button:hover:not(:disabled) {
      background-color: var(--md-sys-color-surface-container-high);
    }

    .pagination-bar button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .pagination-bar .page-info {
      min-width: 100px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .pagination-bar .page-size-select {
      margin-left: 12px;
      padding: 4px 8px;
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 6px;
      font-size: 13px;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
    }
  </style>

  <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>

  <div class="container">
    <div class="top-bar">
      <div
        class="status-bar"
        class:connected="connected"
        class:disconnected="!connected"
      >
        <span>{{connected ? '已连接' : '未连接'}}</span>
        <span :style.display="connected ? '' : 'none'"
          >— {{adminUsername}}</span
        >
      </div>

      <p-button
        variant="outlined"
        on:click="refreshUsers"
        attr:disabled="!connected"
      >
        刷新用户列表
      </p-button>

      <div class="user-count" :style.display="connected ? '' : 'none'">
        在线用户：{{totalUsers}} 人（本页 {{users.length}} 人）
      </div>
    </div>

    <div class="card-grid">
      <o-fill :value="users">
        <div class="user-card">
          <div class="card-header">
            <div class="user-avatar" class:admin="$data.isAdmin">
              {{$data.avatar}}
            </div>
            <div>
              <div class="card-username">{{$data.username}}</div>
              <div class="card-detail">
                <span class="card-addr">{{$data.host || $data.addr}}</span>
                <span
                  class="latency-badge"
                  class:high="$data.latencyMs > 200"
                  :style.display="$data.latencyMs != null ? '' : 'none'"
                  >{{$data.latencyMs}}ms</span
                >
              </div>
            </div>
          </div>
          <div class="card-detail">
            <span>连接时间：{{$data.connectedTime}}</span>
            <span>Session：{{$data.sessionId}}</span>
          </div>

          <div class="card-badges">
            <span
              class="admin-badge"
              :style.display="$data.isAdmin ? '' : 'none'"
              >管理员</span
            >
          </div>
          <div class="card-actions" :style.display="$data.isSelf ? 'none' : ''">
            <button
              class="kick-btn"
              on:click="$host.kickSession($data.userId, $data.sessionId)"
              :disabled="$data.isSelf"
            >
              断开会话
            </button>
            <button
              class="kick-all-btn"
              on:click="$host.kickUser($data.userId)"
              :disabled="$data.isSelf"
            >
              断开所有
            </button>
          </div>
        </div>
      </o-fill>
    </div>

    <div
      class="empty-state"
      :style.display="users.length === 0 && connected ? '' : 'none'"
    >
      暂无在线用户
    </div>

    <div
      class="pagination-bar"
      :style.display="connected && totalPages > 0 ? '' : 'none'"
    >
      <button on:click="goFirstPage" :disabled="currentPage <= 1">
        首页
      </button>
      <button on:click="goPrevPage" :disabled="currentPage <= 1">
        上一页
      </button>
      <span class="page-info"
        >第 {{currentPage}} / {{totalPages}} 页，共 {{totalUsers}} 人</span
      >
      <button on:click="goNextPage" :disabled="currentPage >= totalPages">
        下一页
      </button>
      <button on:click="goLastPage" :disabled="currentPage >= totalPages">
        末页
      </button>
      <select class="page-size-select" on:change="changePageSize">
        <option value="10">10条/页</option>
        <option value="20" selected>20条/页</option>
        <option value="50">50条/页</option>
        <option value="100">100条/页</option>
      </select>
    </div>
  </div>

  <script>
    export default async ({ query, load }) => {
      const { getAdmin, WS_URL } = await load("./admin-shared.js");

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          adminUsername: "",
          adminUserId: "",
          users: [],
          currentPage: 1,
          pageSize: 20,
          totalUsers: 0,
          totalPages: 0,
          _adminUser: null,
          _refreshTimer: null,
        },

        proto: {
          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              if (!this._adminUser) {
                const { adminUser, adminInfo } = await getAdmin(load);
                this._adminUser = adminUser;
                this.adminUserId = adminInfo.userId;
                this.adminUsername = adminInfo.username;

                adminUser.addEventListener("close", () => this._onClose());
              }

              // 通过执行 list_users 验证管理员身份并获取初始数据（同时加载第一页）
              this.currentPage = 1;
              const response = await this._adminUser.listUsers(WS_URL, {
                page: 1,
                pageSize: this.pageSize,
              });

              if (response.status === "ok") {
                this.connected = true;
                this.connecting = false;
                this._applyUsersResponse(response);

                // 自动每 5 秒刷新用户列表（用于更新延迟等动态数据）
                this._refreshTimer = setInterval(() => {
                  this.refreshUsers();
                }, 5000);
              } else {
                throw new Error(response.message || "Not authorized as admin");
              }
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          async refreshUsers() {
            if (!this.connected || !this._adminUser) return;
            try {
              const response = await this._adminUser.listUsers(WS_URL, {
                page: this.currentPage,
                pageSize: this.pageSize,
              });
              if (response.status === "ok") {
                this._applyUsersResponse(response);
              }
            } catch (e) {
              console.error("refreshUsers failed:", e);
            }
          },

          /**
           * 跳转到指定页
           */
          async goToPage(page) {
            if (!this.connected || !this._adminUser) return;
            page = Math.max(1, Math.min(page, this.totalPages || 1));
            if (page === this.currentPage) return;
            this.currentPage = page;
            try {
              const response = await this._adminUser.listUsers(WS_URL, {
                page: this.currentPage,
                pageSize: this.pageSize,
              });
              if (response.status === "ok") {
                this._applyUsersResponse(response);
              }
            } catch (e) {
              console.error("goToPage failed:", e);
            }
          },

          goFirstPage() { this.goToPage(1); },
          goPrevPage() { this.goToPage(this.currentPage - 1); },
          goNextPage() { this.goToPage(this.currentPage + 1); },
          goLastPage() { this.goToPage(this.totalPages); },

          changePageSize(event) {
            const newSize = parseInt(event.target.value, 10);
            if (newSize === this.pageSize) return;
            this.pageSize = newSize;
            this.currentPage = 1;
            this.refreshUsers();
          },

          /**
           * 将 listUsers 响应应用到视图状态
           */
          _applyUsersResponse(response) {
            this.totalUsers = response.total || 0;
            this.currentPage = response.page || 1;
            this.pageSize = response.page_size || this.pageSize;
            this.totalPages = Math.max(
              1,
              Math.ceil(this.totalUsers / this.pageSize),
            );
            this.users = (response.users || []).map((u) => ({
              ...u,
              avatar: (u.username || "?")[0].toUpperCase(),
              isSelf: u.userId === this.adminUserId,
              isAdmin: u.userId === this.adminUserId,
              connectedTime: this._formatTime(u.connectedAt),
            }));
          },

          async kickUser(userId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectUser(WS_URL, userId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickUser failed:", e);
            }
          },

          async kickSession(userId, sessionId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectSession(
                WS_URL,
                userId,
                sessionId,
              );
              await this.refreshUsers();
            } catch (e) {
              console.error("kickSession failed:", e);
            }
          },

          _formatTime(epochMs) {
            if (!epochMs) return "";
            const d = new Date(epochMs);
            const pad = (n) => String(n).padStart(2, "0");
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          },

          _onClose() {
            this.connected = false;
            this.users = [];
            this.currentPage = 1;
            this.totalUsers = 0;
            this.totalPages = 0;
            if (this._refreshTimer) {
              clearInterval(this._refreshTimer);
              this._refreshTimer = null;
            }
          },
        },

        attached() {
          this.connect();
        },

        detached() {
          if (this._refreshTimer) {
            clearInterval(this._refreshTimer);
            this._refreshTimer = null;
          }
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
