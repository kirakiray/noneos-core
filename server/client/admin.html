  <script>
    export default async ({ query, load }) => {
      const { getAdmin, WS_URL } = await load("./admin-shared.js");

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          adminUsername: "",
          adminUserId: "",
          users: [],
          currentPage: 1,
          pageSize: 20,
          totalUsers: 0,
          totalPages: 0,
          trafficOpen: false,
          trafficData: null,
          groupByUser: false,
          _adminUser: null,
          _refreshTimer: null,
        },

        proto: {
          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              if (!this._adminUser) {
                const { adminUser, adminInfo } = await getAdmin(load);
                this._adminUser = adminUser;
                this.adminUserId = adminInfo.userId;
                this.adminUsername = adminInfo.username;

                adminUser.addEventListener("close", () => this._onClose());
              }

              // 通过执行 list_users 验证管理员身份并获取初始数据（同时加载第一页）
              this.currentPage = 1;
              const response = await this._adminUser.listUsers(WS_URL, {
                page: 1,
                pageSize: this.pageSize,
              });

              if (response.status === "ok") {
                this.connected = true;
                this.connecting = false;
                this._applyUsersResponse(response);

                // 自动每 5 秒刷新用户列表（用于更新延迟等动态数据）
                this._refreshTimer = setInterval(() => {
                  this.refreshUsers();
                }, 5000);
              } else {
                throw new Error(response.message || "Not authorized as admin");
              }
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          async refreshUsers() {
            if (!this.connected || !this._adminUser) return;
            try {
              const response = await this._adminUser.listUsers(WS_URL, {
                page: this.currentPage,
                pageSize: this.pageSize,
              });
              if (response.status === "ok") {
                this._applyUsersResponse(response);
              }
            } catch (e) {
              console.error("refreshUsers failed:", e);
            }
          },

          /**
           * 跳转到指定页
           */
          async goToPage(page) {
            if (!this.connected || !this._adminUser) return;
            page = Math.max(1, Math.min(page, this.totalPages || 1));
            if (page === this.currentPage) return;
            this.currentPage = page;
            try {
              const response = await this._adminUser.listUsers(WS_URL, {
                page: this.currentPage,
                pageSize: this.pageSize,
              });
              if (response.status === "ok") {
                this._applyUsersResponse(response);
              }
            } catch (e) {
              console.error("goToPage failed:", e);
            }
          },

          goFirstPage() { this.goToPage(1); },
          goPrevPage() { this.goToPage(this.currentPage - 1); },
          goNextPage() { this.goToPage(this.currentPage + 1); },
          goLastPage() { this.goToPage(this.totalPages); },

          changePageSize(event) {
            const newSize = parseInt(event.target.value, 10);
            if (newSize === this.pageSize) return;
            this.pageSize = newSize;
            this.currentPage = 1;
            this.refreshUsers();
          },

          /**
           * 按 userId 分组计算属性
           * 将扁平的 session 列表按用户分组，返回用户数组
           * 每个用户包含：userId, username, avatar, isAdmin, isSelf, sessionCount, sessions[]
           */
          get userGroups() {
            const groups = {};
            for (const u of this.users) {
              if (!groups[u.userId]) {
                groups[u.userId] = {
                  userId: u.userId,
                  username: u.username,
                  avatar: u.avatar,
                  isAdmin: u.isAdmin,
                  isSelf: u.isSelf,
                  sessions: [],
                  sessionCount: 0,
                };
              }
              groups[u.userId].sessions.push(u);
              groups[u.userId].sessionCount++;
            }
            return Object.values(groups);
          },

          /**
           * 将 listUsers 响应应用到视图状态
           */
          _applyUsersResponse(response) {
            this.totalUsers = response.total || 0;
            this.currentPage = response.page || 1;
            this.pageSize = response.page_size || this.pageSize;
            this.totalPages = Math.max(
              1,
              Math.ceil(this.totalUsers / this.pageSize),
            );
            this.users = (response.users || []).map((u) => ({
              ...u,
              avatar: (u.username || "?")[0].toUpperCase(),
              isSelf: u.userId === this.adminUserId,
              isAdmin: u.userId === this.adminUserId,
              connectedTime: this._formatTime(u.connectedAt),
            }));
          },

          async kickUser(userId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectUser(WS_URL, userId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickUser failed:", e);
            }
          },

          async kickSession(userId, sessionId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectSession(
                WS_URL,
                userId,
                sessionId,
              );
              await this.refreshUsers();
            } catch (e) {
              console.error("kickSession failed:", e);
            }
          },

          _formatTime(epochMs) {
            if (!epochMs) return "";
            const d = new Date(epochMs);
            const pad = (n) => String(n).padStart(2, "0");
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          },

          _onClose() {
            this.connected = false;
            this.users = [];
            this.currentPage = 1;
            this.totalUsers = 0;
            this.totalPages = 0;
            this.trafficOpen = false;
            this.trafficData = null;
            if (this._refreshTimer) {
              clearInterval(this._refreshTimer);
              this._refreshTimer = null;
            }
          },

          // ───── 流量统计 ─────

          get hasTrafficUsers() {
            return this.trafficData && this.trafficData.users && this.trafficData.users.length > 0;
          },

          get hasTrafficTimeDist() {
            return this.trafficData && this.trafficData.time_distribution && this.trafficData.time_distribution.length > 0;
          },

          get trafficTimeDistCount() {
            return this.trafficData && this.trafficData.time_distribution ? this.trafficData.time_distribution.length : 0;
          },

          get trafficInbound() {
            return this.formatBytes(this.trafficData?.global?.inbound_bytes);
          },

          get trafficOutbound() {
            return this.formatBytes(this.trafficData?.global?.outbound_bytes);
          },

          get trafficRelayForwarded() {
            return this.formatBytes(this.trafficData?.global?.relay_forwarded_bytes);
          },

          get trafficHandshake() {
            return this.formatBytes(this.trafficData?.global?.handshake_bytes);
          },

          get trafficUserRowsHtml() {
            if (!this.hasTrafficUsers) return "";
            const pad = (n) => String(n).padStart(2, "0");
            return this.trafficData.users.map(u => {
              const name = u.username || (u.user_id ? u.user_id.slice(0, 8) : "?");
              return '<tr>'
                + '<td>' + this._escapeHtml(name) + '</td>'
                + '<td style="text-align:right">' + u.session_count + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.inbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.outbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.relay_forwarded_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(u.handshake_bytes) + '</td>'
                + '</tr>';
            }).join("");
          },

          get trafficTimeRowsHtml() {
            if (!this.hasTrafficTimeDist) return "";
            const pad = (n) => String(n).padStart(2, "0");
            return this.trafficData.time_distribution.map(b => {
              const d = new Date(b.minute_epoch * 60 * 1000);
              const time = pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
              return '<tr>'
                + '<td>' + time + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(b.inbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(b.outbound_bytes) + '</td>'
                + '<td style="text-align:right">' + this.formatBytes(b.relay_forwarded_bytes) + '</td>'
                + '</tr>';
            }).join("");
          },

          _escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          },

          async showTraffic() {
            this.trafficOpen = true;
            this.trafficData = null;
            await this.refreshTraffic();
          },

          async refreshTraffic() {
            if (!this.connected || !this._adminUser) return;
            try {
              const result = await this._adminUser.getTrafficStats(WS_URL);
              if (result.status === "ok") {
                this.trafficData = result.traffic;
              }
            } catch (e) {
              console.error("refreshTraffic failed:", e);
            }
          },

          formatBytes(bytes) {
            if (bytes == null || bytes === 0) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            const val = bytes / Math.pow(1024, i);
            return val.toFixed(i > 0 ? 1 : 0) + " " + units[i];
          },
        },

        attached() {
          this.connect();
        },

        detached() {
          if (this._refreshTimer) {
            clearInterval(this._refreshTimer);
            this._refreshTimer = null;
          }
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
