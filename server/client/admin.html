<template page>
  <style>

    #refreshBtn {

      margin-bottom: 12px;

    .kick-all-btn {

    }
  </style>

  <div class="container">

    <div
      class="status-bar"
      class:connected="connected"
      class:disconnected="!connected"
    >
      <span>{{connected ? '已连接' : '未连接'}}</span>
      <span :style.display="connected ? '' : 'none'">— {{adminUsername}}</span>
    </div>

    <div class="controls">
      <button id="refreshBtn" on:click="refreshUsers" :disabled="!connected">
        刷新用户列表
      </button>
    </div>

    <div class="user-count" :style.display="connected ? '' : 'none'">
      在线用户：{{users.length}} 人
    </div>

    <div class="card-grid">
      <o-fill :value="users">
        <div class="user-card">
          <div class="card-header">
            <div class="user-avatar" class:admin="$data.isAdmin">{{$data.avatar}}</div>
            <div>
              <div class="card-username">{{$data.username}}</div>
              <div class="card-detail">
                <span class="card-addr">{{$data.host || $data.addr}}</span>
                <span
                  class="latency-badge"
                  class:high="$data.latencyMs > 200"
                  :style.display="$data.latencyMs != null ? '' : 'none'"
                >{{$data.latencyMs}}ms</span>
              </div>
            </div>
            <div class="card-badges">
              <span
                class="admin-badge"
                :style.display="$data.isAdmin ? '' : 'none'"
              >管理员</span>
            </div>
          </div>
          <div class="card-detail">
            <span>连接时间：{{$data.connectedTime}}</span>
            <span>Session：{{$data.sessionId}}</span>
          </div>
          <div class="card-actions" :style.display="$data.isSelf ? 'none' : ''">
            <button
              class="kick-btn"
              on:click="$host.kickSession($data.userId, $data.sessionId)"
              :disabled="$data.isSelf"
            >
              断开会话
            </button>
            <button
              class="kick-all-btn"
              on:click="$host.kickUser($data.userId)"
              :disabled="$data.isSelf"
            >
              断开所有
            </button>
          </div>
        </div>
      </o-fill>
    </div>

    <div
      class="empty-state"
      :style.display="users.length === 0 && connected ? '' : 'none'"
    >
      暂无在线用户
    </div>
  </div>

  <script>
    export default async ({ query, load }) => {
      const { getAdmin, WS_URL } = await load("./admin-shared.js");

      return {
        parent: "./layout.html",
        data: {
          connected: false,
          connecting: false,
          adminUsername: "",
          adminUserId: "",
          users: [],
          _adminUser: null,
          _refreshTimer: null,
        },

        proto: {
          async connect() {
            if (this.connecting || this.connected) return;
            this.connecting = true;

            try {
              if (!this._adminUser) {
                const { adminUser, adminInfo } = await getAdmin(load);
                this._adminUser = adminUser;
                this.adminUserId = adminInfo.userId;
                this.adminUsername = adminInfo.username;

                adminUser.addEventListener("close", () => this._onClose());
              }

              // 通过执行 list_users 验证管理员身份并获取初始数据
              const response = await this._adminUser.listUsers(WS_URL);

              if (response.status === "ok") {
                this.connected = true;
                this.connecting = false;
                this.users = (response.users || []).map((u) => ({
                  ...u,
                  avatar: (u.username || "?")[0].toUpperCase(),
                  isSelf: u.userId === this.adminUserId,
                  isAdmin: u.userId === this.adminUserId,
                  connectedTime: this._formatTime(u.connectedAt),
                }));

                // 自动每 5 秒刷新用户列表（用于更新延迟等动态数据）
                this._refreshTimer = setInterval(() => {
                  this.refreshUsers();
                }, 5000);
              } else {
                throw new Error(response.message || "Not authorized as admin");
              }
            } catch (e) {
              console.error("Connect failed:", e);
              this.connecting = false;
            }
          },

          async refreshUsers() {
            if (!this.connected || !this._adminUser) return;
            try {
              const response = await this._adminUser.listUsers(WS_URL);
              if (response.status === "ok") {
                this.users = (response.users || []).map((u) => ({
                  ...u,
                  avatar: (u.username || "?")[0].toUpperCase(),
                  isSelf: u.userId === this.adminUserId,
                  isAdmin: u.userId === this.adminUserId,
                  connectedTime: this._formatTime(u.connectedAt),
                }));
              }
            } catch (e) {
              console.error("refreshUsers failed:", e);
            }
          },

          async kickUser(userId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectUser(WS_URL, userId);
              await this.refreshUsers();
            } catch (e) {
              console.error("kickUser failed:", e);
            }
          },

          async kickSession(userId, sessionId) {
            if (!this.connected || !this._adminUser) return;
            if (userId === this.adminUserId) return;
            try {
              await this._adminUser.disconnectSession(
                WS_URL,
                userId,
                sessionId,
              );
              await this.refreshUsers();
            } catch (e) {
              console.error("kickSession failed:", e);
            }
          },

          _formatTime(epochMs) {
            if (!epochMs) return "";
            const d = new Date(epochMs);
            const pad = (n) => String(n).padStart(2, "0");
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          },

          _onClose() {
            this.connected = false;
            this.users = [];
            if (this._refreshTimer) {
              clearInterval(this._refreshTimer);
              this._refreshTimer = null;
            }
          },
        },

        attached() {
          this.connect();
        },

        detached() {
          if (this._refreshTimer) {
            clearInterval(this._refreshTimer);
            this._refreshTimer = null;
          }
          this._adminUser = null;
        },
      };
    };
  </script>
</template>
