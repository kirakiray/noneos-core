[package]
name = "noneos-handshake"
version = "3.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
sysinfo = "0.33"
redb = "4.1.0"
bincode = "1.3"
dashmap = "6.0"
