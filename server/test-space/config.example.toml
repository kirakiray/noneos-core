port = 8081
host = "localhost"
admin_user_id = "1507fd839f80f8b8dd59c1dd3560510f8b70a6ef3c2904c9123879c4f556c981"
handshake_timeout_secs = 1

# 握手响应最大字节数（包含 userId/sessionId/username/challenge/签名等，默认 1024）
handshake_max_size = 1024

# 文本消息（JSON 命令）最大字节数（默认 256KB）
text_message_max_size = 262144

# 二进制 relay 帧负载最大字节数（默认 256KB）
binary_payload_max_size = 262144

# 每个 userId 的最大并发 session 数（默认 10）
max_sessions_per_user = 10

# 单连接在窗口时间内允许 relay 到不存在 session 的最大失败次数（默认 10）
relay_fail_limit = 10

# relay 失败计数窗口时间（秒，默认 60）
relay_fail_window_secs = 60

# 流量统计数据库文件路径（不配置则仅内存统计，重启丢失）
traffic_db_path = "config.example.db"

# 流量统计数据落盘间隔（秒，默认 60）
traffic_flush_interval_secs = 60

# 测试环境关闭内存过载保护
max_memory_usage_percent = 999
