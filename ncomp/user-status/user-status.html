<template component>
  <style>
    :host {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      overflow: hidden;
    }

    .dot {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background-color: var(--md-sys-color-surface-container);
      transition: background-color 0.2s ease;
    }

    .dot.primary {
      background-color: var(--md-sys-color-primary);
    }

    .dot.success {
      background-color: var(--md-sys-color-success);
    }

    .dot.error {
      background-color: var(--md-sys-color-error);
    }
  </style>
  <div
    class="dot"
    part="dot"
    class:primary="status === 'primary'"
    class:success="status === 'success'"
    class:error="status === 'error'"
  ></div>
  <script>
    import { getUser } from "/nos/user/main.js";

    const NAMESPACE = "default";

    export default async () => {
      return {
        tag: "n-user-status",
        attrs: {
          userId: "",
        },
        data: {
          namespace: NAMESPACE,
          status: "",
        },
        watch: {
          userId(val) {
            if (val) {
              this._check();
            } else {
              this.status = "";
            }
          },
        },
        proto: {
          _checkToken: 0,
          async _check() {
            const uid = this.userId;
            if (!uid) {
              this.status = "";
              return;
            }

            const token = ++this._checkToken;

            try {
              const user = await getUser(this.namespace);

              if (token !== this._checkToken) return;

              const isOnline = await user.isRemoteUserOnline(uid);

              if (token !== this._checkToken) return;

              if (!isOnline) {
                this.status = "error";
                return;
              }

              const hasRtc = await this._hasRtcConnection(user, uid);

              if (token !== this._checkToken) return;

              this.status = hasRtc ? "success" : "primary";
            } catch {
              if (token !== this._checkToken) return;
              this.status = "";
            }
          },
          async _hasRtcConnection(user, uid) {
            const remoteUsers = user.remoteUsers;
            const remoteUser = remoteUsers.find((ru) => ru.userId === uid);
            if (!remoteUser) return false;

            const sessionIds = await remoteUser.getSessionIds();
            for (const sid of sessionIds) {
              const dc = user.rtc.getChannel(uid, sid);
              if (dc?.readyState === "open") return true;
            }
            return false;
          },
          _onUserEvent(event) {
            const { userId } = event.detail || {};
            if (userId === this.userId) {
              this._check();
            }
          },
          _onVisibilityChange() {
            if (document.visibilityState === "visible" && this.userId) {
              this._check();
            }
          },
        },
        async attached() {
          if (this.attr("namespace")) {
            this.namespace = this.attr("namespace");
          }

          if (this.userId) {
            this._check();
          }

          const user = await getUser(this.namespace);
          const handler = (e) => this._onUserEvent(e);

          this._handlers = {
            rtc_state: handler,
            remote_user_connected: handler,
            remote_user_disconnected: handler,
          };

          this._unbindRtc = user.bind("rtc_state", this._handlers.rtc_state);
          this._unbindConnected = user.bind(
            "remote_user_connected",
            this._handlers.remote_user_connected,
          );
          this._unbindDisconnected = user.bind(
            "remote_user_disconnected",
            this._handlers.remote_user_disconnected,
          );

          // 低频轮询：兜底刷新在线状态（对端下线目前无主动推送）
          this._pollTimer = setInterval(() => {
            if (this.userId) {
              this._check();
            }
          }, 30000);

          // 页面重新可见时立即刷新一次
          this._visibilityHandler = () => this._onVisibilityChange();
          document.addEventListener("visibilitychange", this._visibilityHandler);
        },
        detached() {
          if (this._unbindRtc) this._unbindRtc();
          if (this._unbindConnected) this._unbindConnected();
          if (this._unbindDisconnected) this._unbindDisconnected();
          if (this._pollTimer) {
            clearInterval(this._pollTimer);
            this._pollTimer = null;
          }
          if (this._visibilityHandler) {
            document.removeEventListener("visibilitychange", this._visibilityHandler);
            this._visibilityHandler = null;
          }
        },
      };
    };
  </script>
</template>
