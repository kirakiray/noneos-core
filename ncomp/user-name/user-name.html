<template component>
  <style>
    :host {
      display: inline;
    }
  </style>
  <span>{{displayName}}</span>
  <script>
    import { getUser } from "/nos/user/main.js";

    const NAMESPACE = "default";

    export default async () => {
      return {
        tag: "n-user-name",
        attrs: {
          userId: "",
          force: null,
        },
        data: {
          displayName: "",
          namespace: NAMESPACE,
          // 调试信息：最近一次加载失败的步骤与原始错误（load:step:message），
          // 供测试与排查使用，不影响正常渲染
          lastLoadError: "",
          lastLoadErrors: [],
        },
        watch: {
          userId(val) {
            this.displayName = val || "";
            if (val) this._loadWithRetry();
          },
          force() {
            if (this.userId) this._loadWithRetry();
          },
        },
        proto: {
          _recordError(step, err) {
            this.lastLoadError =
              `${step}: ${err?.message ?? err} | ${err?.stack ?? ""}`;
            this.lastLoadErrors.push(this.lastLoadError);
          },
          // 加载失败后的自动重试：底层 requestProfile 有超时重试但可能超过
          // 调用方等待窗口（如连接尚未就绪），这里再兜底几轮，间隔递增
          async _loadWithRetry(retries = 3) {
            const uid = this.userId;
            const loader =
              this.attr("force") !== null
                ? () => this._forceLoadUserName()
                : () => this._loadUserName();
            for (let attempt = 1; attempt <= retries; attempt++) {
              // userId 已被改成别人，放弃本轮加载（新一轮 watch 会接手）
              if (this.userId !== uid) return;
              try {
                await loader();
              } catch (err) {
                this._recordError("loadRetry", err);
              }
              // 显示已从 userId 变为用户名视为成功
              if (this.displayName && this.displayName !== uid) {
                return;
              }
              if (attempt < retries) {
                await new Promise((r) => setTimeout(r, attempt * 1000));
              }
            }
          },
          async _loadUserName() {
            const uid = this.userId;
            if (!uid) return;

            try {
              const user = await getUser(this.namespace);
              if (user.userId === uid) {
                const info = await user.getInfo();
                if (this.userId === uid) this.displayName = info.username;
                return;
              }
              const profile = await user.cred.getProfile(uid);
              if (profile && profile.username) {
                if (this.userId === uid) this.displayName = profile.username;
              } else {
                this._recordError("getProfile", new Error(
                  profile ? "profile has no username" : "profile not found",
                ));
              }
            } catch (err) {
              this._recordError("loadUserName", err);
            }
          },
          async _forceLoadUserName() {
            const uid = this.userId;
            if (!uid) return;

            try {
              const user = await getUser(this.namespace);
              if (user.userId === uid) {
                const info = await user.getInfo();
                if (this.userId === uid) this.displayName = info.username;
                return;
              }
              // 尝试连接用户触发资料交换
              try {
                await user.connectUser(uid);
              } catch (err) {
                this._recordError("connectUser", err);
              }
              // 直接发起网络请求刷新资料（不先删缓存）：
              // 失败时保留旧资料显示，成功时按 signTime 保留更新的
              const profile = await user.cred.requestProfile(uid);
              if (profile && profile.username) {
                if (this.userId === uid) this.displayName = profile.username;
              } else {
                this._recordError("requestProfile", new Error(
                  profile ? "profile has no username" : "profile is null",
                ));
              }
            } catch (err) {
              this._recordError("forceLoadUserName", err);
            }
          },
        },
        async attached() {
          if (!this.displayName && this.userId) {
            this.displayName = this.userId;
            this._loadWithRetry();
          }

          if (this.attr("namespace")) {
            this.namespace = this.attr("namespace");
          }
        },
      };
    };
  </script>
</template>
