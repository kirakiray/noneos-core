<template component>
  <style>
    :host {
      display: inline;
    }
  </style>
  <span>{{displayName}}</span>
  <script>
    import { getUser } from "/nos/user/main.js";

    const NAMESPACE = "default";

    export default async () => {
      return {
        tag: "n-user-name",
        attrs: {
          userId: "",
          force: null,
        },
        data: {
          displayName: "",
          namespace: NAMESPACE,
          // 调试信息：最近一次加载失败的步骤与原始错误（load:step:message），
          // 供测试与排查使用，不影响正常渲染
          lastLoadError: "",
        },
        watch: {
          userId(val) {
            this.displayName = val || "";
            if (val) this._load();
          },
          force() {
            if (this.userId) this._load();
          },
        },
        proto: {
          _recordError(step, err) {
            this.lastLoadError =
              `${step}: ${err?.message ?? err} | ${err?.stack ?? ""}`;
          },
          _load() {
            if (this.attr("force") !== null) {
              return this._forceLoadUserName();
            }
            return this._loadUserName();
          },
          async _loadUserName() {
            const uid = this.userId;
            if (!uid) return;

            try {
              const user = await getUser(this.namespace);
              if (user.userId === uid) {
                const info = await user.getInfo();
                this.displayName = info.username;
                return;
              }
              const card = await user.card.get(uid);
              if (card && card.username) {
                this.displayName = card.username;
              } else {
                this._recordError("getCard", new Error(
                  card ? "card has no username" : "card not found",
                ));
              }
            } catch (err) {
              this._recordError("loadUserName", err);
            }
          },
          async _forceLoadUserName() {
            const uid = this.userId;
            if (!uid) return;

            try {
              const user = await getUser(this.namespace);
              if (user.userId === uid) {
                const info = await user.getInfo();
                this.displayName = info.username;
                return;
              }
              // 尝试连接用户触发名片交换
              try {
                await user.connectUser(uid);
              } catch (err) {
                this._recordError("connectUser", err);
              }
              // 直接发起网络请求刷新名片（不先删缓存）：
              // 失败时保留旧名片显示，成功时按 signTime 保留更新的
              const card = await user.card.requestCard(uid);
              if (card && card.username) {
                this.displayName = card.username;
              } else {
                this._recordError("requestCard", new Error(
                  card ? "card has no username" : "card is null",
                ));
              }
            } catch (err) {
              this._recordError("forceLoadUserName", err);
            }
          },
        },
        async attached() {
          if (!this.displayName && this.userId) {
            this.displayName = this.userId;
            this._load();
          }

          if (this.attr("namespace")) {
            this.namespace = this.attr("namespace");
          }
        },
      };
    };
  </script>
</template>
