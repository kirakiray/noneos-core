<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>user-name 组件测试</title>
    <!-- <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@latest/dist/ofa.mjs#debug"
      type="module"
    ></script> -->
    <script src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@latest/dist/ofa.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <h1>user-name 组件测试</h1>

    <l-m src="./user-name.html"></l-m>

    <!-- 各测试用例使用的静态元素 -->
    <n-user-name id="name3"></n-user-name>
    <div id="query-target"></div>
    <div id="default-target"></div>
    <div id="force-target"></div>
    <n-user-name id="change-userid"></n-user-name>
    <n-user-name user-id="nonexistent-user-999999999" id="name4"></n-user-name>

    <!-- ============ 创建测试用户，正常获取用户名显示 ============ -->
    <sb-test name="创建测试用户修改名称后用 user-name 显示">
      <template>
        <script type="module">
          {
            const { getUser } = await import("/nos/user/main.js");

            // 创建独立测试用户
            const testUser = await getUser("test-name-user1");
            const targetUserId = testUser.userId;

            // 设置用户名称
            await testUser.updateInfo({ username: "测试昵称" });
            const info = await testUser.getInfo();
            const expectedUsername = info.username;

            // 等待测试用户完成服务器连接，确保 default 用户能够查询到其在线状态并交换名片
            for (let i = 0; i < 50; i++) {
              if (testUser.server.connectedUrls.length > 0) break;
              await new Promise((r) => setTimeout(r, 100));
            }

            const container = $("#query-target");
            container.html = `<n-user-name user-id="${targetUserId}"></n-user-name>`;
            await new Promise((r) => setTimeout(r, 50));
            const el = container.$("n-user-name");

            // 轮询等待 displayName 更新，避免固定等待时间不足导致的时序抖动
            // 组件可能尚未初始化完成，el.shadow 可能为 null，用 try/catch 保护
            let afterQuery;
            let matched = false;
            for (let i = 0; i < 50; i++) {
              try {
                afterQuery = el.shadow.$("span").text;
                if (afterQuery === expectedUsername) {
                  matched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }

            return {
              assert: matched,
              content: { targetUserId, expectedUsername, afterQuery },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ============ 更新名称后 force 强制刷新 ============ -->
    <sb-test name="updateInfo 后设置 force 刷新用户名">
      <template>
        <script type="module">
          {
            const { getUser } = await import("/nos/user/main.js");

            const testUser = await getUser("test-name-user2");
            const targetUserId = testUser.userId;

            const newUserName = "新名称_" + Math.random().toString(36).slice(2);

            // 先设置一个初始名称
            await testUser.updateInfo({ username: newUserName });

            // 等待测试用户与 default 用户（请求方）都完成服务器连接，
            // （WebKit 上 getUser 后的自动连接较慢，不等待会导致 force 模式
            //   connectUser / findSessionId 找不到对方、显示 userId）
            const defaultUser0 = await getUser("default");
            // 双方各连上至少一个服务器后，还要等目标在 default 已连接的
            // 服务器上真实可见（双方连接完成顺序可能不同，只看 connectedUrls
            // 会留下 findSessionId 查不到目标的竞态窗口）
            let targetVisible = false;
            for (let i = 0; i < 100 && !targetVisible; i++) {
              if (
                testUser.server.connectedUrls.length > 0 &&
                defaultUser0.server.connectedUrls.length > 0
              ) {
                for (const url of defaultUser0.server.connectedUrls) {
                  try {
                    const r = await defaultUser0.server.queryUserOnline(url, targetUserId);
                    if (r.online && (r.sessions || []).length > 0) {
                      targetVisible = true;
                      break;
                    }
                  } catch (_) {}
                }
              }
              if (!targetVisible) {
                await new Promise((r) => setTimeout(r, 100));
              }
            }

            const container = $("#force-target");
            container.html = `<n-user-name user-id="${targetUserId}" force></n-user-name>`;
            await new Promise((r) => setTimeout(r, 50));
            const el = container.$("n-user-name");

            // 轮询等待 force 刷新后的用户名生效
            let afterForce;
            let matched = false;
            let lastErrorSeen = "";
            let displayHistory = [];
            // 轮询需覆盖组件 3 轮重试（1s + 2s 退避 + 每轮 ~1s 查询），
            // 上限 100 次防止在第 3 轮成功前提前判死
            for (let i = 0; i < 100; i++) {
              try {
                afterForce = el.shadow.$("span").text;
                if (displayHistory[displayHistory.length - 1] !== afterForce) {
                  displayHistory.push(afterForce);
                }
                if (afterForce === newUserName) {
                  matched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              lastErrorSeen = el.lastLoadError || lastErrorSeen;
              await new Promise((r) => setTimeout(r, 100));
            }
            lastErrorSeen = el.lastLoadError || lastErrorSeen;

            // 请求方（default 用户）视角：连接了哪些服务器、
            // 目标在这些服务器上是否可见
            const defaultUser = await getUser("default");
            const targetVisibleOn = [];
            for (const url of defaultUser.server.connectedUrls) {
              try {
                const r = await defaultUser.server.queryUserOnline(url, targetUserId);
                targetVisibleOn.push(`${url}: online=${r.online} sessions=${(r.sessions || []).length}`);
              } catch (e) {
                targetVisibleOn.push(`${url}: query failed: ${e.message}`);
              }
            }

            return {
              assert: matched,
              content: {
                targetUserId,
                newUserName,
                afterForce,
                lastLoadError: lastErrorSeen,
                lastLoadErrors: Array.from(el.lastLoadErrors || []).map(String),
                displayHistory,
                connectedUrls: testUser.server.connectedUrls,
                defaultConnectedUrls: defaultUser.server.connectedUrls,
                targetVisibleOn,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ============ 修改 userId 后用户名跟随更新 ============ -->
    <sb-test name="修改 userId 后更新显示为新用户">
      <template>
        <script type="module">
          {
            const { getUser } = await import("/nos/user/main.js");

            const userA = await getUser("test-user-a");
            const userB = await getUser("test-user-b");
            await userA.updateInfo({ username: "用户A" });
            await userB.updateInfo({ username: "用户B" });

            // 等待两个测试用户完成服务器连接（WebKit 上自动连接较慢），
            // 确保 default 用户后续能连到对方并交换名片
            for (let i = 0; i < 50; i++) {
              if (
                userA.server.connectedUrls.length > 0 &&
                userB.server.connectedUrls.length > 0
              ) break;
              await new Promise((r) => setTimeout(r, 100));
            }

            const el = $("#change-userid");
            el.attr("user-id", userA.userId);
            // 轮询等待用户 A 名称生效
            let firstText;
            let firstMatched = false;
            for (let i = 0; i < 50; i++) {
              try {
                firstText = el.shadow.$("span").text;
                if (firstText === "用户A") {
                  firstMatched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }

            el.attr("user-id", userB.userId);
            // 轮询等待用户 B 名称生效
            let secondText;
            let secondMatched = false;
            for (let i = 0; i < 50; i++) {
              try {
                secondText = el.shadow.$("span").text;
                if (secondText === "用户B") {
                  secondMatched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }

            return {
              assert: firstMatched && secondMatched,
              content: {
                firstText,
                secondText,
                lastLoadError: el.lastLoadError,
                aConnected: userA.server.connectedUrls,
                bConnected: userB.server.connectedUrls,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ============ 使用 default 用户的 userId 显示 ============ -->
    <sb-test name="使用 default 用户的 userId 显示用户名">
      <template>
        <script type="module">
          {
            const { getUser } = await import("/nos/user/main.js");

            const defaultUser = await getUser("default");
            const targetUserId = defaultUser.userId;
            const info = await defaultUser.getInfo();
            const expectedUsername = info.username;

            const container = $("#default-target");
            container.html = `<n-user-name user-id="${targetUserId}"></n-user-name>`;
            await new Promise((r) => setTimeout(r, 50));
            const el = container.$("n-user-name");

            // 轮询等待 default 用户名称生效
            let afterQuery;
            let matched = false;
            for (let i = 0; i < 50; i++) {
              try {
                afterQuery = el.shadow.$("span").text;
                if (afterQuery === expectedUsername) {
                  matched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }

            return {
              assert: matched,
              content: {
                targetUserId,
                expectedUsername,
                afterQuery,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ============ 空 userId ============ -->
    <sb-test name="未设置 userId 时显示空内容">
      <template>
        <script type="module">
          {
            // 轮询等待组件就绪，读取到空文本即视为通过
            let text;
            let matched = false;
            for (let i = 0; i < 50; i++) {
              try {
                text = $("#name3").shadow.$("span").text;
                if (text === "") {
                  matched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }
            return {
              assert: matched,
              content: { text, expected: "" },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ============ 查询不存在的用户 ============ -->
    <sb-test name="查询不存在的用户时保持显示 userId">
      <template>
        <script type="module">
          {
            const el = $("#name4");
            const fakeId = "nonexistent-user-999999999";

            // 轮询等待占位文本渲染成功
            let before;
            let beforeMatched = false;
            for (let i = 0; i < 50; i++) {
              try {
                before = el.shadow.$("span").text;
                if (before === fakeId) {
                  beforeMatched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }

            // 再次轮询等待，验证一段时间后仍显示 userId（不会被查询流程覆盖）
            let after;
            let afterMatched = false;
            for (let i = 0; i < 50; i++) {
              try {
                after = el.shadow.$("span").text;
                if (after === fakeId) {
                  afterMatched = true;
                  break;
                }
              } catch (_) {
                // shadow 尚未就绪，忽略并等待下一轮
              }
              await new Promise((r) => setTimeout(r, 100));
            }
            return {
              assert: beforeMatched && afterMatched,
              content: {
                fakeId,
                before,
                after,
              },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
