      <article class="markdown-body">
        <h1>File Change Observation</h1>
        <p>This document describes how to use the <code>observe</code> method to monitor file or directory change events.</p>
        <h2>Basic Usage</h2>
        <p>Use the <code>observe()</code> method to monitor changes in files or directories:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { get } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;/nos/fs/main.js&quot;</span>;

<span class="hljs-keyword">const</span> dir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;my-app&quot;</span>);

<span class="hljs-keyword">const</span> events = [];
<span class="hljs-keyword">const</span> unobserve = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">observe</span>(<span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;File change event received:&quot;</span>, event);
  events.<span class="hljs-title function_">push</span>(event);
});

<span class="hljs-comment">// Create file</span>
<span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;test.txt&quot;</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">&quot;file&quot;</span> });
<span class="hljs-keyword">await</span> file.<span class="hljs-title function_">write</span>(<span class="hljs-string">&quot;Hello&quot;</span>);

<span class="hljs-comment">// Delete file</span>
<span class="hljs-keyword">await</span> file.<span class="hljs-title function_">remove</span>();

<span class="hljs-comment">// Stop observing</span>
<span class="hljs-title function_">unobserve</span>();</code></pre>
        <p>Both files and directories can be monitored for changes, for example, monitoring a single file:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;my-app/test.txt&quot;</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">&quot;file&quot;</span> });

<span class="hljs-keyword">const</span> unobserve = <span class="hljs-keyword">await</span> file.<span class="hljs-title function_">observe</span>(<span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;File modified:&quot;</span>, event.<span class="hljs-property">type</span>);
});

<span class="hljs-keyword">await</span> file.<span class="hljs-title function_">write</span>(<span class="hljs-string">&quot;new content&quot;</span>);

<span class="hljs-title function_">unobserve</span>();</code></pre>
        <h2>observe return value</h2>
        <p><code>observe()</code> returns a Promise that resolves to a function to cancel the observation. Calling that function can stop the listening:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> unobserve = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">observe</span>(<span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  <span class="hljs-comment">// Handle event</span>
});

<span class="hljs-comment">// Unobserve later</span>
<span class="hljs-title function_">unobserve</span>();</code></pre>
        <h2>Event Object</h2>
        <p>Observed event object received by the callback contains the following attributes:</p>
        <table>
          <thead>
            <tr>
              <th>Property</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>type</code></td>
              <td>Event type, e.g. <code>&quot;create&quot;</code>, <code>&quot;remove&quot;</code>, <code>&quot;write&quot;</code></td>
            </tr>
            <tr>
              <td><code>path</code></td>
              <td>Path of the file that changed</td>
            </tr>
          </tbody>
        </table>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { get } <span class="hljs-keyword">from</span> <span class="hljs-string">&quot;/nos/fs/main.js&quot;</span>;

<span class="hljs-keyword">const</span> dir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;my-app&quot;</span>);

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;Start file change observation test&quot;</span>);

<span class="hljs-keyword">const</span> events = [];
<span class="hljs-keyword">const</span> unobserve = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">observe</span>(<span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&quot;File change:&quot;</span>, event.<span class="hljs-property">type</span>, event.<span class="hljs-property">path</span>);
  events.<span class="hljs-title function_">push</span>(event);
});

<span class="hljs-comment">// Perform some file operations</span>
<span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;file1.txt&quot;</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">&quot;file&quot;</span> });
<span class="hljs-keyword">await</span> (<span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;file1.txt&quot;</span>)).<span class="hljs-title function_">write</span>(<span class="hljs-string">&quot;content&quot;</span>);

<span class="hljs-keyword">await</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">resolve</span>) =&gt;</span> <span class="hljs-built_in">setTimeout</span>(resolve, <span class="hljs-number">100</span>));

<span class="hljs-keyword">await</span> (<span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;file1.txt&quot;</span>)).<span class="hljs-title function_">remove</span>();

<span class="hljs-keyword">await</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Promise</span>(<span class="hljs-function">(<span class="hljs-params">resolve</span>) =&gt;</span> <span class="hljs-built_in">setTimeout</span>(resolve, <span class="hljs-number">100</span>));

<span class="hljs-title function_">unobserve</span>();

<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">`Received <span class="hljs-subst">${events.length}</span> events in total`</span>);</code></pre>
        <h2>Notes</h2>
        <ol>
          <li>The observer will only start monitoring after it is created, and previous file operations will not be captured</li>
          <li>After canceling the observation, newly occurring file changes will not be recorded</li>
          <li>File change events are triggered asynchronously and may have a certain delay</li>
        </ol>
      </article>
