      <article class="markdown-body">
        <h1>File Handle Comparison</h1>
        <p>This document describes how to compare file handles, obtain parent directories, root directories, file sizes, and unique identifiers.</p>
        <h2>Get Parent Directory</h2>
        <p>Use the <code>parent</code> property to get the parent directory of a file:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { get } <span class="hljs-keyword">from</span> <span class="hljs-string">"/nos/fs/main.js"</span>;

<span class="hljs-keyword">const</span> testDir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/a/b/c/d"</span>);
<span class="hljs-keyword">const</span> testFile = <span class="hljs-keyword">await</span> testDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"test.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">const</span> fileParentDir = <span class="hljs-keyword">await</span> testFile.<span class="hljs-property">parent</span>;

<span class="hljs-keyword">const</span> isSame = <span class="hljs-keyword">await</span> fileParentDir.<span class="hljs-title function_">isSame</span>(testDir);
<span class="hljs-comment">// isSame === true</span></code></pre>
        <h2>Get Root Directory</h2>
        <p>Use the <code>root</code> attribute to obtain the root directory to which a file or directory belongs:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> testDir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/a/b/c/d"</span>);
<span class="hljs-keyword">const</span> testFile = <span class="hljs-keyword">await</span> testDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"test.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">const</span> root = testFile.<span class="hljs-property">root</span>;

<span class="hljs-keyword">const</span> isSame = <span class="hljs-keyword">await</span> root.<span class="hljs-title function_">isSame</span>(<span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app"</span>));
<span class="hljs-comment">// isSame === true</span></code></pre>
        <h2>Determining if Handles are Identical</h2>
        <p>Use the <code>isSame()</code> method to determine whether two handles point to the same file or directory:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> dir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/path/to"</span>);
<span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"file.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"other.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });

<span class="hljs-keyword">const</span> file1 = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"file.txt"</span>);
<span class="hljs-keyword">const</span> file2 = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"file.txt"</span>);
<span class="hljs-keyword">const</span> file3 = <span class="hljs-keyword">await</span> dir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"other.txt"</span>);

<span class="hljs-keyword">const</span> result1 = <span class="hljs-keyword">await</span> file1.<span class="hljs-title function_">isSame</span>(file2);
<span class="hljs-comment">// result1 === true</span>

<span class="hljs-keyword">const</span> result2 = <span class="hljs-keyword">await</span> file1.<span class="hljs-title function_">isSame</span>(file3);
<span class="hljs-comment">// result2 === false</span></code></pre>
        <h2>Get File Size</h2>
        <p>Use the <code>size()</code> method to get the file size:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/example.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">await</span> file.<span class="hljs-title function_">write</span>(<span class="hljs-string">"Hello, World!"</span>);

<span class="hljs-keyword">const</span> fileSize = <span class="hljs-keyword">await</span> file.<span class="hljs-title function_">size</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(fileSize); <span class="hljs-comment">// 13 (bytes)</span></code></pre>
        <p>For directories, <code>size()</code> returns <code>null</code>.</p>
        <h2>Get Unique Identifier</h2>
        <p>Use the <code>id()</code> method to get the unique identifier of a file or directory:</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/example.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">const</span> id = <span class="hljs-keyword">await</span> file.<span class="hljs-title function_">id</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(id); <span class="hljs-comment">// unique hash string</span></code></pre>
        <h2>Handle Attributes</h2>
        <table>
          <thead>
            <tr>
              <th>Attribute</th>
              <th>Description</th>
              <th>Return Value</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>kind</code></td>
              <td>Handle type</td>
              <td><code>"file"</code> or <code>"dir"</code></td>
            </tr>
            <tr>
              <td><code>name</code></td>
              <td>File or directory name</td>
              <td>String</td>
            </tr>
            <tr>
              <td><code>path</code></td>
              <td>Full path</td>
              <td>String</td>
            </tr>
            <tr>
              <td><code>parent</code></td>
              <td>Parent directory</td>
              <td>DirHandle</td>
            </tr>
            <tr>
              <td><code>root</code></td>
              <td>Root directory</td>
              <td>DirHandle</td>
            </tr>
          </tbody>
        </table>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { get } <span class="hljs-keyword">from</span> <span class="hljs-string">"/nos/fs/main.js"</span>;

<span class="hljs-keyword">const</span> deepDir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/a/b/c"</span>);
<span class="hljs-keyword">const</span> deepFile = <span class="hljs-keyword">await</span> deepDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"deep.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">await</span> deepFile.<span class="hljs-title function_">write</span>(<span class="hljs-string">"Hello!"</span>);

<span class="hljs-comment">// Get parent directory</span>
<span class="hljs-keyword">const</span> parent = <span class="hljs-keyword">await</span> deepFile.<span class="hljs-property">parent</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(parent.<span class="hljs-property">name</span>); <span class="hljs-comment">// "c"</span>

<span class="hljs-comment">// Get root directory</span>
<span class="hljs-keyword">const</span> root = deepFile.<span class="hljs-property">root</span>;
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(root.<span class="hljs-property">path</span>); <span class="hljs-comment">// "my-app"</span>

<span class="hljs-comment">// Get file size</span>
<span class="hljs-keyword">const</span> size = <span class="hljs-keyword">await</span> deepFile.<span class="hljs-title function_">size</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(size); <span class="hljs-comment">// 6</span>

<span class="hljs-comment">// Get unique identifier</span>
<span class="hljs-keyword">const</span> id = <span class="hljs-keyword">await</span> deepFile.<span class="hljs-title function_">id</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(id); <span class="hljs-comment">// "abc123..."</span>

<span class="hljs-comment">// Get the same file via different path</span>
<span class="hljs-keyword">const</span> file2 = <span class="hljs-keyword">await</span> deepDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"deep.txt"</span>);
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-keyword">await</span> deepFile.<span class="hljs-title function_">isSame</span>(file2)); <span class="hljs-comment">// true</span></code></pre>
