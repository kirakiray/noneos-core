        <h1>概述</h1>
        <p>文件系统（FileSystem）是一个基于浏览器的虚拟文件系统，提供了一套完整的文件和目录操作 API。</p>
        <h2>初始化</h2>
        <p>使用文件系统前，需要先初始化一个根目录：</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { init } <span class="hljs-keyword">from</span> <span class="hljs-string">"/nos/fs/main.js"</span>;

<span class="hljs-keyword">const</span> testDir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">init</span>(<span class="hljs-string">"my-app-data"</span>);</code></pre>
        <h2>获取或创建文件/目录句柄</h2>
        <h3>通过初始化目录获取</h3>
        <p>使用 <code>get</code> 方法从已初始化的目录获取文件或目录句柄：</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> testDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"path/to/file.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">const</span> dir = <span class="hljs-keyword">await</span> testDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"path/to/dir"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"dir"</span> });</code></pre>
        <h3>全局 get 方法</h3>
        <p>如果目录已经初始化过，可以直接使用全局 <code>get</code> 方法，无需再次初始化：</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { get } <span class="hljs-keyword">from</span> <span class="hljs-string">"/nos/fs/main.js"</span>;

<span class="hljs-comment">// 之后可以直接通过全局 get 获取文件</span>
<span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/hello.txt"</span>);</code></pre>
        <p>路径格式：<code>根目录名/文件路径</code>，不使用 <code>/</code> 开头。</p>
        <h2>核心概念</h2>
        <h3>FileHandle 和 DirHandle</h3>
        <ul>
          <li><strong>FileHandle</strong>：代表一个文件，提供文件读写操作</li>
          <li><strong>DirHandle</strong>：代表一个目录，提供目录遍历和子项操作</li>
        </ul>
        <h3>基本属性</h3>
        <ul>
          <li><code>kind</code>：返回 <code>"file"</code> 或 <code>"dir"</code>，表示句柄类型</li>
          <li><code>name</code>：返回文件或目录的名称</li>
          <li><code>path</code>：返回文件或目录的完整路径</li>
        </ul>
        <h2>使用示例</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> { init, get } <span class="hljs-keyword">from</span> <span class="hljs-string">"/nos/fs/main.js"</span>;

<span class="hljs-comment">// 初始化文件系统</span>
<span class="hljs-keyword">const</span> testDir = <span class="hljs-keyword">await</span> <span class="hljs-title function_">init</span>(<span class="hljs-string">"my-app"</span>);

<span class="hljs-comment">// 创建并写入文件</span>
<span class="hljs-keyword">const</span> file = <span class="hljs-keyword">await</span> testDir.<span class="hljs-title function_">get</span>(<span class="hljs-string">"hello.txt"</span>, { <span class="hljs-attr">create</span>: <span class="hljs-string">"file"</span> });
<span class="hljs-keyword">await</span> file.<span class="hljs-title function_">write</span>(<span class="hljs-string">"Hello, World!"</span>);

<span class="hljs-comment">// 读取文件</span>
<span class="hljs-keyword">const</span> content = <span class="hljs-keyword">await</span> file.<span class="hljs-title function_">text</span>();
<span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(content); <span class="hljs-comment">// "Hello, World!"</span>

<span class="hljs-comment">// 使用全局 get 获取文件（无需再次初始化）</span>
<span class="hljs-keyword">const</span> file2 = <span class="hljs-keyword">await</span> <span class="hljs-title function_">get</span>(<span class="hljs-string">"my-app/hello.txt"</span>);
<span class="hljs-keyword">const</span> isSame = <span class="hljs-keyword">await</span> file.<span class="hljs-title function_">isSame</span>(file2); <span class="hljs-comment">// true</span></code></pre>
