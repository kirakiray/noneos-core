        <h1>sw.js 配置技巧</h1>
        <h2>版本号控制与缓存更新</h2>
        <p>在发布新版本时，如果服务器配置了 <code>max-age=0</code> 响应头，浏览器仍可能缓存旧版本的 <code>sw.js</code> 文件，导致更新无法及时生效。通过在 URL 中添加版本参数，可以强制浏览器请求最新的文件，从而解决这一问题。</p>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">let</span> version = <span class="hljs-string">&quot;&quot;</span>;
<span class="hljs-keyword">if</span> (globalThis.<span class="hljs-property">serviceWorker</span>) {
  <span class="hljs-keyword">const</span> urlParams = <span class="hljs-keyword">new</span> <span class="hljs-title class_">URLSearchParams</span>(
    <span class="hljs-keyword">new</span> <span class="hljs-title function_">URL</span>(serviceWorker.<span class="hljs-property">scriptURL</span>).<span class="hljs-property">search</span>,
  );
  version = urlParams.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;v&quot;</span>) || <span class="hljs-string">&quot;&quot;</span>;
} <span class="hljs-keyword">else</span> {
  <span class="hljs-keyword">const</span> urlParams = <span class="hljs-keyword">new</span> <span class="hljs-title class_">URLSearchParams</span>(<span class="hljs-keyword">new</span> <span class="hljs-title function_">URL</span>(location.<span class="hljs-property">href</span>).<span class="hljs-property">search</span>);
  version = urlParams.<span class="hljs-title function_">get</span>(<span class="hljs-string">&quot;v&quot;</span>) || <span class="hljs-string">&quot;&quot;</span>;
}

importScripts(<span class="hljs-string">&quot;https://core.noneos.com/sw/dist.js?v=&quot;</span> + version);</code></pre>
        <p>在引用 dist.js 时加上 <code>?v=</code> 参数，每次发布新版本时更新版本号，浏览器便会请求新的文件而非使用缓存。</p>
        <h2>官方工具</h2>
        <p>使用 <code>nos-tool</code> 目录下的工具，可以方便地管理 NoneOS 系统。</p>
        <ul>
          <li><strong>ai</strong> - AI 模型管理，包括聊天、配置、密钥管理</li>
          <li><strong>editor</strong> - Monaco 编辑器集成，支持代码高亮、格式化、AI 补全</li>
          <li><strong>file-explore</strong> - 文件浏览器</li>
          <li><strong>file-list</strong> - 文件列表视图和句柄管理</li>
          <li><strong>studio</strong> - 开发工作室，提供文件管理、颜色工具、主题编辑等功能</li>
        </ul>
        <p>这些工具位于 <code>nos-tool</code> 目录下，可按需引入和使用。</p>
      </article>

        export const parent = "../../layout.html";

          load,
          query

          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
