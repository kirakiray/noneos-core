<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoneOS Core</title>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.6.20/dist/ofa.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.6.20/libs/scsr/dist/scsr.min.mjs" type="module"></script>
  <link rel="icon" href="../img/logo.png" />
  <link rel="stylesheet" href="../css/palette.css" pui-colors />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/github-markdown.css" />
  <link rel="stylesheet" href="../css/hljs.css" />
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Segoe UI,
        Microsoft Yahei,
        Helvetica,
        Arial,
        sans-serif,
        Apple Color Emoji,
        Segoe UI Emoji;
    }

    o-app {
      height: 100%;
    }

    @keyframes fadein {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    o-app {
      animation: fadein 0.1s ease-in-out;
    }
  </style>
  <script type="module" src="../js/util.js"></script>
  <!--google analytics-->
</head>

<body>
  <o-app src="../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../css/github-markdown.css" />
      <link rel="stylesheet" href="../css/hljs.css" />
      <l-m src="../comps/center-block.html"></l-m>
      <l-m src="../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {
          display: block;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../css/page.css" />
      <center-block>
        <h2>NoneOS Core</h2>
        <p>一款基于浏览器的微虚拟系统，让上层应用随处运行、轻松开发、极速启动。</p>
        <p>你的下一个操作系统，何必是操作系统。</p>
        <div style="padding: 16px">
          <p-button size="large">
            <a href="./documentation/install.html" olink="">开始使用</a>
          </p-button>
        </div>
      </center-block>
      <div class="footer"></div>
      <script>
        export const parent = "../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
