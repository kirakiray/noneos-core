  - generic [ref=f5e35]: 配置说明： · 顺序即优先级，排在越前的服务器在 ICE 候选收集中优先级越高。 · 点击"启用/禁用"开关可临时停用某台服务器而不删除它；停用的服务器不会参与 RTC 建链。 · 配置自动保存到 localStorage，RTCManager 构造时会读取并生效。 · STUN 测试成功表示可获取公网反射地址（srflx）；TURN 测试成功表示可分配中继地址（relay）。