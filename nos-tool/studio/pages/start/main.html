  <script>
    export const parent = "../layout.html";

    let tempHandle = null;
    export const getTempHandle = () => tempHandle;

    export default async ({ load }) => {
      const { open, mount } = await load("/nos/fs/handle/mount/mount.js");
      const { getLocaleText } = await load(
        "/nos/locale-text/get-locale-text.js",
      );
      const { default: confirm } = await load("https://cdn.jsdelivr.net/gh/ofajs/senti-ui@d680267b51da8667cce2aca97eec2118c76ec3c0/packages/dialog/confirm.js");

      return {
        data: {
          canUse: !!window.showOpenFilePicker,
          projects: [],
        },
        proto: {
          async openFolderPicker() {
            const handle = await open();

            // 查看是否要是有效的项目文件
            const packagejsonHandle = await handle.get("package.json");
            if (!packagejsonHandle) {
              const result = await confirm(
                getLocaleText({
                  cn: "该文件夹不是一个有效的OFA项目，是否进行创建？",
                  en: "This folder is not a valid OFA project, do you want to create it?",
                }),
              );
              if (!result) {
                return;
              }
              tempHandle = handle;
              this.goto(`./create.html?from=create`);
              return;
            }

            const content = await packagejsonHandle.json();
            if (!content.ofaApp) {
              tempHandle = handle;

              const result = await confirm(
                getLocaleText({
                  cn: "该文件夹不是一个有效的OFA项目，是否进行创建？",
                  en: "This folder is not a valid OFA project, do you want to create it?",
                }),
              );

              if (!result) {
                return;
              }

              this.goto(`./create.html?from=create`);
              return;
            }

            await mount(handle);

            await saveProject(handle.path);

            this.goto(
              `../dashboard.html?path=${encodeURIComponent(handle.path)}`,
            );
          },
          getName(path) {
            const repath = path.split(">").pop();
            return repath.split("/").pop();
          },
          gotoProject(path) {
            this.goto(`../dashboard.html?path=${encodeURIComponent(path)}`);
          },
        },
        attached() {
          const projects = JSON.parse(localStorage.getItem("projects") || "[]");
          this.projects = projects;

          this.emit("active-page", {
            composed: true,
            data: { name: "start" },
          });
        },
      };
    };

    export const saveProject = async (path) => {
      const projects = JSON.parse(localStorage.getItem("projects") || "[]");

      projects.push({
        path,
      });

      const uniqueProjects = projects.filter(
        (item, index, arr) =>
          arr.findIndex((i) => i.path === item.path) === index,
      );

      localStorage.setItem("projects", JSON.stringify(uniqueProjects));
    };
  </script>
