<template page>
  <l-m src="/gh/ofajs/Punch-UI@1/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI@1/packages/select/select.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI@1/packages/button/group.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI@1/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI@1/packages/switch/switch.html"></l-m>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>

  <style>
    :host {
      display: block;
      height: 100%;
    }

    h3 {
      font-size: 18px;
    }

    .container {
      width: 100%;
      height: 100%;
      padding: 16px;
      overflow: auto;
      box-sizing: border-box;
    }

    .frame-container {
      width: calc(var(--frame-width) * var(--frame-scale));
      height: calc(var(--frame-height) * var(--frame-scale));
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--md-sys-color-primary);
    }

    .frame-container.mobile-size {
      --frame-width: 375px;
      --frame-height: 667px;
    }

    .frame-container.mobile-size.is-horizontal {
      --frame-width: 667px;
      --frame-height: 375px;
    }

    .frame-container.pad-size {
      --frame-width: 768px;
      --frame-height: 1024px;
    }

    .frame-container.pad-size.is-horizontal {
      --frame-width: 1024px;
      --frame-height: 768px;
    }

    .frame-container.pc-size {
      --frame-width: 1280px;
      --frame-height: 720px;
    }

    .preview-frame {
      width: var(--frame-width);
      height: var(--frame-height);
      transform: scale(var(--frame-scale));
      transform-origin: top left;
    }

    .hor-icon {
      transform: rotate(-45deg);
      transition: transform 0.1s ease-in-out;
    }

    .is-horizontal-icon {
      transform: rotate(45deg);
    }
  </style>

  <style>
    .frame-container {
      --frame-scale: data(scale);
    }
  </style>
  <div class="container">
    <h3 style="margin-top: 0">
      <locale-text>
        <span lang="cn">预览</span>
        <span lang="en">Preview</span>
      </locale-text>
    </h3>
    <div style="padding-bottom: 16px; display: flex; align-items: center">
      <p-button variant="outlined" on:click="previewInNewWindow">
        <n-icon icon="material-symbols:preview" slot="prefix"></n-icon>
        <locale-text>
          <span lang="cn">新窗口预览应用</span>
          <span lang="en">Preview Application in New Window</span>
        </locale-text>
      </p-button>
      <p-button-group size="small" style="margin-left: 8px">
        <p-button
          on:click="device = 'mobile'"
          attr:variant="device === 'mobile' ? 'contained' : 'outlined'"
        >
          <n-icon icon="mynaui:mobile" slot="prefix"></n-icon>
          <locale-text>
            <span lang="cn">手机</span>
            <span lang="en">Mobile</span>
          </locale-text>
        </p-button>
        <p-button
          on:click="device = 'pad'"
          attr:variant="device === 'pad' ? 'contained' : 'outlined'"
        >
          <n-icon icon="mingcute:pad-line" slot="prefix"></n-icon>
          <locale-text>
            <span lang="cn">平板</span>
            <span lang="en">Pad</span>
          </locale-text>
        </p-button>
        <p-button
          on:click="device = 'pc'"
          attr:variant="device === 'pc' ? 'contained' : 'outlined'"
        >
          <n-icon icon="ic:round-laptop" slot="prefix"></n-icon>
          PC
        </p-button>
      </p-button-group>
      <p-button
        icon
        size="small"
        variant="outlined"
        attr:disabled="device === 'pc'"
        on:click="isHorizontal = !isHorizontal"
        style="margin-left: 8px"
      >
        <n-icon
          class="hor-icon"
          class:is-horizontal-icon="isHorizontal"
          icon="material-symbols:mobile-rotate-sharp"
        ></n-icon>
      </p-button>
      <p-select sync:value="scale" size="small" style="margin-left: 8px">
        <label>
          <locale-text>
            <span lang="cn">缩放比例</span>
            <span lang="en">Scale Ratio</span>
          </locale-text>
        </label>
        <p-option value="0.5">0.5</p-option>
        <p-option value="0.75">0.75</p-option>
        <p-option value="1.0">1.0</p-option>
        <p-option value="1.25">1.25</p-option>
      </p-select>
    </div>

    <div
      class="frame-container"
      class:mobile-size="device === 'mobile'"
      class:pad-size="device === 'pad'"
      class:pc-size="device === 'pc'"
      class:is-horizontal="isHorizontal"
    >
      <iframe
        class="preview-frame"
        attr:src="previewUrl"
        frameborder="0"
      ></iframe>
    </div>
  </div>
  <script>
    export const parent = "./layout.html";

    export default async ({ load, query }) => {
      const { get } = await load("/nos/fs/main.js");
      const { createData } = await load("/nos/hybrid-data/main.js");

      return {
        data: {
          previewUrl: "/" + query.path + "/",
          ofaConfig: {},
          _rootHandle: null,
          device: sessionStorage.getItem("studio-device") || "mobile",
          scale: sessionStorage.getItem("studio-scale") || "1.0",
          isHorizontal: sessionStorage.getItem("studio-isHorizontal") === "true",
        },
        watch: {
          "device,scale,isHorizontal"([device, scale, isHorizontal]) {
            sessionStorage.setItem("studio-device", device);
            sessionStorage.setItem("studio-scale", scale);
            sessionStorage.setItem("studio-isHorizontal", isHorizontal);
          },
        },
        proto: {
          previewInNewWindow() {
            window.open(this.previewUrl);
          },
        },
        async attached() {
          sessionStorage.setItem("currentPath", query.path);

          // 打开目标
          this._rootHandle = await get(query.path);

          const studioConfigHandle = await this._rootHandle.get(
            "ofa-config.json",
            {
              create: "file",
            },
          );

          this.ofaConfig = await createData(studioConfigHandle);

          this.emit("active-page", {
            composed: true,
            data: {
              name: "dashboard",
            },
          });
        },
        detached() {
          if (this.ofaConfig) {
            this.ofaConfig.disconnect();
          }
        },
      };
    };
  </script>
</template>
