<template page>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/select/select.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/icon/icon.html"></l-m>
  <style>
    :host {
      display: block;
      height: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid
        rgb(from var(--md-sys-color-normal-container) r g b / 0.5);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      margin-left: auto;
    }

    .message.assistant {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
    }

    .message.error {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .provider-tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      margin-left: 8px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid
        rgb(from var(--md-sys-color-normal-container) r g b / 0.5);
    }

    p-input {
      flex: 1;
    }

    .loading {
      color: var(--md-sys-color-on-surface-variant);
      font-style: italic;
    }
  </style>
  <div class="container">
    <div class="toolbar">
      <p-select sync:value="selectedProvider" style="width: 200px">
        <p-option value="auto">
          <locale-text>
            <span lang="cn">自动选择</span>
            <span lang="en">Auto</span>
          </locale-text>
        </p-option>
        <o-fill :value="availableProviders">
          <p-option :value="$data">{{$data}}</p-option>
        </o-fill>
      </p-select>
    </div>

    <div class="chat-area">
      <o-fill :value="messages" name="message-item"></o-fill>
      <template name="message-item">
        <div class="message {{$data.role}}">
          {{$data.content}}
          <x-if :value="$data.role === 'assistant' && $data.provider">
            <span class="provider-tag">{{$data.provider}}</span>
          </x-if>
        </div>
      </template>
      <x-if :value="messages.length === 0">
        <div
          style="
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
            padding: 40px;
          "
        >
          <locale-text>
            <span lang="cn">开始对话...</span>
            <span lang="en">Start chatting...</span>
          </locale-text>
        </div>
      </x-if>
    </div>

    <div class="input-area">
      <p-input
        sync:value="inputText"
        attr:placeholder="inputPlaceholder"
        on:keypress="handleKeyPress"
      ></p-input>
      <p-button
        on:click="sendMessage"
        attr:disabled="!inputText.trim() || isLoading"
      >
        <locale-text>
          <span lang="cn">发送</span>
          <span lang="en">Send</span>
        </locale-text>
      </p-button>
    </div>
  </div>
  <script>
    import { chat, getAvailableProviders } from "/nos/ai/chat.js";
    import { toast } from "/gh/ofajs/Punch-UI/packages/util.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    export const parent = "../layout.html";

    export default async ({ load, query }) => {
      return {
        data: {
          messages: [],
          inputText: "",
          selectedProvider: "auto",
          availableProviders: [],
          isLoading: false,
        },
        proto: {
          get inputPlaceholder() {
            return getLocaleText({
              cn: "输入消息...",
              en: "Enter message...",
            });
          },
          handleKeyPress(e) {
            if (e.key === "Enter") {
              this.sendMessage();
            }
          },
          async sendMessage() {
            const content = this.inputText.trim();
            if (!content || this.isLoading) return;

            this.messages.push({ role: "user", content });
            this.inputText = "";
            this.isLoading = true;

            const assistantMsg = $.stanz({
              role: "assistant",
              content: "",
              provider: "",
            });

            this.messages.push(assistantMsg);

            const provider =
              this.selectedProvider === "auto"
                ? undefined
                : this.selectedProvider || undefined;

            let fullContent = "";
            let providerName = "";

            try {
              await chat(
                this.messages.slice(0, -1).map((m) => ({
                  role: m.role,
                  content: m.content,
                })),
                {
                  provider,
                  callback: ({ provider: p, chunk, content, done }) => {
                    providerName = p;

                    console.log(chunk);

                    if (!done) {
                      assistantMsg.content += chunk;
                    }

                    fullContent = content;
                  },
                },
              );

              assistantMsg.provider = providerName;
            } catch (error) {
              assistantMsg.content = error.message;
              assistantMsg.role = "error";
              toast({
                color: "error",
                message: getLocaleText({
                  cn: "发送失败",
                  en: "Send failed",
                }),
              });
            } finally {
              this.isLoading = false;
            }
          },
        },
        async attached() {
          this.availableProviders = await getAvailableProviders();

          this.emit("active-page", {
            composed: true,
            data: {
              name: "chat",
              query: { ...query },
            },
          });
        },
        detached() {},
      };
    };
  </script>
</template>
