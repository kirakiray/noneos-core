<template page>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/select/select.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/icon/icon.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/radio/group.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/radio/radio.html"></l-m>
  <style>
    :host {
      display: block;
      height: 100%;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 16px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid
        rgb(from var(--md-ref-palette-normal50) r g b / 0.5);
      margin-bottom: 16px;
    }

    .chat-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--md-ref-palette-normal40);
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-selector-label {
      font-size: 14px;
      color: var(--md-sys-color-normal);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: rgb(from var(--md-ref-palette-normal90) r g b / 0.3);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      margin-left: auto;
    }

    .message.assistant {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      margin-right: auto;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0.8;
    }

    .message-content {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message-content p {
      margin: 0 0 8px 0;
    }

    .message-content p:last-child {
      margin: 0;
    }

    .input-container {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
    }

    .input-wrapper p-input {
      width: 100%;
    }

    .send-button {
      flex-shrink: 0;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--md-sys-color-normal);
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid
        rgb(from var(--md-sys-color-normal r g b / 0.3));
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--md-sys-color-normal);
      opacity: 0.6;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 14px;
    }

    .error-message {
      background: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
  </style>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-title">
        <locale-text>
          <span lang="cn">AI 聊天</span>
          <span lang="en">AI Chat</span>
        </locale-text>
      </div>
      <div class="model-selector">
        <span class="model-selector-label">
          <locale-text>
            <span lang="cn">模型:</span>
            <span lang="en">Model:</span>
          </locale-text>
        </span>
        <p-select sync:value="selectedModel" style="width: 200px">
          <o-fill :value="availableModels">
            <p-option :value="$data">{{$data}}</p-option>
          </o-fill>
        </p-select>
      </div>
    </div>

    <div class="messages-container">
      <x-if :value="messages.length === 0">
        <div class="empty-state">
          <div class="empty-state-icon">💬</div>
          <div class="empty-state-text">
            <locale-text>
              <span lang="cn">开始与 AI 对话</span>
              <span lang="en">Start chatting with AI</span>
            </locale-text>
          </div>
        </div>
      </x-if>
      <x-if :value="error">
        <div class="error-message">{{error}}</div>
      </x-if>
      <o-fill :value="messages" name="message-item"></o-fill>
      <x-if :value="isLoading">
        <div class="message assistant">
          <div class="loading">
            <div class="loading-spinner"></div>
            <locale-text>
              <span lang="cn">AI 正在思考...</span>
              <span lang="en">AI is thinking...</span>
            </locale-text>
          </div>
        </div>
      </x-if>
    </div>

    <template name="message-item">
      <div class="message" class:="{{$data.role}}">
        <div class="message-header">
          <x-if :value="$data.role === 'user'">
            <locale-text>
              <span lang="cn">你</span>
              <span lang="en">You</span>
            </locale-text>
          </x-if>
          <x-if :value="$data.role === 'assistant'">
            <locale-text>
              <span lang="cn">AI 助手</span>
              <span lang="en">AI Assistant</span>
            </locale-text>
          </x-if>
          <span>{{$data.timestamp}}</span>
        </div>
        <div class="message-content">{{$data.content}}</div>
      </div>
    </template>

    <div class="input-container">
      <div class="input-wrapper">
        <p-input
          sync:value="inputMessage"
          attr:placeholder="inputPlaceholder"
          on:keydown="handleKeyDown"
          multiline
          :rows="3"
        ></p-input>
      </div>
      <p-button
        class="send-button"
        on:click="sendMessage"
        attr:disabled="!inputMessage.trim() || isLoading"
      >
        <locale-text>
          <span lang="cn">发送</span>
          <span lang="en">Send</span>
        </locale-text>
      </p-button>
    </div>
  </div>
  <script>
    export const parent = "../layout.html";

    import { storage } from "/gh/kirakiray/ever-cache/src/main.js";
    import { toast } from "/gh/ofajs/Punch-UI/packages/util.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    export default async ({ load, query }) => {
      return {
        data: {
          messages: [],
          inputMessage: "",
          selectedModel: "",
          availableModels: [],
          isLoading: false,
          error: null,
          aiKeys: [],
        },
        proto: {
          get inputPlaceholder() {
            return getLocaleText({
              cn: "输入消息...",
              en: "Enter message...",
            });
          },
          async loadAIKeys() {
            const keys = (await storage.getItem("ai-keys")) || [];
            this.aiKeys = keys;
            this.updateAvailableModels();
          },
          updateAvailableModels() {
            const models = new Set();
            this.aiKeys.forEach((key) => {
              const providerModels = this.getProviderModels(key.provider);
              providerModels.forEach((model) => models.add(model));
            });
            this.availableModels = Array.from(models);
            if (this.availableModels.length > 0 && !this.selectedModel) {
              this.selectedModel = this.availableModels[0];
            }
          },
          getProviderModels(provider) {
            const models = {
              deepseek: [
                "deepseek-chat",
                "deepseek-coder",
                "deepseek-r1",
              ],
              kimi: [
                "kimi-k2.5",
                "kimi-k2.5-8k",
                "kimi-k2.5-32k",
                "kimi-k2.5-128k",
              ],
              glm: [
                "GLM-4.7-Flash",
                "glm-5-turbo",
                "glm-4.7",
                "glm-4.6",
                "glm-4.5",
                "glm-4.5-air",
                "glm-4v",
              ],
              minimax: [
                "MiniMax-M2.7-highspeed",
                "MiniMax-M2.7",
                "MiniMax-M2.5-highspeed",
                "MiniMax-M2.5-lightning",
                "MiniMax-M2.5",
                "MiniMax-M2.1-highspeed",
                "MiniMax-M2.1-lightning",
                "MiniMax-M2.1",
                "MiniMax-M2",
              ],
            };
            return models[provider] || [];
          },
          getProviderByModel(model) {
            for (const key of this.aiKeys) {
              const models = this.getProviderModels(key.provider);
              if (models.includes(model)) {
                return key;
              }
            }
            return null;
          },
          handleKeyDown(e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              this.sendMessage();
            }
          },
          async sendMessage() {
            if (!this.inputMessage.trim() || this.isLoading) {
              return;
            }

            const userMessage = this.inputMessage.trim();
            this.inputMessage = "";
            this.error = null;

            const timestamp = new Date().toLocaleTimeString();
            this.messages.push({
              role: "user",
              content: userMessage,
              timestamp,
            });

            const apiKey = this.getProviderByModel(this.selectedModel);
            if (!apiKey) {
              this.error = getLocaleText({
                cn: "未找到该模型的 API Key",
                en: "No API Key found for this model",
              });
              return;
            }

            this.isLoading = true;

            try {
              const response = await this.callAI(apiKey, userMessage);
              const assistantTimestamp = new Date().toLocaleTimeString();
              this.messages.push({
                role: "assistant",
                content: response,
                timestamp: assistantTimestamp,
              });
            } catch (err) {
              this.error = getLocaleText({
                cn: `请求失败: ${err.message}`,
                en: `Request failed: ${err.message}`,
              });
              toast({
                color: "error",
                message: this.error,
              });
            } finally {
              this.isLoading = false;
            }
          },
          async callAI(apiKey, message) {
            const provider = apiKey.provider;
            const model = this.selectedModel;
            const key = apiKey.key;

            let url, headers, body;

            if (provider === "deepseek") {
              url = "https://api.deepseek.com/v1/chat/completions";
              headers = {
                "Content-Type": "application/json",
                Authorization: `Bearer ${key}`,
              };
              body = {
                model,
                messages: [
                  ...this.messages
                    .filter((m) => m.role !== "system")
                    .map((m) => ({
                      role: m.role,
                      content: m.content,
                    })),
                  { role: "user", content: message },
                ],
              };
            } else if (provider === "kimi") {
              url = "https://api.moonshot.cn/v1/chat/completions";
              headers = {
                "Content-Type": "application/json",
                Authorization: `Bearer ${key}`,
              };
              body = {
                model,
                messages: [
                  ...this.messages
                    .filter((m) => m.role !== "system")
                    .map((m) => ({
                      role: m.role,
                      content: m.content,
                    })),
                  { role: "user", content: message },
                ],
              };
            } else if (provider === "glm") {
              url = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
              headers = {
                "Content-Type": "application/json",
                Authorization: `Bearer ${key}`,
              };
              body = {
                model,
                messages: [
                  ...this.messages
                    .filter((m) => m.role !== "system")
                    .map((m) => ({
                      role: m.role,
                      content: m.content,
                    })),
                  { role: "user", content: message },
                ],
              };
            } else if (provider === "minimax") {
              url = "https://api.minimax.chat/v1/text/chatcompletion_v2";
              headers = {
                "Content-Type": "application/json",
                Authorization: `Bearer ${key}`,
              };
              body = {
                model,
                messages: [
                  ...this.messages
                    .filter((m) => m.role !== "system")
                    .map((m) => ({
                      sender_type: m.role === "user" ? "USER" : "BOT",
                      sender_name: m.role === "user" ? "User" : "AI",
                      text: m.content,
                    })),
                  {
                    sender_type: "USER",
                    sender_name: "User",
                    text: message,
                  },
                ],
              };
            }

            const response = await fetch(url, {
              method: "POST",
              headers,
              body: JSON.stringify(body),
            });

            if (!response.ok) {
              const errorData = await response.json().catch(() => ({}));
              throw new Error(
                errorData.error?.message || `HTTP ${response.status}`
              );
            }

            const data = await response.json();
            return data.choices?.[0]?.message?.content || "No response";
          },
        },
        async attached() {
          this.emit("active-page", {
            composed: true,
            data: {
              name: "chat",
              query: { ...query },
            },
          });

          await this.loadAIKeys();

          if (this.aiKeys.length === 0) {
            this.error = getLocaleText({
              cn: "请先在配置页面添加 API Key",
              en: "Please add API Key in config page first",
            });
          }
        },
      };
    };
  </script>
</template>
