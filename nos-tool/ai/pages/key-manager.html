<template page>
  <l-m src="/nos/locale-text/locale-text.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/input/input.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/list/list.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/icon/icon.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/radio/group.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/radio/radio.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/dialog/dialog.html"></l-m>
  <l-m src="/gh/ofajs/Punch-UI/packages/select/select.html"></l-m>
  <style>
    :host {
      display: block;
      height: 100%;
    }

    .container {
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    h2 {
      font-size: 18px;
      padding: 8px 0;
      margin: 0 0 16px 0;
      color: var(--md-ref-palette-normal40);
    }

    .form-item {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      color: var(--md-sys-color-normal);
      margin-bottom: 8px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .key-list {
      margin-top: 24px;
    }

    .provider-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .provider-selector {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }

    p-list-item {
      &:hover {
        background: rgb(from var(--md-sys-color-on-primary) r g b / 0.4);
      }
    }
  </style>
  <div class="container">
    <h2>
      <locale-text>
        <span lang="cn">AI API Key 配置</span>
        <span lang="en">AI API Key Configuration</span>
      </locale-text>
    </h2>
    <div class="form-item">
      <label class="form-label">
        <locale-text>
          <span lang="cn">选择服务提供商</span>
          <span lang="en">Select Provider</span>
        </locale-text>
      </label>
      <div class="provider-selector">
        <p-radio-group sync:value="selectedProvider">
          <p-radio value="deepseek">DeepSeek</p-radio>
          <p-radio value="kimi">Kimi</p-radio>
          <p-radio value="glm">GLM</p-radio>
          <p-radio value="minimax">MiniMax</p-radio>
        </p-radio-group>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">API Key</label>
      <p-input sync:value="newKey" attr:placeholder="placeholder"></p-input>
    </div>
    <div class="toolbar">
      <p-button on:click="saveKey" attr:disabled="!newKey.trim()">
        <locale-text>
          <span lang="cn">保存</span>
          <span lang="en">Save</span>
        </locale-text>
      </p-button>
    </div>

    <div class="key-list">
      <h2>
        <locale-text>
          <span lang="cn">已保存的 API Keys</span>
          <span lang="en">Saved API Keys</span>
        </locale-text>
      </h2>
      <p-list>
        <o-fill :value="aiKeys" name="key-item"></o-fill>
      </p-list>
      <template name="key-item">
        <p-list-item>
          <span class="provider-tag" slot="prefix">{{$data.provider}}</span>
          <div
            style="
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;
              max-width: 300px;
            "
          >
            {{$data.key}}
          </div>
          <div secondary>
            <locale-text>
              <span lang="cn"
                >模型: {{$data.model}} | 并发: {{$data.concurrency || 1}}</span
              >
              <span lang="en"
                >Model: {{$data.model}} | Concurrency: {{$data.concurrency ||
                1}}</span
              >
            </locale-text>
          </div>

          <div slot="suffix" style="display: flex; gap: 8px">
            <p-button
              variant="text"
              on:click="$host.openEditDialog($data,$index)"
              size="small"
            >
              <locale-text>
                <span lang="cn">编辑</span>
                <span lang="en">Edit</span>
              </locale-text>
            </p-button>
            <p-button
              variant="outlined"
              on:click="$host.deleteKey($data,$index)"
              size="small"
            >
              <locale-text>
                <span lang="cn">删除</span>
                <span lang="en">Delete</span>
              </locale-text>
            </p-button>
          </div>
        </p-list-item>
      </template>
      <x-if :value="aiKeys.length === 0">
        <p-list-item>
          <locale-text>
            <span lang="cn">暂无保存的 API Keys</span>
            <span lang="en">No saved API Keys</span>
          </locale-text>
        </p-list-item>
      </x-if>
    </div>

    <p-dialog sync:open="editDialogOpen" on:click-mask="editDialogOpen = false">
      <h2 slot="title">
        <locale-text>
          <span lang="cn">编辑 API Key</span>
          <span lang="en">Edit API Key</span>
        </locale-text>
      </h2>
      <div>
        <div class="form-item">
          <label class="form-label">
            <locale-text>
              <span lang="cn">服务提供商</span>
              <span lang="en">Provider</span>
            </locale-text>
          </label>
          <p-input :value="editItem.provider" disabled></p-input>
        </div>
        <div class="form-item">
          <label class="form-label">
            <locale-text>
              <span lang="cn">模型</span>
              <span lang="en">Model</span>
            </locale-text>
          </label>
          <p-select sync:value="editItem.model" style="width: 100%">
            <o-fill :value="editAvailableModels">
              <p-option :value="$data">{{$data}}</p-option>
            </o-fill>
          </p-select>
        </div>
        <div class="form-item">
          <label class="form-label">API Key</label>
          <div
            style="
              padding: 8px 12px;
              max-width: 60vw;
              border: 1px solid var(--md-sys-color-normal);
              border-radius: 4px;
              font-size: 12px;
              color: var(--md-sys-color-on-surface-variant);
              word-break: break-all;
            "
          >
            {{editItem.key}}
          </div>
        </div>
        <div class="form-item">
          <label class="form-label">
            <locale-text>
              <span lang="cn">并发次数</span>
              <span lang="en">Concurrency</span>
            </locale-text>
          </label>
          <p-input
            sync:value="editItem.concurrency"
            type="number"
            min="1"
            attr:placeholder="concurrencyPlaceholder"
          ></p-input>
        </div>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end">
        <p-button variant="outlined" on:click="closeEditDialog">
          <locale-text>
            <span lang="cn">取消</span>
            <span lang="en">Cancel</span>
          </locale-text>
        </p-button>
        <p-button on:click="saveEdit">
          <locale-text>
            <span lang="cn">保存</span>
            <span lang="en">Save</span>
          </locale-text>
        </p-button>
      </div>
    </p-dialog>
  </div>
  <script>
    import { storage } from "/gh/kirakiray/ever-cache/src/main.js";
    import { toast, confirm } from "/gh/ofajs/Punch-UI/packages/util.js";
    import { getLocaleText } from "/nos/locale-text/get-locale-text.js";

    export default async ({ load, query }) => {
      return {
        data: {
          aiKeys: [],
          _wid: null,
          newKey: "",
          selectedProvider: "deepseek",
          editDialogOpen: false,
          editItem: {},
          editIndex: -1,
        },
        proto: {
          get providerModels() {
            return {
              deepseek: ["deepseek-chat", "deepseek-coder", "deepseek-r1"],
              kimi: [
                "kimi-k2.5",
                "kimi-k2.5-8k",
                "kimi-k2.5-32k",
                "kimi-k2.5-128k",
              ],
              glm: [
                "GLM-4.7-Flash",
                "glm-5-turbo",
                "glm-4.7",
                "glm-4.6",
                "glm-4.5",
                "glm-4.5-air",
                "glm-4v",
              ],
              minimax: [
                "MiniMax-M2.7-highspeed",
                "MiniMax-M2.7",
                "MiniMax-M2.5-highspeed",
                "MiniMax-M2.5-lightning",
                "MiniMax-M2.5",
                "MiniMax-M2.1-highspeed",
                "MiniMax-M2.1-lightning",
                "MiniMax-M2.1",
                "MiniMax-M2",
              ],
            };
          },
          get placeholder() {
            return getLocaleText({
              cn: `请输入 ${this.selectedProvider} 的 API Key`,
              en: `Enter ${this.selectedProvider} API Key`,
            });
          },
          get editAvailableModels() {
            return this.providerModels[this.editItem.provider] || [];
          },
          get availableModels() {
            return this.providerModels[this.selectedProvider] || [];
          },
          async saveKey() {
            const existingKey = this.aiKeys.find(
              (item) =>
                item.provider === this.selectedProvider &&
                item.key === this.newKey,
            );

            if (existingKey) {
              toast({
                color: "error",
                message: getLocaleText({
                  cn: "该 API Key 已存在",
                  en: "This API Key already exists",
                }),
              });
              return;
            }

            this.aiKeys.push({
              provider: this.selectedProvider,
              model: this.availableModels[0] || "",
              key: this.newKey,
              concurrency: 1,
            });

            this.newKey = "";
          },
          openEditDialog(item, index) {
            this.editItem = { ...item };
            if (!item.model) {
              this.editItem.model = this.editAvailableModels[0] || "";
            }
            this.editItem.concurrency = item.concurrency || 1;
            this.editIndex = index;
            this.editDialogOpen = true;
          },
          closeEditDialog() {
            this.editDialogOpen = false;
            this.editItem = {};
            this.editIndex = -1;
          },
          get concurrencyPlaceholder() {
            return getLocaleText({
              cn: "请输入并发次数",
              en: "Enter concurrency",
            });
          },
          saveEdit() {
            if (!this.editItem.concurrency || this.editItem.concurrency < 1) {
              toast({
                color: "error",
                message: getLocaleText({
                  cn: "并发次数必须大于 0",
                  en: "Concurrency must be greater than 0",
                }),
              });
              return;
            }

            this.aiKeys[this.editIndex].model = this.editItem.model;
            this.aiKeys[this.editIndex].concurrency = parseInt(
              this.editItem.concurrency,
            );

            this.closeEditDialog();
          },
          async deleteKey(keyItem, index) {
            const result = await confirm({
              title: getLocaleText({
                cn: "确认删除",
                en: "Confirm Delete",
              }),
              message: getLocaleText({
                cn: `确定要删除这个 ${keyItem.provider} 的 API Key 吗？`,
                en: `Are you sure you want to delete this ${keyItem.provider} API Key?`,
              }),
            });

            if (result) {
              this.aiKeys.splice(index, 1);
            }
          },
        },
        async attached() {
          const aiKeys = (await storage.getItem("ai-keys")) || [];
          this.aiKeys = aiKeys;

          this._wid = this.aiKeys.watchTick(() => {
            const aiKeys = this.aiKeys.toJSON();
            storage.setItem("ai-keys", aiKeys);

            toast({
              color: "success",
              message: getLocaleText({
                cn: "API Key 更新成功",
                en: "API Key updated successfully",
              }),
            });
          });
        },
        detached() {
          this.aiKeys.unwatch(this._wid);
        },
      };
    };
  </script>
</template>
