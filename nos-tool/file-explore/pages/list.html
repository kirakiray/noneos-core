<template page>
  <l-m src="/nos/n-icon/n-icon.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/button/icon-button.html"></l-m>
  <l-m src="/gh/ofajs/senti-ui@latest/packages/list/list.html"></l-m>
  <style>
    :host {
      display: block;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
        Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      color: var(--md-sys-color-on-surface);
      background-color: var(--md-sys-color-surface);
    }

    .header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background-color: var(--md-sys-color-surface-container-low);
    }

    .header-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .breadcrumb {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      font-size: 14px;
      font-family: "Courier New", monospace;
    }

    .breadcrumb-item {
      color: var(--md-sys-color-primary);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      white-space: nowrap;
    }

    .breadcrumb-item:hover {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .breadcrumb-separator {
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.6;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 12px 16px;
    }

    .list st-list {
      max-width: 100%;
    }

    .item-size {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 8px;
      font-variant-numeric: tabular-nums;
    }

    .item-actions {
      /* st-list-item 的内部 .native 按钮（z-index:2）整行覆盖，
         suffix 里的操作按钮必须叠在它上面才能收到点击 */
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 64px 0;
      color: var(--md-sys-color-on-surface-variant);
    }
    .empty n-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .header {
        padding: 12px 16px;
      }

      .header-main {
        flex-wrap: wrap;
      }

      .breadcrumb {
        font-size: 12px;
      }

      .list {
        padding: 8px;
      }
    }

    @media (max-width: 480px) {
      .container {
        max-width: 100%;
      }

      .header {
        padding: 10px 12px;
      }

      .breadcrumb {
        font-size: 11px;
      }

      .breadcrumb-item {
        padding: 3px 6px;
      }
    }
  </style>
  <div class="container">
    <div class="header">
      <div class="header-main">
        <div class="breadcrumb">
          <span class="breadcrumb-item" on:click="handleBreadcrumbClick('/')">
            Root
          </span>
          <o-if :value="path !== '/' && breadcrumbItems.length > 0">
            <o-fill :value="breadcrumbItems">
              <div style="display: inline-flex; align-items: center">
                <span class="breadcrumb-separator">/</span>
                <span
                  class="breadcrumb-item"
                  on:click="$host.handleBreadcrumbClick($data.path)"
                  >{{$data.name}}</span
                >
              </div>
            </o-fill>
          </o-if>
          <st-icon-button
            style="font-size: 13px; margin-left: auto"
            title="复制当前路径"
            on:click="handleCopyPath($event)"
          >
            <n-icon icon="mdi:content-copy"></n-icon>
          </st-icon-button>
        </div>
      </div>
      <div class="header-actions">
        <st-button variant="outlined" style="font-size: 13px" on:click="handleCreateDirectory($event)">
          <n-icon icon="mdi:folder-plus-outline" slot="prefix"></n-icon>
          新建目录
        </st-button>
        <st-button variant="outlined" style="font-size: 13px" on:click="shadow.$('#import-file').ele.click()">
          <n-icon icon="mdi:file-upload-outline" slot="prefix"></n-icon>
          导入文件
        </st-button>
        <st-button variant="outlined" style="font-size: 13px" on:click="shadow.$('#import-directory').ele.click()">
          <n-icon icon="mdi:folder-upload-outline" slot="prefix"></n-icon>
          导入目录
        </st-button>
        <input
          type="file"
          id="import-file"
          style="display: none"
          multiple
          on:change="handleImportFile($event)"
        />
        <input
          type="file"
          id="import-directory"
          style="display: none"
          webkitdirectory
          on:change="handleImportDirectory($event)"
        />
      </div>
    </div>
    <div class="list">
      <o-if :value="list.length === 0">
        <div class="empty">
          <n-icon icon="mdi:folder-open-outline"></n-icon>
          <div>此目录为空</div>
        </div>
      </o-if>
      <st-list>
        <o-fill :value="list" fill-key="name">
          <st-list-item button on:click="$host.handleClick($data)">
            <n-icon slot="prefix" :icon="$data.type === 'directory' ? 'mdi:folder' : 'mdi:file-outline'"></n-icon>
            <span
              :style.color="$data.type === 'directory' ? 'var(--md-sys-color-primary)' : ''"
              >{{$data.name}}</span
            >
            <div slot="suffix" class="item-actions">
              <o-if :value="$data.type === 'file'">
                <span class="item-size">{{$data.size}}</span>
              </o-if>
              <st-icon-button
                style="font-size: 13px"
                title="下载"
                on:click="$host.handleDownload($data, $event)"
              >
                <n-icon icon="mdi:download-outline"></n-icon>
              </st-icon-button>
              <st-icon-button
                color="error"
                style="font-size: 13px"
                title="删除"
                on:click="$host.handleDelete($data, $event)"
              >
                <n-icon icon="mdi:delete-outline"></n-icon>
              </st-icon-button>
            </div>
          </st-list-item>
        </o-fill>
      </st-list>
    </div>
  </div>
  <script>
    export default async ({ load, query }) => {
      const currentPath = query.path || "/";
      const { get } = await load("/nos/fs/main.js");
      const { download } = await load("/nos/fs/download.js");
      const { default: prompt } = await load(
        "/gh/ofajs/senti-ui@latest/packages/dialog/prompt.js",
      );
      const { default: confirm } = await load(
        "/gh/ofajs/senti-ui@latest/packages/dialog/confirm.js",
      );
      const { default: toast } = await load(
        "/gh/ofajs/senti-ui@latest/packages/snackbar/toast.js",
      );

      return {
        data: {
          path: currentPath,
          list: [],
          breadcrumbItems: [],
        },
        proto: {
          async handleDownload(item, event) {
            event.stopPropagation();
            const handle = await get(item.path);
            await download(handle);
          },
          async handleCopyPath() {
            try {
              await navigator.clipboard.writeText(this.path);
              toast({ message: "路径已复制", color: "success" });
            } catch (err) {
              toast({ message: "复制失败：" + (err.message || err), color: "error" });
            }
          },
          getSize(size) {
            if (size < 1024) {
              return `${size} B`;
            } else if (size < 1024 * 1024) {
              return `${(size / 1024).toFixed(2)} KB`;
            } else if (size < 1024 * 1024 * 1024) {
              return `${(size / (1024 * 1024)).toFixed(2)} MB`;
            } else {
              return `${(size / (1024 * 1024 * 1024)).toFixed(2)} GB`;
            }
          },
          async handleCreateDirectory() {
            const currentHandle = await this.getCurrentHandle();

            const directoryName = await prompt({
              title: "新建目录",
              message: `在 ${currentPath === "/" ? "根目录" : currentPath} 下创建：`,
              placeholder: "目录名",
            });

            if (!directoryName) {
              return;
            }

            try {
              await currentHandle.getDirectoryHandle(directoryName, {
                create: true,
              });
              toast({ message: `已创建目录 ${directoryName}`, color: "success" });
            } catch (err) {
              toast({
                message: "创建失败：" + (err.message || err),
                color: "error",
              });
              return;
            }

            this.loadFile();
          },

          async handleImportFile(event) {
            const files = event.target.files;

            if (files.length === 0) {
              return;
            }

            const currentHandle = await this.getCurrentHandle();

            for (const file of files) {
              const handle = await currentHandle.getFileHandle(file.name, {
                create: true,
              });

              const writer = await handle.createWritable();
              await writer.write(file);
              await writer.close();
            }

            toast({ message: `已导入 ${files.length} 个文件`, color: "success" });
            event.target.value = "";
            this.loadFile();
          },

          async handleImportDirectory(event) {
            const files = event.target.files;

            if (files.length === 0) {
              return;
            }

            const currentHandle = await this.getCurrentHandle();

            // 创建一个映射来跟踪已创建的目录
            const directoryHandles = new Map();

            // 处理每个文件
            for (const file of files) {
              // 获取文件的相对路径
              const relativePath = file.webkitRelativePath;
              const pathParts = relativePath.split("/");
              const fileName = pathParts.pop(); // 最后一个是文件名
              const directoryPath = pathParts; // 剩余的是目录路径

              // 创建必要的目录结构
              let targetDirectoryHandle = currentHandle;
              let currentPath = "";

              for (const dirName of directoryPath) {
                currentPath += "/" + dirName;
                if (!directoryHandles.has(currentPath)) {
                  const dirHandle =
                    await targetDirectoryHandle.getDirectoryHandle(dirName, {
                      create: true,
                    });
                  directoryHandles.set(currentPath, dirHandle);
                  targetDirectoryHandle = dirHandle;
                } else {
                  targetDirectoryHandle = directoryHandles.get(currentPath);
                }
              }

              // 在目标目录中创建文件
              const fileHandle = await targetDirectoryHandle.getFileHandle(
                fileName,
                {
                  create: true,
                },
              );

              const writer = await fileHandle.createWritable();
              await writer.write(file);
              await writer.close();
            }

            toast({ message: `已导入 ${files.length} 个文件`, color: "success" });
            event.target.value = "";
            this.loadFile();
          },

          async handleClick(data) {
            if (data.type === "directory") {
              this.goto(`./list.html?path=${data.path}`);
            } else {
              if (/^\/_/.test(data.path)) {
                window.open(data.path);
              } else {
                window.open(`/$${data.path.replace("/", "")}`);
              }
            }
          },
          async handleDelete(data, event) {
            event.stopPropagation();

            const currentHandle = await this.getCurrentHandle();

            if (data.type === "directory") {
              const result = await confirm({
                title: "删除目录",
                message: `确定删除目录「${data.name}」及其全部内容吗？此操作不可恢复。`,
                yes: "删除",
                cancel: "取消",
                color: "error",
              });

              if (!result) {
                return;
              }

              await currentHandle.removeEntry(data.name, {
                recursive: true,
              });
            } else {
              const result = await confirm({
                title: "删除文件",
                message: `确定删除文件「${data.name}」吗？`,
                yes: "删除",
                cancel: "取消",
                color: "error",
              });

              if (!result) {
                return;
              }

              await currentHandle.removeEntry(data.name);
            }

            toast({ message: `已删除 ${data.name}`, color: "success" });
            this.loadFile();
          },
          async handleBreadcrumbClick(path) {
            this.goto(`./list.html?path=${path}`);
          },
          generateBreadcrumbItems(currentPath) {
            if (currentPath === "/") {
              this.breadcrumbItems = [];
              return;
            }

            const paths = currentPath.split("/").filter((item) => item !== "");
            this.breadcrumbItems = paths.map((path, index) => {
              const fullPath = "/" + paths.slice(0, index + 1).join("/");
              return {
                name: path,
                path: fullPath,
              };
            });
          },
          async getCurrentHandle() {
            const rootHandle = await navigator.storage.getDirectory();
            let currentHandle = rootHandle;

            if (currentPath !== "/") {
              let paths = currentPath.split("/");
              paths = paths.filter((item) => item !== "");
              for (const path of paths) {
                currentHandle = await currentHandle.getDirectoryHandle(path);
              }
            }

            return currentHandle;
          },
          async loadFile() {
            const currentHandle = await this.getCurrentHandle();

            const list = [];

            for await (const entry of currentHandle.values()) {
              const obj = {
                name: entry.name,
                type: entry.kind === "directory" ? "directory" : "file",
                path:
                  currentPath === "/"
                    ? `/${entry.name}`
                    : `${currentPath}/${entry.name}`,
              };

              if (entry.kind === "file") {
                const file = await entry.getFile();
                obj.size = this.getSize(file.size);
              }

              list.push(obj);
            }

            this.list = list;
          },
        },
        attached() {
          this.generateBreadcrumbItems(this.path);
          this.loadFile();

          const lastName = currentPath.split("/").pop();

          if (lastName) {
            $("title").text = lastName;
          } else {
            $("title").text = "Root";
          }
        },
      };
    };
  </script>
</template>
