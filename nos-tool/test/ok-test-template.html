<template id="ok-test-styles">
  <style>
    :host {
      display: block;
      padding: 12px;
      margin: 8px 0;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    :host([success]) {
      background: #d4edda;
      border-left: 4px solid #28a745;
    }
    :host([failure]) {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
    }
    :host([success]) .test-name {
      color: #155724;
    }
    :host([failure]) .test-name {
      color: #721c24;
    }
    :host([success]) .status {
      color: #28a745;
    }
    :host([failure]) .status {
      color: #dc3545;
    }
    :host([success]) .content,
    :host([success]) .error-msg,
    :host([success]) .error-stack {
      color: #155724;
    }
    :host([failure]) .content,
    :host([failure]) .error-msg,
    :host([failure]) .error-stack {
      color: #721c24;
    }
    .test-name {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .content,
    .error-msg {
      margin-top: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 3px;
      font-size: 0.9em;
      font-family: monospace;
    }
    .content {
      white-space: pre-wrap;
    }
    .error-stack {
      margin-top: 8px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
      font-size: 0.85em;
      white-space: pre-wrap;
      font-family: monospace;
      overflow-x: auto;
    }
  </style>
</template>

<template id="ok-test-result">
  <div class="test-name">
    <span class="status"></span>
    <span class="name"></span>
  </div>
  <div class="error-msg"></div>
  <div class="content"></div>
</template>

<template id="ok-test-error">
  <div class="test-name">
    <span class="status">✗</span>
    <span class="name"></span>
  </div>
  <div class="error-msg"></div>
  <div class="error-stack"></div>
</template>
