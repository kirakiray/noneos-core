<style>
  :host {
    display: block;
    padding: 12px;
    margin: 8px 0;
    border-radius: 4px;
    font-family:
      system-ui,
      -apple-system,
      sans-serif;
    background: #f8f9fa;
    border-left: 4px solid #6c757d;
  }
  :host([success]) {
    /* background: #d4edda; */
    border-left: 4px solid #28a745;
  }
  :host([failure]) {
    /* background: #f8d7da; */
    border-left: 4px solid #dc3545;
  }
  :host([success]) .header {
    color: #155724;
  }
  :host([failure]) .header {
    color: #721c24;
  }

  .header {
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 18px;
  }
  .summary {
    margin-bottom: 12px;
    font-weight: bold;
  }
  .iframe-group {
    padding: 4px 0;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
  }
  .iframe-title {
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    user-select: none;
    font-size: 14px;
    padding: 8px;
    border-radius: 4px;
  }
  .iframe-title.success {
    background: #d4edda;
    color: #155724;
    border-left: 4px solid #28a745;
  }
  .iframe-title.failure {
    background: #f8d7da;
    color: #721c24;
    border-left: 4px solid #dc3545;
  }
  .iframe-title:hover {
    opacity: 0.9;
  }
  .iframe-title .toggle-icon {
    margin-right: 8px;
    font-size: 13px;
    transition: transform 0.2s;
    display: inline-block;
  }
  .iframe-title.expanded .toggle-icon {
    transform: rotate(90deg);
  }
  .iframe-title .open-btn {
    margin-left: auto;
    padding: 2px 8px;
    font-size: 13px;
    border: 1px solid currentColor;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0.7;
  }
  .iframe-title .open-btn:hover {
    opacity: 1;
  }
  .iframe-content {
    display: none;
  }
  .iframe-content.expanded {
    display: block;
  }
  .result-item {
    margin-top: 8px;
    padding: 8px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 3px;
    font-size: 14px;
  }
  .result-item.success {
    color: #155724;
  }
  .result-item.failure {
    color: #721c24;
  }

  .result-name {
    font-weight: bold;
  }
  .result-content,
  .error-msg,
  .error-stack {
    margin-top: 4px;
    font-family: monospace;
    white-space: pre-wrap;
  }
  .error-stack {
    background: rgba(0, 0, 0, 0.05);
    padding: 8px;
    overflow-x: auto;
  }
</style>
<div class="header">Test Suite Results</div>
<div class="summary">
  Total: {{totalTests}} | Success: {{successTests}} | Error: {{errorTests}}
</div>
<div class="details">{{details}}</div>
