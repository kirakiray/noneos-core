  <div class="container">
    <h1>
      <n-icon icon="material-symbols:settings-ethernet"></n-icon>
      RTC ICE 服务器管理
    </h1>
    <p class="subtitle">
      配置 WebRTC 的 STUN/TURN 服务器列表，支持测试连通性、延迟、调整顺序与临时启停。配置保存后，RTCManager 在下次构建连接时自动读取生效。
    </p>

    <!-- 添加 / 编辑表单 -->
    <div class="section">
      <div class="section-title">
        <n-icon icon="material-symbols:add-circle-outline"></n-icon>
        {{ editingId ? '编辑服务器' : '添加服务器' }}
      </div>
      <div class="form-card">
        <div class="form-row">
          <st-select class="type-select" sync:value="formType" variant="filled" default-value="stun" style="font-size: 13px;">
            <option value="stun">STUN</option>
            <option value="turn">TURN</option>
          </st-select>
          <st-input sync:value="formUrls" variant="filled" style="font-size: 13px;" placeholder="stun:host:port 或 turn:host:port?transport=udp"></st-input>
          <div class="action-btns">
            <st-button variant="filled" style="font-size: 13px;" on:click="handleSubmit" attr:disabled="!formUrls.trim()">
              <n-icon icon="material-symbols:check" slot="prefix"></n-icon>
              {{ editingId ? '保存' : '添加' }}
            </st-button>
            <o-if :value="editingId">
              <st-button variant="text" style="font-size: 13px;" on:click="cancelEdit">取消</st-button>
            </o-if>
          </div>
        </div>
        <o-if :value="formType === 'turn'">
          <div class="turn-fields">
            <st-input sync:value="formUsername" variant="filled" style="font-size: 13px;" placeholder="TURN 用户名"></st-input>
            <st-input sync:value="formCredential" variant="filled" style="font-size: 13px;" placeholder="TURN 凭证" type="password"></st-input>
          </div>
        </o-if>
      </div>
    </div>

    <!-- 服务器列表 -->
    <div class="section">
      <div class="list-header">
        <div class="title-group">
          <n-icon icon="material-symbols:format-list-numbered"></n-icon>
          <div class="section-title" style="margin: 0;">服务器列表</div>
          <span style="font-size:12px; opacity:0.55;">（{{ enabledCount }}/{{ servers.length }} 启用）</span>
        </div>
        <div class="list-actions">
          <st-button variant="outlined" style="font-size: 13px;" on:click="testAll" attr:disabled="servers.length === 0">
            <n-icon icon="material-symbols:speed" slot="prefix"></n-icon>
            全部测试
          </st-button>
          <st-button variant="text" style="font-size: 13px;" on:click="resetDefaults">
            <n-icon icon="material-symbols:restart-alt" slot="prefix"></n-icon>
            恢复默认

      <o-if :value="servers.length === 0">
        <div class="empty-tip">暂无服务器，请在上方添加</div>
      </o-if>

      <o-fill :value="servers" fill-key="id">
        <div class="server-row" class:disabled="!$data.enabled">
          <span class="order-num">{{$index + 1}}</span>
          <span attr:class="'type-badge ' + $data.type">{{$data.type}}</span>
          <div class="server-main">
            <div class="server-url">{{$data.urls}}</div>
            <o-if :value="$data.username">

          </div>
          <span attr:class="'test-result ' + $data.testStatus">

            <o-if :value="$data.testStatus === 'testing'">测试中…</o-if>
            <o-if :value="$data.testStatus === 'ok'">{{$data.testLatency}}ms · {{$data.testType}}</o-if>
            <o-if :value="$data.testStatus === 'fail'">失败</o-if>
          </span>
          <st-switch
            attr:checked="$data.enabled"
            on:change="$host.toggleEnabled($index)"
            style="font-size: 11px;"

          <div class="row-actions">
            <st-button variant="text" style="font-size: 13px;" on:click="$host.moveUp($index)" attr:disabled="$index === 0" title="上移">
              <n-icon icon="material-symbols:arrow-upward"></n-icon>
            </st-button>
            <st-button variant="text" style="font-size: 13px;" on:click="$host.moveDown($index)" attr:disabled="$index === $host.servers.length - 1" title="下移">
              <n-icon icon="material-symbols:arrow-downward"></n-icon>
            </st-button>
            <st-button variant="outlined" style="font-size: 13px;" on:click="$host.testOne($index)" attr:disabled="$data.testStatus === 'testing'">
              <n-icon icon="material-symbols:network-check" slot="prefix"></n-icon>
              测试
            </st-button>
            <st-button variant="text" style="font-size: 13px;" on:click="$host.editServer($index)" title="编辑">

            </st-button>
            <st-button variant="text" color="error" style="font-size: 13px;" on:click="$host.deleteServer($index)" title="删除">

    <div class="footer-tip">
配置说明：
· 顺序即优先级，排在越前的服务器在 ICE 候选收集中优先级越高。
· 点击"启用/禁用"开关可临时停用某台服务器而不删除它；停用的服务器不会参与 RTC 建链。
· 配置自动保存到 localStorage，RTCManager 构造时会读取并生效。
· STUN 测试成功表示可获取公网反射地址（srflx）；TURN 测试成功表示可分配中继地址（relay）。
    </div>
  </div>

  <script>
    // localStorage key，与 nos/user/rtc.js 中的 ICE_STORAGE_KEY 保持一致
    const ICE_STORAGE_KEY = "noneos:rtc:ice_servers";

    // 默认服务器列表
    const DEFAULT_SERVERS = [
      { type: "stun", urls: "stun:stun.l.google.com:19302", username: "", credential: "", enabled: true },
      { type: "stun", urls: "stun:stun1.l.google.com:19302", username: "", credential: "", enabled: true },
      { type: "stun", urls: "stun:stun.cloudflare.com:3478", username: "", credential: "", enabled: true },
    ];

    // 生成唯一 id
    const genId = () => "s_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);

    // 从 localStorage 读取配置
    const loadServers = () => {
      try {
        const raw = localStorage.getItem(ICE_STORAGE_KEY);
        if (!raw) return DEFAULT_SERVERS.map((s) => ({ ...s, id: genId() }));
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          return DEFAULT_SERVERS.map((s) => ({ ...s, id: genId() }));
        }
        return parsed.map((s) => ({
          id: s.id || genId(),
          type: s.type === "turn" ? "turn" : "stun",
          urls: s.urls || "",
          username: s.username || "",
          credential: s.credential || "",
          enabled: s.enabled !== false,
          testStatus: "idle",
          testLatency: null,
          testType: "",
          testError: "",
        }));
      } catch {
        return DEFAULT_SERVERS.map((s) => ({ ...s, id: genId() }));
      }
    };

    // 保存到 localStorage（剥离测试状态字段）
    const saveServers = (servers) => {
      const data = servers.map((s) => ({
        id: s.id,
        type: s.type,
        urls: s.urls,
        username: s.username,
        credential: s.credential,
        enabled: s.enabled,
      }));
      localStorage.setItem(ICE_STORAGE_KEY, JSON.stringify(data));
    };

    // 测试单个 ICE 服务器：收集候选，判断 srflx(STUN)/relay(TURN) 是否可用并测量延迟
    const testIceServer = (server) => {
      const iceServer = { urls: server.urls };
      if (server.type === "turn") {
        iceServer.username = server.username;
        iceServer.credential = server.credential;
      }

      const pc = new RTCPeerConnection({ iceServers: [iceServer] });
      const t0 = performance.now();

      return new Promise((resolve) => {
        let settled = false;
        const done = (result) => {
          if (settled) return;
          settled = true;
          try { pc.close(); } catch { /* ignore */ }
          resolve(result);
        };

        pc.onicecandidate = (e) => {
          if (!e.candidate) {
            // 收集结束，仍未拿到可用候选
            done({ ok: false, latency: null, type: "", error: "未收集到可用候选" });
            return;
          }
          const cand = e.candidate.candidate || "";
          const typMatch = cand.match(/typ\s+(\w+)/);
          const typ = typMatch ? typMatch[1] : "";
          if (typ === "srflx" || typ === "relay") {
            done({
              ok: true,
              latency: Math.round(performance.now() - t0),
              type: typ,
              error: "",
            });
          }
        };

        // 创建 DataChannel 触发 ICE 收集
        try { pc.createDataChannel("test"); } catch { /* ignore */ }
        pc.createOffer()
          .then((offer) => pc.setLocalDescription(offer))
          .catch(() => done({ ok: false, latency: null, type: "", error: "创建 offer 失败" }));

        // 超时 8s
        setTimeout(() => done({ ok: false, latency: null, type: "", error: "超时（8s）" }), 8000);
      });
    };

    export default async () => {
      return {
        data: {
          servers: loadServers(),
          formType: "stun",
          formUrls: "",
          formUsername: "",
          formCredential: "",
          editingId: null,
        },
        proto: {
          get enabledCount() {
            return (this.servers || []).filter((s) => s.enabled).length;
          },
          // 持久化保存
          persist() {
            saveServers(this.servers);
          },

          // 提交添加/编辑
          handleSubmit() {
            const urls = this.formUrls.trim();
            if (!urls) return;

            const data = {
              type: this.formType,
              urls,
              username: this.formType === "turn" ? this.formUsername.trim() : "",
              credential: this.formType === "turn" ? this.formCredential : "",
              enabled: true,
              testStatus: "idle",
              testLatency: null,
              testType: "",
              testError: "",
            };

            if (this.editingId) {
              const idx = this.servers.findIndex((s) => s.id === this.editingId);
              if (idx >= 0) {
                this.servers[idx] = { ...this.servers[idx], ...data };
              }
            } else {
              this.servers.push({ ...data, id: genId() });
            }

            this.cancelEdit();
            this.persist();
          },

          cancelEdit() {
            this.editingId = null;
            this.formType = "stun";
            this.formUrls = "";
            this.formUsername = "";
            this.formCredential = "";
          },

          editServer(index) {
            const s = this.servers[index];
            if (!s) return;
            this.editingId = s.id;
            this.formType = s.type;
            this.formUrls = s.urls;
            this.formUsername = s.username;
            this.formCredential = s.credential;
          },

          deleteServer(index) {
            this.servers.splice(index, 1);
            this.persist();
          },

          toggleEnabled(index) {
            const s = this.servers[index];
            if (!s) return;
            s.enabled = !s.enabled;
            this.persist();
          },

          moveUp(index) {
            if (index <= 0) return;
            const arr = this.servers;
            const tmp = arr[index - 1];
            arr[index - 1] = arr[index];
            arr[index] = tmp;
            this.persist();
          },

          moveDown(index) {
            const arr = this.servers;
            if (index >= arr.length - 1) return;
            const tmp = arr[index + 1];
            arr[index + 1] = arr[index];
            arr[index] = tmp;
            this.persist();
          },

          // 测试单个服务器
          async testOne(index) {
            const s = this.servers[index];
            if (!s || s.testStatus === "testing") return;

            s.testStatus = "testing";
            const result = await testIceServer(s);
            // 重新取引用防止异步期间数组变化
            const cur = this.servers[index];
            if (!cur) return;
            if (result.ok) {
              cur.testStatus = "ok";
              cur.testLatency = result.latency;
              cur.testType = result.type;
              cur.testError = "";
            } else {
              cur.testStatus = "fail";
              cur.testLatency = null;
              cur.testType = "";
              cur.testError = result.error;
            }
          },

          // 依次测试所有服务器
          async testAll() {
            for (let i = 0; i < this.servers.length; i++) {
              await this.testOne(i);
            }
          },

          // 恢复默认配置
          resetDefaults() {
            this.servers = DEFAULT_SERVERS.map((s) => ({
              ...s,
              id: genId(),
              testStatus: "idle",
              testLatency: null,
              testType: "",
              testError: "",
            }));
            this.persist();
          },
        },
      };
    };
  </script>
</template>
