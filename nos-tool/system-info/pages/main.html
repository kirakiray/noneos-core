  <div class="container">
    <h1>
      <n-icon icon="material-symbols:info"></n-icon>

    </h1>
    <p class="subtitle">
      查看当前系统版本、Service Worker 注册状态，并手动管理系统更新。所有操作直接调用 nos-tool/_install/main.js 的安装 API。
    </p>

    <!-- 系统版本 -->

        系统版本
      </div>
      <div class="info-card">
        <div class="info-grid">
          <div class="info-item">
            <span class="info-label">本地版本</span>
            <span attr:class="'info-value' + (localVersion ? '' : ' muted')">{{ localVersion || '—' }}</span>
          </div>
          <div class="info-item">
            <span class="info-label">线上版本</span>
            <span attr:class="'info-value' + (onlineVersion ? '' : ' muted')">{{ onlineVersion || '—' }}</span>
          </div>
          <div class="info-item">
            <span class="info-label">SW 版本</span>
            <span attr:class="'info-value' + (swVersion ? '' : ' muted')">{{ swVersion || '—' }}</span>
          </div>
          <div class="info-item">
            <span class="info-label">状态</span>

        <div class="info-actions">

            {{ checking ? '检查中…' : '检查更新' }}
          </st-button>
          <st-button variant="text" style="font-size: 13px;" on:click="refreshAll">
            <n-icon icon="material-symbols:refresh" slot="prefix"></n-icon>
            刷新全部
          </st-button>
        </div>
        <o-if :value="systemConfig.mode">
          <div class="config-detail">
            mode: {{ systemConfig.mode }} · nosMapPath: {{ systemConfig.nosMapPath || '—' }}

    <!-- Service Worker -->
    <div class="section">
      <div class="section-title">
        <n-icon icon="material-symbols:cached"></n-icon>
        Service Worker
      </div>
      <div class="info-card">
        <div class="controller-info">
          <span class="ctrl-label">当前控制器:</span>
          <o-if :value="controllerInfo">

            <span attr:class="'state-badge ' + controllerInfo.state">{{ controllerInfo.state }}</span>

        <div class="info-actions" style="margin-top: 14px;">

        <div class="info-actions">
          <st-button variant="filled" color="primary" style="font-size: 13px;" on:click="installSystem" attr:disabled="installing || updatingSw">
            <n-icon icon="material-symbols:download" slot="prefix"></n-icon>

        <o-if :value="errorMsg">

      </div>
    </div>

    <div class="footer-tip">
说明：
· 检查更新 会比对本地版本与线上 <code>nos.json</code> 的版本号。
· 注册 SW 直接注册 <code>sw.js</code>（不带版本号参数），适用于首次安装或调试。
· 更新 SW 先拉取线上版本号，再以 <code>sw.js?v=版本号</code> 方式重新注册，可绕过浏览器对 sw.js 的缓存。
· 立即更新系统 执行完整流程：重新注册 SW → 下载 nos.zip → 哈希校验 → 写入 OPFS。
· 完整更新或 SW 更新后，建议刷新页面让新版本 Service Worker 接管。
    </div>

  <script>
    export default async ({ load }) => {
      const { check, install, installServiceWorker } = await load("../../_install/main.js");
      const { registerSw, clearSw, getOnlineData } = await load("../../_install/util.js");

      return {
        data: {
          checking: false,
          updatingSw: false,
          installing: false,
          installDesc: "",
          installStep: 0,
          installStepTotal: 0,
          localVersion: "",
          onlineVersion: "",
          swVersion: "",
          systemState: "unknown",
          systemConfig: {},
          errorMsg: "",
          registrations: [],
          controllerInfo: null,
        },
        proto: {
          get stateText() {
            switch (this.systemState) {
              case "installed": return "已是最新";
              case "upgradable": return "可更新";
              case "uninstalled": return "未安装";
              default: return "未知";
            }
          },

          async refreshAll() {
            this.errorMsg = "";
            await Promise.all([this.checkUpdate(), this.refreshSwInfo()]);
          },

          async checkUpdate() {
            this.checking = true;
            this.errorMsg = "";
            try {
              const result = await check();
              this.systemState = result.state;
              this.localVersion = result.version || result.localVersion || "";
              this.swVersion = result.serviceWorkerVersion || "";
              this.systemConfig = result.systemConfig || {};

              if (result.onlineVersion) {
                this.onlineVersion = result.onlineVersion;
              } else {
                // installed 状态下 check 不返回 onlineVersion，单独获取
                try {
                  const { onlineNosConfig } = await getOnlineData();
                  this.onlineVersion = onlineNosConfig.version || "";
                } catch {
                  this.onlineVersion = "";
                }
              }
            } catch (err) {
              this.errorMsg = "检查失败: " + (err.message || String(err));
            }
            this.checking = false;
          },

          async refreshSwInfo() {
            if (!("serviceWorker" in navigator)) {
              this.registrations = [];
              this.controllerInfo = null;
              return;
            }
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              this.registrations = regs.map((reg) => {
                const worker = reg.active || reg.waiting || reg.installing;
                return {
                  scope: reg.scope,
                  scriptURL: worker ? worker.scriptURL : "(unknown)",
                  state: worker ? worker.state : "unknown",
                };
              });
              const ctrl = navigator.serviceWorker.controller;
              this.controllerInfo = ctrl
                ? { scriptURL: ctrl.scriptURL, state: ctrl.state }
                : null;
            } catch (err) {
              this.errorMsg = "读取 SW 信息失败: " + (err.message || String(err));
            }
          },

          // 直接注册 sw.js（不带版本号，用于首次安装/调试）
          async manualRegisterSw() {
            this.errorMsg = "";
            try {
              await registerSw("sw.js");
              await this.refreshSwInfo();
            } catch (err) {
              this.errorMsg = "注册失败: " + (err.message || String(err));
            }
          },

          // 卸载所有 Service Worker
          async manualClearSw() {
            this.errorMsg = "";
            try {
              await clearSw();
              await this.refreshSwInfo();
            } catch (err) {
              this.errorMsg = "卸载失败: " + (err.message || String(err));
            }
          },

          // 仅更新 SW（拉取线上版本号 → 带版本参数重注册）
          async updateSwOnly() {
            this.updatingSw = true;
            this.installStep = 0;
            this.installStepTotal = 0;
            this.installDesc = "";
            this.errorMsg = "";
            try {
              await installServiceWorker((e) => {
                if (typeof e === "string") return;
                this.installStep = e.step || 0;
                this.installDesc = e.desc || "";
                this.installStepTotal = e.total || 0;
              });
              this.updatingSw = false;
              await this.refreshSwInfo();
            } catch (err) {
              this.updatingSw = false;
              this.errorMsg = "SW 更新失败: " + (err.message || String(err));
            }
          },

          // 完整更新系统（SW + 系统文件）
          async installSystem() {
            this.installing = true;
            this.installStep = 0;
            this.installStepTotal = 0;
            this.installDesc = "";
            this.errorMsg = "";
            try {
              await install((e) => {
                if (typeof e === "string") {
                  this.installDesc = "writing: " + e;
                  return;
                }
                this.installStep = e.step || 0;
                this.installDesc = e.desc || "";
                this.installStepTotal = e.total || 0;
              });
              this.installing = false;
              await this.refreshAll();
            } catch (err) {
              this.installing = false;
              this.errorMsg = "更新失败: " + (err.message || String(err));
            }
          },
        },
        attached() {
          this.refreshAll();
        },
      };
    };
  </script>
