  <script>
    // 解析 .gitignore 文本为可用的过滤函数（轻量实现，覆盖常见规则）
    const compileGitignore = (text) => {
      const patterns = (text || "")
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line && !line.startsWith("#"));

      const matchers = patterns.map((raw) => {
        const negated = raw.startsWith("!");
        let pattern = negated ? raw.slice(1) : raw;
        const dirOnly = pattern.endsWith("/");
        if (dirOnly) pattern = pattern.slice(0, -1);

        // 将 glob 转换为正则（支持 * ** ?）
        let regex = "";
        let i = 0;
        while (i < pattern.length) {
          const c = pattern[i];
          if (c === "*") {
            if (pattern[i + 1] === "*") {
              // ** 匹配任意层级
              regex += ".*";
              i += 2;
              if (pattern[i] === "/") i += 1;
            } else {
              // * 匹配除斜杠外任意字符
              regex += "[^/]*";
              i += 1;
            }
          } else if (c === "?") {
            regex += "[^/]";
            i += 1;
          } else if (c === "/") {
            regex += "\\/";
            i += 1;
          } else if ("\\^$.|+()[]{}".includes(c)) {
            regex += "\\" + c;
            i += 1;
          } else {
            regex += c;
            i += 1;
          }
        }
        let re;
        try {
          re = new RegExp("(^|\\/)" + regex + (dirOnly ? "(\\/|$)" : "(\\/|$)"));
        } catch (e) {
          return null;
        }
        return { negated, dirOnly, re };
      }).filter(Boolean);

      return (relativePath, isDir) => {
        let ignored = false;
        for (const m of matchers) {
          if (m.dirOnly && !isDir) {
            // 目录规则仅对路径前缀匹配（父目录是目录）
            const parts = relativePath.split("/");
            let matched = false;
            for (let i = 1; i < parts.length; i++) {
              const prefix = parts.slice(0, i).join("/");
              if (m.re.test(prefix)) {
                matched = true;
                break;
              }
            }
            if (matched) ignored = true;
            continue;
          }
          if (m.re.test(relativePath)) {
            ignored = !m.negated;
          }
        }
        return ignored;
      };
    };

    // 从 <locale-text> 节点提取基准文本和语言映射
    const extractFromLocaleText = (ltEl) => {
      const langMap = {};
      let firstLang = null;
      let firstText = null;

      // 仅取直接子元素
      Array.from(ltEl.children).forEach((child) => {
        const lang = child.getAttribute("lang");
        if (!lang) return;
        const text = child.innerHTML.trim();
        langMap[lang] = text;
        if (firstLang === null) {
          firstLang = lang;
          firstText = text;
        }
      });

      if (Object.keys(langMap).length === 0) return null;

      // 基准文本优先级：cn → en → 第一个带 lang 的子元素
      const baseText = langMap.cn ?? langMap.en ?? firstText;
      const baseLang = langMap.cn ? "cn" : langMap.en ? "en" : firstLang;
      return { langMap, baseText, baseLang };
    };

    // 从 JS 源码中提取所有 getLocaleText({...}) 调用的语言映射
    // 通过括号平衡扫描，正确处理字符串内的 { } 和跨行对象字面量
    const extractFromJs = (source) => {
      const results = [];
      const callRe = /getLocaleText\s*\(\s*/g;
      let m;
      while ((m = callRe.exec(source)) !== null) {
        const start = callRe.lastIndex;
        if (source[start] !== "{") continue; // 非对象字面量参数（如变量），跳过

        // 扫描大括号平衡，跳过字符串内的 { }
        let depth = 0;
        let i = start;
        let inStr = null;
        for (; i < source.length; i++) {
          const c = source[i];
          if (inStr) {
            if (c === "\\") {
              i++;
              continue;
            }
            if (c === inStr) inStr = null;
            continue;
          }
          if (c === '"' || c === "'" || c === "`") {
            inStr = c;
            continue;
          }
          if (c === "{") depth++;
          else if (c === "}") {
            depth--;
            if (depth === 0) {
              i++;
              break;
            }
          }
        }
        const objStr = source.slice(start, i);

        // 从对象字面量字符串里提取 lang: "..." / '...' / `...`
        const langMap = {};
        const propRe = /(\w+)\s*:\s*(['"`])([\s\S]*?)\2/g;
        let pm;
        while ((pm = propRe.exec(objStr)) !== null) {
          langMap[pm[1]] = pm[3];
        }
        if (Object.keys(langMap).length > 0) {
          results.push(langMap);
        }
      }
      return results;
    };

    // 模块级变量保存 DirHandle，避免被 ofa.js 包装成 Stanz 代理导致 .get() 被劫持
    let _rootHandle = null;
    // 模块级变量保存最近一次扫描的详细数据（供列表视图读取）
    let _lastDetail = null;
    // 模块级变量保存最近一次合并后的完整 JSON 映射（供冗余清理使用）
    let _lastFinalMap = null;

    export default async ({ load }) => {
      const { open } = await load("/nos/fs/main.js");
      const { getHash } = await load("/nos/util/hash/get-hash.js");
      const { getLocaleText } = await load("/nos/locale-text/get-locale-text.js");
      const { default: confirm } = await load("https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/dialog/confirm.js");

      return {
        data: {
          canUse: !!window.showDirectoryPicker,
          busy: false,
          hasRoot: false,
          rootPath: "",
          statusText: "",
          hasResult: false,
          stats: {
            scanned: 0,
            hitFiles: 0,
            totalEntries: 0,
            added: 0,
            updated: 0,
            kept: 0,
            orphaned: 0,
          },
          previewText: "",
          activeView: "main", // main | scanned | hits | total | added | updated | kept
          listTitle: "",
          listCount: "",
          fileList: [],
          entryList: [],
        },
        proto: {
          setStatus(msg) {
            this.statusText = msg;
          },

          async handlePick() {
            if (this.busy) return;
            this.busy = true;
            this.statusText = "";
            this.hasResult = false;
            this.previewText = "";
            this.activeView = "main";
            _lastDetail = null;
            try {
              const handle = await open({ mode: "readwrite" });
              _rootHandle = handle;
              this.hasRoot = true;
              this.rootPath = handle.name + "/";
              this.statusText = "已选择: " + handle.name;
            } catch (e) {
              this.statusText = "选择目录失败: " + (e?.message || e);
            } finally {
              this.busy = false;
            }
          },

          // 读取 .gitignore 内容；读取失败返回空字符串
          async readGitignore(root) {
            try {
              const f = await root.get(".gitignore");
              if (!f) return "";
              return await f.text();
            } catch (e) {
              return "";
            }
          },

          // 递归收集所有源码文件（.html / .js / .mjs）
          async collectSourceFiles(dirHandle, basePath, isIgnored, files) {
            for await (const entry of dirHandle.values()) {
              const relPath = basePath
                ? basePath + "/" + entry.name
                : entry.name;

              if (entry.kind === "dir") {
                if (isIgnored(relPath + "/", true)) continue;
                await this.collectSourceFiles(entry, relPath, isIgnored, files);
              } else {
                if (isIgnored(relPath, false)) continue;
                const name = entry.name;
                if (
                  name.endsWith(".html") ||
                  name.endsWith(".js") ||
                  name.endsWith(".mjs")
                ) {
                  files.push({ relPath, handle: entry });
                }
              }
            }
          },

          async handleGenerate() {
            if (this.busy || !_rootHandle) return;
            this.busy = true;
            this.hasResult = false;
            this.previewText = "";
            const root = _rootHandle;

            try {
              this.statusText = "读取 .gitignore ...";
              const gitignoreText = await this.readGitignore(root);
              const isIgnored = compileGitignore(gitignoreText);

              // 兜底：永远跳过 .git
              const baseIgnored = (path, isDir) => {
                if (path === ".git" || path.startsWith(".git/")) return true;
                return isIgnored(path, isDir);
              };

              this.statusText = "扫描源码文件 ...";
              const files = [];
              await this.collectSourceFiles(root, "", baseIgnored, files);

              this.statusText = "解析 <locale-text> 与 getLocaleText 调用 ...";
              const entries = []; // { langMap, baseText, baseLang, sourceFile }
              const scannedFiles = []; // { relPath, hit, count }
              let hitFiles = 0;

              for (let i = 0; i < files.length; i++) {
                const { relPath, handle } = files[i];
                let text;
                try {
                  text = await handle.text();
                } catch (e) {
                  scannedFiles.push({ relPath, hit: false, count: 0 });
                  continue;
                }

                let count = 0;

                if (relPath.endsWith(".js") || relPath.endsWith(".mjs")) {
                  // JS 源码：正则提取 getLocaleText({...}) 调用
                  const jsLangMaps = extractFromJs(text);
                  jsLangMaps.forEach((langMap) => {
                    const baseText =
                      langMap.cn ?? langMap.en ?? Object.values(langMap)[0];
                    const baseLang = langMap.cn
                      ? "cn"
                      : langMap.en
                        ? "en"
                        : Object.keys(langMap)[0];
                    count++;
                    entries.push({
                      langMap,
                      baseText,
                      baseLang,
                      sourceFile: relPath,
                    });
                  });
                  if (count > 0) hitFiles++;
                } else {
                  // HTML：DOMParser 解析，递归收集 locale-text（含 template 内嵌）
                  const doc = new DOMParser().parseFromString(
                    text,
                    "text/html",
                  );
                  const ltNodes = [];
                  const collectLt = (root) => {
                    root.querySelectorAll("locale-text").forEach((n) =>
                      ltNodes.push(n));
                    root.querySelectorAll("template").forEach((t) => {
                      if (t.content) collectLt(t.content);
                    });
                  };
                  collectLt(doc);

                  if (ltNodes.length > 0) {
                    ltNodes.forEach((ltEl) => {
                      const extracted = extractFromLocaleText(ltEl);
                      if (!extracted) return;
                      count++;
                      entries.push({ ...extracted, sourceFile: relPath });
                    });
                    hitFiles++;
                  }
                }

                scannedFiles.push({ relPath, hit: count > 0, count });
              }

              this.statusText = "计算 hash 与合并 ...";
              // 合并到 map：相同 hash 聚合
              const merged = {};
              for (const item of entries) {
                const hash = await getHash(item.baseText);
                if (!merged[hash]) {
                  merged[hash] = {
                    ...item.langMap,
                    __baseText: item.baseText,
                    __sourceFile: item.sourceFile,
                  };
                } else {
                  // 同 hash，用新条目补充缺失的语言
                  for (const [lang, text] of Object.entries(item.langMap)) {
                    if (merged[hash][lang] === undefined) {
                      merged[hash][lang] = text;
                    }
                  }
                }
              }

              // 读取已有 locale-text.json 做增量合并
              let existing = {};
              try {
                const oldFile = await root.get("locale-text.json");
                if (oldFile) {
                  existing = await oldFile.json();
                }
              } catch (e) {
                existing = {};
              }

              let added = 0;
              let updated = 0;
              let kept = 0;
              const finalMap = { ...existing };
              const entryRecords = []; // { hash, baseText, status, sourceFile, langs }

              for (const [hash, mergedData] of Object.entries(merged)) {
                const baseText = mergedData.__baseText;
                const sourceFile = mergedData.__sourceFile;
                const langMap = { ...mergedData };
                delete langMap.__baseText;
                delete langMap.__sourceFile;

                let status;
                if (!finalMap[hash]) {
                  finalMap[hash] = langMap;
                  status = "added";
                  added++;
                } else {
                  // 保留旧的非基准语言翻译，仅更新/补充基准语言字段
                  let changed = false;
                  for (const [lang, text] of Object.entries(langMap)) {
                    if (finalMap[hash][lang] !== text) {
                      // 已存在则更新（基准语言文本可能已变）
                      if (finalMap[hash][lang] !== undefined) {
                        changed = true;
                      }
                      finalMap[hash][lang] = text;
                    }
                  }
                  if (changed) {
                    status = "updated";
                    updated++;
                  } else {
                    status = "kept";
                    kept++;
                  }
                }

                entryRecords.push({
                  hash,
                  baseText,
                  status,
                  sourceFile: sourceFile || "",
                  langs: Object.keys(langMap).join(", "),
                });
              }

              // 统计冗余条目：旧 JSON 中存在但本次扫描未命中的
              const orphanedRecords = [];
              for (const [hash, entry] of Object.entries(existing)) {
                if (!merged[hash]) {
                  const baseText =
                    entry.cn ?? entry.en ?? Object.values(entry)[0];
                  orphanedRecords.push({
                    hash,
                    baseText: baseText ?? "",
                    status: "orphaned",
                    sourceFile: "",
                    langs: Object.keys(entry).join(", "),
                  });
                }
              }

              const output = JSON.stringify(finalMap, null, 2);
              this.previewText = output;

              this.statusText = "写入 locale-text.json ...";
              const outFile = await root.get("locale-text.json", {
                create: "file",
              });
              await outFile.write(output);

              this.stats = {
                scanned: files.length,
                hitFiles,
                totalEntries: Object.keys(finalMap).length,
                added,
                updated,
                kept,
                orphaned: orphanedRecords.length,
              };
              this.hasResult = true;

              // 保存详细数据供列表视图使用
              _lastDetail = {
                scannedFiles,
                entries: [...entryRecords, ...orphanedRecords],
              };
              _lastFinalMap = finalMap;

              this.statusText = "完成。已写入 " + root.name + "/locale-text.json";
            } catch (e) {
              this.statusText = "生成失败: " + (e?.message || e);
              console.error(e);
            } finally {
              this.busy = false;
            }
          },

          // 切换到列表视图
          showList(type) {
            if (!_lastDetail) return;
            const titles = {
              scanned: "扫描的文件",
              hits: "命中文件",
              total: "全部条目",
              added: "新增条目",
              updated: "更新条目",
              kept: "保留条目",
              orphaned: "冗余条目",
            };
            this.listTitle = titles[type] || type;

            if (type === "scanned") {
              this.fileList = _lastDetail.scannedFiles;
              this.entryList = [];
              this.listCount = _lastDetail.scannedFiles.length + " 个文件";
            } else if (type === "hits") {
              const hits = _lastDetail.scannedFiles.filter((f) => f.hit);
              this.fileList = hits;
              this.entryList = [];
              this.listCount = hits.length + " 个文件";
            } else {
              let entries;
              if (type === "total") {
                entries = _lastDetail.entries;
              } else {
                entries = _lastDetail.entries.filter(
                  (e) => e.status === type,
                );
              }
              this.entryList = entries;
              this.fileList = [];
              this.listCount = entries.length + " 条";
            }
            this.activeView = type;
          },

          backToMain() {
            this.activeView = "main";
          },

          // 清理所有冗余条目（旧 JSON 中存在但本次扫描未命中的）
          async cleanOrphaned() {
            if (!_lastFinalMap || !_rootHandle || !_lastDetail) return;
            const orphanedEntries = _lastDetail.entries.filter(
              (e) => e.status === "orphaned",
            );
            if (orphanedEntries.length === 0) return;

            const result = await confirm({
              title: getLocaleText({
                cn: "确认清理",
                en: "Confirm Clean",
              }),
              content: getLocaleText(
                {
                  cn: "确认清理 {count} 条冗余条目吗？此操作不可撤销。",
                  en: "Are you sure you want to clean {count} orphaned entries? This action cannot be undone.",
                },
                { count: orphanedEntries.length },
              ),
            });
            if (!result) return;

            for (const e of orphanedEntries) {
              delete _lastFinalMap[e.hash];
            }

            const output = JSON.stringify(_lastFinalMap, null, 2);
            const outFile = await _rootHandle.get("locale-text.json");
            await outFile.write(output);

            this.previewText = output;

            _lastDetail.entries = _lastDetail.entries.filter(
              (e) => e.status !== "orphaned",
            );
            this.entryList = [];
            this.listCount = "0 条";

            this.stats = {
              ...this.stats,
              orphaned: 0,
              totalEntries: Object.keys(_lastFinalMap).length,
            };

            this.statusText = getLocaleText({
              cn: "已清理冗余条目",
              en: "Orphaned entries cleaned",
            });
          },
        },
        attached() {
          if (!this.canUse) {
            this.statusText = "浏览器不支持 showDirectoryPicker";
          }
        },
      };
    };
  </script>
</template>
