<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>locale-text 多语言模块测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@latest/dist/ofa.mjs#debug"
      type="module"
    ></script>
  </head>
  <body>
    <h1>locale-text 多语言模块测试</h1>

    <!-- 注册 locale-text 组件 -->
    <l-m src="/nos/locale-text/locale-text.html"></l-m>
    <div id="query-target"></div>

    <sb-test name="getLang - 返回非空语言码">
      <template>
        <script type="module">
          {
            const { getLang } =
              await import("/nos/locale-text/get-locale-text.js");
            const lang_getLang = getLang();
            const isString_getLang = typeof lang_getLang === "string";
            const nonEmpty_getLang = lang_getLang.length > 0;

            return {
              assert: isString_getLang && nonEmpty_getLang,
              content: {
                message: "getLang 应返回非空字符串语言码",
                lang: lang_getLang,
                checks: { isString_getLang, nonEmpty_getLang },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="getLocaleText - 返回当前语言对应文本">
      <template>
        <script type="module">
          {
            const { getLang, getLocaleText } =
              await import("/nos/locale-text/get-locale-text.js");
            const lang_match = getLang();

            // 构造包含当前语言的对象，应精确命中
            const obj_match = { [lang_match]: "当前语言文本", en: "English" };
            const text_match = getLocaleText(obj_match);

            return {
              assert: text_match === "当前语言文本",
              content: {
                message: "存在当前语言 key 时应返回对应文本",
                lang: lang_match,
                text: text_match,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="getLocaleText - 缺少当前语言时回退到 en">
      <template>
        <script type="module">
          {
            const { getLang, getLocaleText } =
              await import("/nos/locale-text/get-locale-text.js");
            const lang_fallbackEn = getLang();

            // 使用一个绝不会命中的语言码，且提供 en，应回退到 en
            const obj_fallbackEn = {
              "xx-not-exist": "不该出现",
              en: "English Fallback",
            };
            const text_fallbackEn = getLocaleText(obj_fallbackEn);

            // 确认当前语言确实不是那个假语言码
            const currentNotFake_fallbackEn =
              lang_fallbackEn !== "xx-not-exist";

            return {
              assert:
                currentNotFake_fallbackEn &&
                text_fallbackEn === "English Fallback",
              content: {
                message: "缺少当前语言但存在 en 时应返回 en 文本",
                lang: lang_fallbackEn,
                text: text_fallbackEn,
                checks: { currentNotFake_fallbackEn },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text 组件 - 显示指定 lang 的子元素">
      <template>
        <script type="module">
          {
            const container_show = $("#query-target");
            container_show.html = `
              <locale-text lang="en">
                <span lang="cn">中文内容</span>
                <span lang="en">English Content</span>
              </locale-text>
            `;

            // 等待组件渲染完成
            await new Promise((r) => setTimeout(r, 200));

            const cnEl_show = container_show.$('span[lang="cn"]');
            const enEl_show = container_show.$('span[lang="en"]');

            // 通过 offsetParent 判断元素是否实际可见（display:none 时为 null）
            const cnVisible_show = cnEl_show.ele.offsetParent !== null;
            const enVisible_show = enEl_show.ele.offsetParent !== null;

            return {
              assert: enVisible_show && !cnVisible_show,
              content: {
                message: "lang=en 时应仅显示英文子元素",
                checks: { enVisible_show, cnVisible_show },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ====== 以下为针对本轮缺陷修复新增的用例 ====== -->

    <sb-test name="setLang - 切换后 getLang 立即生效并可恢复">
      <template>
        <script type="module">
          {
            const { getLang, setLang } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            const before = getLang();
            setLang("en");
            const afterSet = getLang();
            setLang(null);
            const afterReset = getLang();

            return {
              assert: afterSet === "en" && afterReset === before,
              content: {
                message: "setLang 应立即修改 getLang 返回值，setLang(null) 应回到初始值",
                before,
                afterSet,
                afterReset,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="setLang - 派发 locale-text:lang-change 事件">
      <template>
        <script type="module">
          {
            const { setLang } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            let fired = false;
            const handler = () => (fired = true);
            window.addEventListener("locale-text:lang-change", handler);
            setLang("cn");
            // 移除监听，避免影响后续用例
            window.removeEventListener("locale-text:lang-change", handler);

            return {
              assert: fired === true,
              content: {
                message: "setLang 调用后应派发 locale-text:lang-change 事件",
                fired,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="getLocaleText - null/undefined/空对象不抛错">
      <template>
        <script type="module">
          {
            const { getLocaleText } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            const checks = {
              noThrow_null: true,
              noThrow_undefined: true,
              noThrow_empty: true,
            };

            let text_null, text_undefined, text_empty;
            try {
              text_null = getLocaleText(null);
            } catch (e) {
              checks.noThrow_null = false;
            }
            try {
              text_undefined = getLocaleText(undefined);
            } catch (e) {
              checks.noThrow_undefined = false;
            }
            try {
              text_empty = getLocaleText({});
            } catch (e) {
              checks.noThrow_empty = false;
            }

            const undefinedResult =
              text_null === undefined &&
              text_undefined === undefined &&
              text_empty === undefined;

            return {
              assert:
                checks.noThrow_null &&
                checks.noThrow_undefined &&
                checks.noThrow_empty &&
                undefinedResult,
              content: {
                message:
                  "getLocaleText 对 null/undefined/空对象应安全返回 undefined，不抛错",
                text_null,
                text_undefined,
                text_empty,
                checks,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text 组件 - 不设 lang 属性时按 getLang() 显示（ready 钩子）">

    <sb-test name="locale-text 组件 - setLang 后自动刷新显示（监听全局事件）">
      <template>
        <script type="module">
          {
            const { setLang } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            const container_react = $("#query-target");
            container_react.html = `
              <locale-text>
                <span lang="cn">中文-响应式</span>
                <span lang="en">English-Reactive</span>
              </locale-text>
            `;

            // 先设为 cn，等待渲染
            setLang("cn");
            await new Promise((r) => setTimeout(r, 200));

            const cnEl_react = container_react.$('span[lang="cn"]');
            const enEl_react = container_react.$('span[lang="en"]');
            const cnVisible_before = cnEl_react.ele.offsetParent !== null;
            const enVisible_before = enEl_react.ele.offsetParent !== null;

            // 切换到 en，组件应自动刷新
            setLang("en");
            await new Promise((r) => setTimeout(r, 200));

            const cnVisible_after = cnEl_react.ele.offsetParent !== null;
            const enVisible_after = enEl_react.ele.offsetParent !== null;

            // 恢复语言，避免影响后续用例
            setLang(null);

            return {
              assert:
                cnVisible_before && !enVisible_before && !cnVisible_after && enVisible_after,
              content: {
                message: "setLang 切换语言后，组件应无需重载即可自动刷新显示",
                checks: { cnVisible_before, enVisible_before, cnVisible_after, enVisible_after },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text 组件 - 子元素动态变化后自动刷新（MutationObserver）">
      <template>
        <script type="module">
          {
            const { setLang } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            setLang("cn");

            const container_mo = $("#query-target");
            // 初始只有 cn 子元素，应当显示 cn
            container_mo.html = `
              <locale-text>
                <span lang="cn">中文-动态</span>
              </locale-text>
            `;

            await new Promise((r) => setTimeout(r, 200));
            const cnEl_mo = container_mo.$('span[lang="cn"]');
            const cnVisible_before = cnEl_mo.ele.offsetParent !== null;

            // 动态插入 en 子元素，并把全局语言切换为 en，
            // MutationObserver 与全局事件都应触发刷新
            const lt = container_mo.$("locale-text");
            const newEn = document.createElement("span");
            newEn.setAttribute("lang", "en");
            newEn.textContent = "English-MO";
            lt.ele.appendChild(newEn);

            setLang("en");
            await new Promise((r) => setTimeout(r, 200));

            const enEl_mo = container_mo.$('span[lang="en"]');
            const cnVisible_after = cnEl_mo.ele.offsetParent !== null;
            const enVisible_after = enEl_mo.ele.offsetParent !== null;

            setLang(null);

            return {
              assert:
                cnVisible_before && enVisible_after && !cnVisible_after,
              content: {
                message: "slot 子元素变化与 setLang 都应触发组件刷新",
                checks: { cnVisible_before, cnVisible_after, enVisible_after },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text 组件 - 无带 lang 子元素时不生成脏 CSS">
      <template>
        <script type="module">
          {
            const { setLang } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            setLang("en");

            const container_empty = $("#query-target");
            // 没有任何带 lang 的子元素

            await new Promise((r) => setTimeout(r, 200));

            const lt = container_empty.$("locale-text");
            const styleEl = lt.shadow.$("#lang-style");

            const noDirtyCss = !styleHtml.includes('lang="undefined"') && styleHtml === "";

            return {

              content: {
                message: "无带 lang 子元素时应清空注入样式，不生成脏 CSS",
                styleHtml,
              },

        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text 组件 - lang 属性含特殊字符时不破坏样式（CSS 转义）">
      <template>
        <script type="module">
          {
            const container_escape = $("#query-target");
            // 构造一个含双引号/反斜杠的 lang 值，验证 escapeCSSAttr 不破坏样式表
            // 用 script 方式注入，避免外层 HTML 解析干扰
            container_escape.html = `<locale-text id="lt-escape"></locale-text>`;
            await new Promise((r) => setTimeout(r, 50));

            const lt = container_escape.$("#lt-escape");
            // 显式指定一个含特殊字符的 lang，组件内 onlyLang 集合来源于子元素
            lt.attr("lang", 'a"b');
            const span = document.createElement("span");
            span.setAttribute("lang", 'a"b');
            span.textContent = "escaped";
            lt.ele.appendChild(span);

            await new Promise((r) => setTimeout(r, 200));

            // 只要样式表没抛错、子元素能正常显示即说明转义生效
            const spanVisible = span.offsetParent !== null;
            // styleSheets 不应存在无法解析的规则异常（间接验证：document 仍可用）
            const docOk = !!document.body;

            // 清理
            container_escape.html = "";

            return {
              assert: spanVisible && docOk,
              content: {
                message: "lang 属性含特殊字符时，CSS 选择器应被正确转义，不破坏样式表",
                checks: { spanVisible, docOk },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <!-- ====== 以下为针对 locale-text.json 回退机制新增的用例 ====== -->

    <sb-test name="locale-text.json 回退 - JSON 命中目标语言时显示 JSON 翻译">
      <template>
        <script type="module">
          {
            const { setLang, resetLocaleTextJsonCache } = await import(
              "/nos/locale-text/get-locale-text.js"
            );
            const { getHash } = await import("/nos/util/hash/get-hash.js");

            const baseText_jsonHit = "JSON回退测试文本";
            const hash_jsonHit = await getHash(baseText_jsonHit);

            // 临时向 window 注入 mock fetch，返回伪造的 locale-text.json
            // 重置模块级 JSON 缓存，确保 mock fetch 生效
            resetLocaleTextJsonCache();
            const origFetch_jsonHit = window.fetch;
            const fakeJson_jsonHit = {
              [hash_jsonHit]: {
                cn: baseText_jsonHit,
                ja: "JSONフォールバックテスト",
              },
            };
            window.fetch = (input, init) => {
              if (typeof input === "string" && input === "/locale-text.json") {
                return Promise.resolve(
                  new Response(JSON.stringify(fakeJson_jsonHit), {
                    status: 200,
                    headers: { "Content-Type": "application/json" },
                  }),
                );
              }
              return origFetch_jsonHit(input, init);
            };

            // 强制重新加载组件模块以重置 json 缓存（通过唯一的 query 参数）
            // 由于 _jsonPromise 是模块级缓存，这里改用直接刷新页面的策略不适用
            // 改为在当前已注册的组件上直接测试

            setLang("ja");

            const container_jsonHit = $("#query-target");
            container_jsonHit.html = `
              <locale-text id="lt-jsonHit">
                <span lang="cn">${baseText_jsonHit}</span>
                <span lang="en">JSON fallback test</span>
              </locale-text>
            `;

            await new Promise((r) => setTimeout(r, 300));

            const lt_jsonHit = container_jsonHit.$("#lt-jsonHit");
            const fallbackEl_jsonHit = lt_jsonHit.shadow.$("#lt-json-fallback");
            const fallbackText_jsonHit = fallbackEl_jsonHit
              ? fallbackEl_jsonHit.text.trim()
              : "";
            const cnEl_jsonHit = container_jsonHit.$('span[lang="cn"]');
            const enEl_jsonHit = container_jsonHit.$('span[lang="en"]');
            const cnVisible_jsonHit = cnEl_jsonHit.ele.offsetParent !== null;
            const enVisible_jsonHit = enEl_jsonHit.ele.offsetParent !== null;

            // 还原
            window.fetch = origFetch_jsonHit;
            setLang(null);

            return {
              assert:
                fallbackText_jsonHit === "JSONフォールバックテスト" &&
                !cnVisible_jsonHit &&
                !enVisible_jsonHit,
              content: {
                message: "JSON 命中目标语言时应注入 shadow 容器并隐藏 slot 子元素",
                hash: hash_jsonHit,
                fallbackText: fallbackText_jsonHit,
                checks: { cnVisible_jsonHit, enVisible_jsonHit },
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="locale-text.json 回退 - JSON 无条目时走原有 slot 回退">
      <template>
        <script type="module">
          {
            const { setLang, resetLocaleTextJsonCache } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            // mock fetch 返回空 JSON，确保不会命中
            // 重置模块级 JSON 缓存，确保 mock fetch 生效
            resetLocaleTextJsonCache();
            const origFetch_empty = window.fetch;
            window.fetch = (input, init) => {
              if (typeof input === "string" && input === "/locale-text.json") {
                return Promise.resolve(
                  new Response("{}", {
                    status: 200,
                    headers: { "Content-Type": "application/json" },
                  }),
                );
              }
              return origFetch_empty(input, init);
            };

            setLang("ja");

            const container_emptyJson = $("#query-target");
            container_emptyJson.html = `

                <span lang="cn">无JSON命中</span>
                <span lang="en">No JSON hit</span>

            const enVisible_emptyJson = enEl_emptyJson.ele.offsetParent !== null;

    <sb-test name="locale-text.json 回退 - fetch 失败时静默走 slot 回退">
      <template>
        <script type="module">
          {
            const { setLang, resetLocaleTextJsonCache } = await import(
              "/nos/locale-text/get-locale-text.js"
            );

            // mock fetch 返回 404
            // 重置模块级 JSON 缓存，确保 mock fetch 生效
            resetLocaleTextJsonCache();
            const origFetch_404 = window.fetch;
            window.fetch = (input, init) => {
              if (typeof input === "string" && input === "/locale-text.json") {
                return Promise.resolve(
                  new Response("Not Found", { status: 404 }),
                );
              }
              return origFetch_404(input, init);
            };

            setLang("ja");

            const container_404 = $("#query-target");
            container_404.html = `
              <locale-text id="lt-404">
                <span lang="cn">404回退</span>
                <span lang="en">404 fallback</span>
              </locale-text>
            `;

            await new Promise((r) => setTimeout(r, 300));

            const cnEl_404 = container_404.$('span[lang="cn"]');
            const enEl_404 = container_404.$('span[lang="en"]');
