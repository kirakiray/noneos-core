<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Root Cert Trust Set Test</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
</head>

<body>
  <h1>Root Cert Trust Set Tests</h1>

  <!-- 测试 1：真实仓库根证书（信任集格式），全新安装（无缓存）通过 pin 校验 -->
  <sb-test name="Real root cert passes pin check">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";

        const rc_cert = await fetch("/nos/root-cert.json").then((e) => e.json());

        try {
          await verifyRootCert(rc_cert, undefined);
          return { assert: true, content: { message: "pin 校验通过", generation: rc_cert.generation } };
        } catch (rc_error) {
          return { assert: false, content: { error: rc_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 2：篡改信任集内容后验签失败 -->
  <sb-test name="Tampered cert fails verification">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";

        const rc2_cert = await fetch("/nos/root-cert.json").then((e) => e.json());
        const rc2_tampered = {
          ...rc2_cert,
          signTime: rc2_cert.signTime + 1,
        };

        try {
          await verifyRootCert(rc2_tampered, undefined);
          return { assert: false, content: { message: "篡改的证书不应通过校验" } };
        } catch (rc2_error) {
          return { assert: true, content: { error: rc2_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 3：签名者不在信任集 active/grace 中时拒绝（retired 密钥不可签发） -->
  <sb-test name="Signer not in trust set is rejected">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";

        const rc3_cert = await fetch("/nos/root-cert.json").then((e) => e.json());
        // 伪造：把签名者从 keys 中标记为 retired
        const rc3_fake = {
          ...rc3_cert,
          keys: rc3_cert.keys.map((rc3_key) => ({ ...rc3_key, status: "retired" })),
        };

        try {
          await verifyRootCert(rc3_fake, undefined);
          return { assert: false, content: { message: "retired 签名者不应通过校验" } };
        } catch (rc3_error) {
          return { assert: true, content: { error: rc3_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 4：generation 回滚被拒绝 -->
  <sb-test name="Generation rollback is rejected">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";

        const rc4_cert = await fetch("/nos/root-cert.json").then((e) => e.json());
        // 模拟本地缓存是一个更高 generation 的信任集
        const rc4_cached = {
          ...rc4_cert,
          generation: rc4_cert.generation + 10,
        };

        try {
          await verifyRootCert(rc4_cert, rc4_cached);
          return { assert: false, content: { message: "generation 回滚不应通过校验" } };
        } catch (rc4_error) {
          return { assert: true, content: { error: rc4_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 5：链式信任——缓存信任集中的 grace 密钥签发的新信任集可以通过（无需 pin） -->
  <sb-test name="Chain trust from cached grace key passes">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";
        import { generateKeyPair, createSigner } from "/nos/crypto/crypto-ecdsa.js";

        const rc5_cached = await fetch("/nos/root-cert.json").then((e) => e.json());

        // 生成新密钥，以 grace 状态加入缓存信任集（模拟 add 轮换后的本地缓存）
        const rc5_pair = await generateKeyPair();
        const rc5_cachedWithGrace = {
          ...rc5_cached,
          keys: [...rc5_cached.keys, { id: "test-grace", publicKey: rc5_pair.publicKey, status: "grace" }],
        };

        // 新信任集由 grace 新钥签发
        const rc5_certData = {
          type: "root",
          name: rc5_cached.name,
          generation: rc5_cached.generation + 1,
          signTime: Date.now(),
          publicKey: rc5_pair.publicKey,
          keys: [
            ...rc5_cachedWithGrace.keys.map((rc5_key) => ({ ...rc5_key })),
          ],
        };
        const rc5_sign = await createSigner(rc5_pair.privateKey);
        const rc5_newCert = {
          ...rc5_certData,
          signature: btoa(String.fromCharCode(...new Uint8Array(await rc5_sign(JSON.stringify(rc5_certData))))),
        };

        try {
          await verifyRootCert(rc5_newCert, rc5_cachedWithGrace);
          return { assert: true, content: { message: "链式信任通过", generation: rc5_newCert.generation } };
        } catch (rc5_error) {
          return { assert: false, content: { error: rc5_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 6：签名者不在缓存信任集中时，链式校验拒绝（未 pin 的全新密钥无法插入） -->
  <sb-test name="Unknown signer rejected by cached trust set">
    <template>
      <script type="module">
        import { verifyRootCert } from "/nos-lib/_install/util.js";
        import { generateKeyPair, createSigner } from "/nos/crypto/crypto-ecdsa.js";

        const rc6_cached = await fetch("/nos/root-cert.json").then((e) => e.json());
        const rc6_pair = await generateKeyPair();

        // 攻击者自建信任集（签名者不在任何受信信任集中）
        const rc6_certData = {
          type: "root",
          name: rc6_cached.name,
          generation: rc6_cached.generation + 1,
          signTime: Date.now(),
          publicKey: rc6_pair.publicKey,
          keys: [{ id: "attacker", publicKey: rc6_pair.publicKey, status: "active" }],
        };
        const rc6_sign = await createSigner(rc6_pair.privateKey);
        const rc6_fakeCert = {
          ...rc6_certData,
          signature: btoa(String.fromCharCode(...new Uint8Array(await rc6_sign(JSON.stringify(rc6_certData))))),
        };

        try {
          await verifyRootCert(rc6_fakeCert, rc6_cached);
          return { assert: false, content: { message: "链外签名者不应通过校验" } };
        } catch (rc6_error) {
          return { assert: true, content: { error: rc6_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 7：吊销状态校验——干净状态通过 -->
  <sb-test name="Root status clean passes">
    <template>
      <script type="module">
        import { verifyRootStatus } from "/nos-lib/_install/util.js";

        const rs_cert = await fetch("/nos/root-cert.json").then((e) => e.json());
        const rs_status = await fetch("/root-status.json").then((e) => e.json());

        try {
          const rs_ok = await verifyRootStatus(rs_cert, rs_status);
          // null 状态（从未获取到）也应跳过检查
          const rs_nullOk = await verifyRootStatus(rs_cert, null);
          return { assert: rs_ok === true && rs_nullOk === true, content: { rs_ok, rs_nullOk } };
        } catch (rs_error) {
          return { assert: false, content: { error: rs_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 8：吊销状态校验——信任集中出现被吊销密钥时拒绝 -->
  <sb-test name="Revoked key in trust set is rejected">
    <template>
      <script type="module">
        import { verifyRootStatus } from "/nos-lib/_install/util.js";
        import { getHash } from "/nos/util/hash/get-hash.js";

        const rs2_cert = await fetch("/nos/root-cert.json").then((e) => e.json());
        const rs2_rootHash = await getHash(rs2_cert.keys[0].publicKey);

        try {
          await verifyRootStatus(rs2_cert, {
            minGeneration: 1,
            revokedKeyHashes: [rs2_rootHash],
          });
          return { assert: false, content: { message: "被吊销密钥不应通过校验" } };
        } catch (rs2_error) {
          return { assert: true, content: { error: rs2_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 9：吊销状态校验——generation 低于 minGeneration 时拒绝 -->
  <sb-test name="Generation below minGeneration is rejected">
    <template>
      <script type="module">
        import { verifyRootStatus } from "/nos-lib/_install/util.js";

        const rs3_cert = await fetch("/nos/root-cert.json").then((e) => e.json());

        try {
          await verifyRootStatus(rs3_cert, {
            minGeneration: rs3_cert.generation + 5,
            revokedKeyHashes: [],
          });
          return { assert: false, content: { message: "低于 minGeneration 的证书不应通过校验" } };
        } catch (rs3_error) {
          return { assert: true, content: { error: rs3_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 10：getOnlineData 全流程——拉取真实 root-cert.json 与 nos.json 并完成校验 -->
  <sb-test name="getOnlineData end-to-end">
    <template>
      <script type="module">
        import { getOnlineData } from "/nos-lib/_install/util.js";

        try {
          const rc7_data = await getOnlineData();
          const rc7_hasVersion = typeof rc7_data.onlineNosConfig.version === "string";
          const rc7_hasHashes = Array.isArray(rc7_data.onlineNosConfig.hashes);
          return {
            assert: rc7_hasVersion && rc7_hasHashes,
            content: {
              version: rc7_data.onlineNosConfig.version,
              checks: { rc7_hasVersion, rc7_hasHashes },
            },
          };
        } catch (rc7_error) {
          return { assert: false, content: { error: rc7_error.message } };
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 11：allowCache 降级——在线拉取全部失败时，用本地缓存的最近一份
       在线数据完成校验链（check() 版本检测的离线兜底）。mock 只拦截三个
       在线配置 URL，其余请求放行；操作 globalThis.fetch，禁用 parallel。 -->
  <sb-test name="getOnlineData falls back to cache when offline (allowCache)">
    <template>
      <script type="module">
        import { getOnlineData } from "/nos-lib/_install/util.js";

        const { getStorage } = await import("/nos/storage/main.js");
        const rc11_trust = getStorage("nos-root-trust");

        // 预写缓存：用仓库真实数据模拟"上一次在线校验通过后写入"的状态
        const rc11_realCert = await fetch("/nos/root-cert.json").then((e) => e.json());
        const rc11_realNos = await fetch("/nos.json").then((e) => e.json());
        await rc11_trust.setItem("cached-root-cert", rc11_realCert);
        await rc11_trust.setItem("cached-nos-json", rc11_realNos);

        const rc11_originalFetch = globalThis.fetch;
        const rc11_blockedPaths = ["/root-status.json", "/nos/root-cert.json", "/nos.json"];
        globalThis.fetch = (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const path = new URL(url, location.href).pathname;
          if (rc11_blockedPaths.includes(path)) {
            return Promise.reject(new TypeError("Failed to fetch (mocked offline)"));
          }
          return rc11_originalFetch(input, init);
        };

        try {
          const rc11_data = await getOnlineData({ allowCache: true });
          const rc11_versionMatch = rc11_data.onlineNosConfig.version === rc11_realNos.version;
          const rc11_certMatch = rc11_data.rootCert.generation === rc11_realCert.generation;
          return {
            assert: rc11_versionMatch && rc11_certMatch,
            content: {
              version: rc11_data.onlineNosConfig.version,
              checks: { rc11_versionMatch, rc11_certMatch },
            },
          };
        } catch (rc11_error) {
          return { assert: false, content: { error: rc11_error.message } };
        } finally {
          globalThis.fetch = rc11_originalFetch;
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 12：无缓存 + 离线（全新安装场景）→ 抛出可读错误并保留原始 cause -->
  <sb-test name="getOnlineData throws readable error when offline without cache">
    <template>
      <script type="module">
        import { getOnlineData } from "/nos-lib/_install/util.js";

        const { getStorage } = await import("/nos/storage/main.js");
        const rc12_trust = getStorage("nos-root-trust");

        // 清掉测试 11 预写的缓存，模拟全新安装
        await rc12_trust.removeItem("cached-root-cert");
        await rc12_trust.removeItem("cached-nos-json");

        const rc12_originalFetch = globalThis.fetch;
        const rc12_blockedPaths = ["/root-status.json", "/nos/root-cert.json", "/nos.json"];
        globalThis.fetch = (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const path = new URL(url, location.href).pathname;
          if (rc12_blockedPaths.includes(path)) {
            return Promise.reject(new TypeError("Failed to fetch (mocked offline)"));
          }
          return rc12_originalFetch(input, init);
        };

        try {
          await getOnlineData({ allowCache: true });
          return { assert: false, content: { message: "无缓存离线时应抛错" } };
        } catch (rc12_error) {
          const rc12_readable = /no cached/i.test(rc12_error.message);
          const rc12_hasCause = rc12_error.cause instanceof Error;
          return {
            assert: rc12_readable && rc12_hasCause,
            content: {
              error: rc12_error.message,
              checks: { rc12_readable, rc12_hasCause },
            },
          };
        } finally {
          globalThis.fetch = rc12_originalFetch;
        }
      </script>
    </template>
  </sb-test>

  <!-- 测试 13：默认（无参数）模式离线时原样抛网络错误——install 流程
       依赖严格在线行为，不允许静默降级 -->
  <sb-test name="getOnlineData stays strict online by default">
    <template>
      <script type="module">
        import { getOnlineData } from "/nos-lib/_install/util.js";

        const rc13_originalFetch = globalThis.fetch;
        const rc13_blockedPaths = ["/root-status.json", "/nos/root-cert.json", "/nos.json"];
        globalThis.fetch = (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const path = new URL(url, location.href).pathname;
          if (rc13_blockedPaths.includes(path)) {
            return Promise.reject(new TypeError("Failed to fetch (mocked offline)"));
          }
          return rc13_originalFetch(input, init);
        };

        try {
          await getOnlineData();
          return { assert: false, content: { message: "默认模式离线时应抛错" } };
        } catch (rc13_error) {
          // 原样抛出：不是降级包装的可读错误，保持 fetch 的网络错误形态
          const rc13_rawFetchError =
            !/no cached/i.test(rc13_error.message) &&
            (rc13_error instanceof TypeError || /fetch/i.test(rc13_error.message));
          return {
            assert: rc13_rawFetchError,
            content: {
              error: rc13_error.message,
              checks: { rc13_rawFetchError },
            },
          };
        } finally {
          globalThis.fetch = rc13_originalFetch;
        }
      </script>
    </template>
  </sb-test>
</body>

</html>
