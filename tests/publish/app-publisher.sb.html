  <!-- 测试 1：createRelease 基本功能 -->
  <sb-test name="AppManager createRelease Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_cr_ns = "app-mgr-cr";
        const ap_cr_srv = "ws://localhost:8081";

        const ap_cr_user = new LocalUser(ap_cr_ns);
        await ap_cr_user.ready();
        await ap_cr_user.server.connect(ap_cr_srv);

        const ap_cr_mgr = new AppManager(ap_cr_user);
        ap_cr_mgr.start();

        // 在 test-publish/cr-test 下创建测试文件
        const ap_cr_root = await init("test-publish");
        const ap_cr_dir = await ap_cr_root.get("cr-test", { create: "dir" });
        const ap_cr_html = await ap_cr_dir.get("index.html", { create: "file" });
        await ap_cr_html.write("<h1>Hello</h1>");
        const ap_cr_css = await ap_cr_dir.get("style.css", { create: "file" });
        await ap_cr_css.write("body { color: red; }");
        const ap_cr_sub = await ap_cr_dir.get("src", { create: "dir" });
        const ap_cr_js = await ap_cr_sub.get("app.js", { create: "file" });
        await ap_cr_js.write("console.log('hi');");

        // 调用 createRelease
        const ap_cr_release = await ap_cr_mgr.createRelease(ap_cr_dir, {
          appName: "cr-test-app",
          version: "0.1.0",
        });

        // 验证返回结构
        const ap_cr_hasManifest = typeof ap_cr_release.manifest === "object";
        const ap_cr_manifestSigned = typeof ap_cr_release.manifest.signature === "string";
        const ap_cr_hasAppId = typeof ap_cr_release.manifest.appId === "string";
        const ap_cr_appNameOk = ap_cr_release.manifest.appName === "cr-test-app";
        const ap_cr_versionOk = ap_cr_release.manifest.version === "0.1.0";
        const ap_cr_publisherOk = ap_cr_release.manifest.publisherUserId === ap_cr_user.userId;
        const ap_cr_hasFiles = typeof ap_cr_release.manifest.files === "object";
        const ap_cr_fileCountOk = ap_cr_release.fileCount === 3;
        const ap_cr_hasTotalSize = typeof ap_cr_release.totalSize === "number" && ap_cr_release.totalSize > 0;
        const ap_cr_previousNull = ap_cr_release.manifest.previousManifestHash === null;
        const ap_cr_diffNull = ap_cr_release.diffSummary === null;
        const ap_cr_publicKeyOk = ap_cr_release.manifest.publicKey === ap_cr_user.publicKey;

        // 验证文件路径
        const ap_cr_files = ap_cr_release.manifest.files;
        const ap_cr_hasHtml = "index.html" in ap_cr_files;
        const ap_cr_hasCss = "style.css" in ap_cr_files;
        const ap_cr_hasJs = "src/app.js" in ap_cr_files;

        ap_cr_mgr.stop();

        const ap_cr_allChecks =
          ap_cr_hasManifest && ap_cr_manifestSigned && ap_cr_hasAppId &&
          ap_cr_appNameOk && ap_cr_versionOk && ap_cr_publisherOk &&
          ap_cr_hasFiles && ap_cr_fileCountOk && ap_cr_hasTotalSize &&
          ap_cr_previousNull && ap_cr_diffNull && ap_cr_publicKeyOk &&
          ap_cr_hasHtml && ap_cr_hasCss && ap_cr_hasJs;

        await clearPublishData(ap_cr_ns);

        return {
          assert: ap_cr_allChecks,
          content: {
            message: ap_cr_allChecks ? "createRelease 测试成功" : "createRelease 测试失败",
            manifest: {
              appId: ap_cr_release.manifest.appId,
              appName: ap_cr_release.manifest.appName,
              version: ap_cr_release.manifest.version,
              fileCount: ap_cr_release.fileCount,
              totalSize: ap_cr_release.totalSize,
            },
            checks: {
              hasManifest: ap_cr_hasManifest,
              manifestSigned: ap_cr_manifestSigned,
              hasAppId: ap_cr_hasAppId,
              appNameOk: ap_cr_appNameOk,
              versionOk: ap_cr_versionOk,
              publisherOk: ap_cr_publisherOk,
              hasFiles: ap_cr_hasFiles,
              fileCountOk: ap_cr_fileCountOk,
              hasTotalSize: ap_cr_hasTotalSize,
              previousNull: ap_cr_previousNull,
              diffNull: ap_cr_diffNull,
              publicKeyOk: ap_cr_publicKeyOk,
              hasHtml: ap_cr_hasHtml,
              hasCss: ap_cr_hasCss,
              hasJs: ap_cr_hasJs,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 2：publish 基本功能 -->
  <sb-test name="AppManager publish Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { getPublishedApp } from "/nos/publish/db.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_pub_ns = "app-mgr-pub";
        const ap_pub_srv = "ws://localhost:8081";

        const ap_pub_user = new LocalUser(ap_pub_ns);
        await ap_pub_user.ready();
        await ap_pub_user.server.connect(ap_pub_srv);

        const ap_pub_mgr = new AppManager(ap_pub_user);
        ap_pub_mgr.start();

        // 创建测试目录和文件
        const ap_pub_root = await init("test-publish");
        const ap_pub_dir = await ap_pub_root.get("pub-test", { create: "dir" });
        const ap_pub_html = await ap_pub_dir.get("index.html", { create: "file" });
        await ap_pub_html.write("<h1>Publish Test</h1>");
        const ap_pub_js = await ap_pub_dir.get("app.js", { create: "file" });
        await ap_pub_js.write("console.log('publish');");

        // createRelease + publish
        const ap_pub_release = await ap_pub_mgr.createRelease(ap_pub_dir, {
          appName: "pub-test-app",
          version: "1.0.0",
        });

        const ap_pub_result = await ap_pub_mgr.publish(ap_pub_release);

        // 验证 publish 返回
        const ap_pub_hasAppId = typeof ap_pub_result.appId === "string";
        const ap_pub_appNameOk = ap_pub_result.appName === "pub-test-app";
        const ap_pub_versionOk = ap_pub_result.version === "1.0.0";
        const ap_pub_hasPublishedAt = typeof ap_pub_result.publishedAt === "number";

        // 验证 DB 中有记录
        const ap_pub_db = await getPublishedApp(ap_pub_ns, "pub-test-app");
        const ap_pub_dbExists = ap_pub_db !== null;
        const ap_pub_dbStatusOk = ap_pub_db.status === "published";
        const ap_pub_dbVersionOk = ap_pub_db.version === "1.0.0";
        const ap_pub_dbAppIdOk = ap_pub_db.appId === ap_pub_result.appId;

        ap_pub_mgr.stop();

        const ap_pub_allChecks =
          ap_pub_hasAppId && ap_pub_appNameOk && ap_pub_versionOk && ap_pub_hasPublishedAt &&
          ap_pub_dbExists && ap_pub_dbStatusOk && ap_pub_dbVersionOk && ap_pub_dbAppIdOk;

        await clearPublishData(ap_pub_ns);

        return {
          assert: ap_pub_allChecks,
          content: {
            message: ap_pub_allChecks ? "publish 测试成功" : "publish 测试失败",
            result: {
              appId: ap_pub_result.appId,
              appName: ap_pub_result.appName,
              version: ap_pub_result.version,
              publishedAt: ap_pub_result.publishedAt,
            },
            checks: {
              hasAppId: ap_pub_hasAppId,
              appNameOk: ap_pub_appNameOk,
              versionOk: ap_pub_versionOk,
              hasPublishedAt: ap_pub_hasPublishedAt,
              dbExists: ap_pub_dbExists,
              dbStatusOk: ap_pub_dbStatusOk,
              dbVersionOk: ap_pub_dbVersionOk,
              dbAppIdOk: ap_pub_dbAppIdOk,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 3：publish 后签名篡改验证失败 -->
  <sb-test name="AppManager publish Tampered Manifest Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_tamper_ns = "app-mgr-tamper";
        const ap_tamper_srv = "ws://localhost:8081";

        const ap_tamper_user = new LocalUser(ap_tamper_ns);
        await ap_tamper_user.ready();
        await ap_tamper_user.server.connect(ap_tamper_srv);

        const ap_tamper_mgr = new AppManager(ap_tamper_user);
        ap_tamper_mgr.start();

        const ap_tamper_root = await init("test-publish");
        const ap_tamper_dir = await ap_tamper_root.get("tamper-test", { create: "dir" });
        const ap_tamper_file = await ap_tamper_dir.get("test.txt", { create: "file" });
        await ap_tamper_file.write("original content");

        const ap_tamper_release = await ap_tamper_mgr.createRelease(ap_tamper_dir, {
          appName: "tamper-test-app",
          version: "0.1.0",
        });

        // 篡改 manifest
        ap_tamper_release.manifest.version = "9.9.9";

        let ap_tamper_error = null;
        try {
          await ap_tamper_mgr.publish(ap_tamper_release);
        } catch (err) {
          ap_tamper_error = err.message;
        }

        ap_tamper_mgr.stop();

        const ap_tamper_allChecks = ap_tamper_error !== null;

        await clearPublishData(ap_tamper_ns);

        return {
          assert: ap_tamper_allChecks,
          content: {
            message: ap_tamper_allChecks ? "publish 防篡改测试成功" : "publish 防篡改测试失败",
            checks: {
              errorCaught: ap_tamper_allChecks,
              errorMessage: ap_tamper_error,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 6：createRelease 升级场景（diffSummary） -->
  <sb-test name="AppManager createRelease Upgrade Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_upg_ns = "app-mgr-upg";
        const ap_upg_srv = "ws://localhost:8081";

        const ap_upg_user = new LocalUser(ap_upg_ns);
        await ap_upg_user.ready();
        await ap_upg_user.server.connect(ap_upg_srv);

        const ap_upg_mgr = new AppManager(ap_upg_user);
        ap_upg_mgr.start();

        // 清理残留目录后重新创建
        const ap_upg_root = await init("test-publish");
        const ap_upg_oldDir = await ap_upg_root.get("upg-test");
        if (ap_upg_oldDir) {
          await ap_upg_oldDir.remove();
        }
        const ap_upg_dir = await ap_upg_root.get("upg-test", { create: "dir" });
        const ap_upg_v1Html = await ap_upg_dir.get("index.html", { create: "file" });
        await ap_upg_v1Html.write("<h1>V1</h1>");
        const ap_upg_v1Js = await ap_upg_dir.get("app.js", { create: "file" });
        await ap_upg_v1Js.write("console.log('v1');");
        const ap_upg_v1Old = await ap_upg_dir.get("old.txt", { create: "file" });
        await ap_upg_v1Old.write("removed in v2");

        // 发布 v1
        const ap_upg_v1 = await ap_upg_mgr.createRelease(ap_upg_dir, {
          appName: "upg-test-app",
          version: "1.0.0",
        });
        await ap_upg_mgr.publish(ap_upg_v1);

        // 修改 v2 目录：新增文件、修改文件、删除文件
        const ap_upg_v2Html = await ap_upg_dir.get("index.html", { create: "file" });
        await ap_upg_v2Html.write("<h1>V2</h1>"); // 修改
        const ap_upg_v2New = await ap_upg_dir.get("new.txt", { create: "file" });
        await ap_upg_v2New.write("added in v2"); // 新增
        await ap_upg_dir.get("old.txt").then((h) => h.remove()); // 删除

        // 创建 v2 release
        const ap_upg_v2 = await ap_upg_mgr.createRelease(ap_upg_dir, {
          appName: "upg-test-app",
          version: "2.0.0",
        });

        // 验证 diffSummary
        const ap_upg_hasDiff = ap_upg_v2.diffSummary !== null;
        const ap_upg_addedCount = Object.keys(ap_upg_v2.diffSummary.added).length;
        const ap_upg_modifiedCount = Object.keys(ap_upg_v2.diffSummary.modified).length;
        const ap_upg_removedCount = Object.keys(ap_upg_v2.diffSummary.removed).length;
        const ap_upg_hasSizeDelta = typeof ap_upg_v2.diffSummary.sizeDelta === "number";
        const ap_upg_previousHash = typeof ap_upg_v2.manifest.previousManifestHash === "string";

        // v1 有 old.txt（将被删除），v2 有 new.txt（新增），index.html 内容变了（修改），app.js 没变
        const ap_upg_addedNew = "new.txt" in ap_upg_v2.diffSummary.added;
        const ap_upg_removedOld = "old.txt" in ap_upg_v2.diffSummary.removed;
        const ap_upg_modifiedHtml = "index.html" in ap_upg_v2.diffSummary.modified;

        ap_upg_mgr.stop();

        const ap_upg_allChecks =
          ap_upg_hasDiff && ap_upg_addedCount === 1 && ap_upg_modifiedCount === 1 &&
          ap_upg_removedCount === 1 && ap_upg_hasSizeDelta &&
          ap_upg_previousHash && ap_upg_addedNew && ap_upg_removedOld && ap_upg_modifiedHtml;

        await clearPublishData(ap_upg_ns);

        return {
          assert: ap_upg_allChecks,
          content: {
            message: ap_upg_allChecks ? "createRelease 升级 diff 测试成功" : "createRelease 升级 diff 测试失败",
            diffSummary: {
              added: ap_upg_v2.diffSummary.added,
              modified: ap_upg_v2.diffSummary.modified,
              removed: ap_upg_v2.diffSummary.removed,
              sizeDelta: ap_upg_v2.diffSummary.sizeDelta,
            },
            checks: {
              hasDiff: ap_upg_hasDiff,
              addedCount: ap_upg_addedCount,
              modifiedCount: ap_upg_modifiedCount,
              removedCount: ap_upg_removedCount,
              hasSizeDelta: ap_upg_hasSizeDelta,
              previousHash: ap_upg_previousHash,
              addedNew: ap_upg_addedNew,
              removedOld: ap_upg_removedOld,
              modifiedHtml: ap_upg_modifiedHtml,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 7：installApp 基本功能 -->
  <sb-test name="AppManager installApp Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_inst_ns = "app-mgr-inst";
        const ap_inst_srv = "ws://localhost:8081";

        const ap_inst_user = new LocalUser(ap_inst_ns);
        await ap_inst_user.ready();
        await ap_inst_user.server.connect(ap_inst_srv);

        const ap_inst_mgr = new AppManager(ap_inst_user);
        ap_inst_mgr.start();

        // 清理残留
        const ap_inst_oldRoot = await init("apps");
        const ap_inst_appName = "install-test-app";

        // 创建测试文件
        const ap_inst_root = await init("test-publish");
        const ap_inst_oldDir = await ap_inst_root.get("install-test");
        if (ap_inst_oldDir) await ap_inst_oldDir.remove();
        const ap_inst_dir = await ap_inst_root.get("install-test", { create: "dir" });
        const ap_inst_f1 = await ap_inst_dir.get("hello.html", { create: "file" });
        await ap_inst_f1.write("<h1>Installed</h1>");
        const ap_inst_f2 = await ap_inst_dir.get("script.js", { create: "file" });
        await ap_inst_f2.write("console.log('installed');");

        // 发布
        const ap_inst_release = await ap_inst_mgr.createRelease(ap_inst_dir, {
          appName: ap_inst_appName,
          version: "1.0.0",
        });
        const ap_inst_pub = await ap_inst_mgr.publish(ap_inst_release);

        // 安装
        await ap_inst_mgr.installApp(ap_inst_release.manifest);

        // 验证安装目录存在
        const ap_inst_dirName = `${ap_inst_appName}-${ap_inst_pub.appId}`;
        const ap_inst_appDir = await ap_inst_oldRoot.get(ap_inst_dirName);
        const ap_inst_dirExists = ap_inst_appDir !== null;

        // 验证文件存在且内容正确
        let ap_inst_contentOk = false;
        let ap_inst_manifestOk = false;
        let ap_inst_fileCount = 0;
        if (ap_inst_appDir) {
          const ap_inst_files = await ap_inst_appDir.flat();
          ap_inst_fileCount = ap_inst_files.length;

          // 读取 hello.html
          const ap_inst_hello = await ap_inst_appDir.get("hello.html");
          const ap_inst_helloText = ap_inst_hello ? await ap_inst_hello.read({ type: "text" }) : "";
          const ap_inst_helloMatch = ap_inst_helloText === "<h1>Installed</h1>";

          // 读取 script.js
          const ap_inst_scr = await ap_inst_appDir.get("script.js");
          const ap_inst_scrText = ap_inst_scr ? await ap_inst_scr.read({ type: "text" }) : "";
          const ap_inst_scrMatch = ap_inst_scrText === "console.log('installed');";

          ap_inst_contentOk = ap_inst_helloMatch && ap_inst_scrMatch;

          // 读取 manifest
          const ap_inst_manifestFile = await ap_inst_appDir.get("asset-manifest.json");
          const ap_inst_manifestText = ap_inst_manifestFile ? await ap_inst_manifestFile.read({ type: "text" }) : "";
          try {
            const ap_inst_parsed = JSON.parse(ap_inst_manifestText);
            ap_inst_manifestOk = ap_inst_parsed.appId === ap_inst_pub.appId && ap_inst_parsed.version === "1.0.0";
          } catch {
            ap_inst_manifestOk = false;
          }
        }

        // 清理
        if (ap_inst_appDir) await ap_inst_appDir.remove();
        ap_inst_mgr.stop();

        const ap_inst_allChecks = ap_inst_dirExists && ap_inst_contentOk && ap_inst_manifestOk && ap_inst_fileCount >= 2;

        await clearPublishData(ap_inst_ns);

        return {
          assert: ap_inst_allChecks,
          content: {
            message: ap_inst_allChecks ? "installApp 测试成功" : "installApp 测试失败",
            checks: {
              dirExists: ap_inst_dirExists,
              contentOk: ap_inst_contentOk,
              manifestOk: ap_inst_manifestOk,
              fileCount: ap_inst_fileCount,
              dirName: ap_inst_dirName,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 8：checkForUpdates 检测升级 -->
  <sb-test name="AppManager checkForUpdates Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_cfu_ns = "app-mgr-cfu";
        const ap_cfu_srv = "ws://localhost:8081";

        const ap_cfu_user = new LocalUser(ap_cfu_ns);
        await ap_cfu_user.ready();
        await ap_cfu_user.server.connect(ap_cfu_srv);

        const ap_cfu_mgr = new AppManager(ap_cfu_user);
        ap_cfu_mgr.start();

        const ap_cfu_appName = "cfu-test-app";

        // 清理 OPFS 残留
        const ap_cfu_appsRoot = await init("apps");
        const ap_cfu_root = await init("test-publish");
        const ap_cfu_oldTest = await ap_cfu_root.get("cfu-test");
        if (ap_cfu_oldTest) await ap_cfu_oldTest.remove();

        // 创建 v1 文件
        const ap_cfu_dir = await ap_cfu_root.get("cfu-test", { create: "dir" });
        const ap_cfu_v1Html = await ap_cfu_dir.get("index.html", { create: "file" });
        await ap_cfu_v1Html.write("<h1>V1</h1>");
        const ap_cfu_v1Js = await ap_cfu_dir.get("app.js", { create: "file" });
        await ap_cfu_v1Js.write("console.log('v1');");

        // 发布 v1 并安装
        const ap_cfu_v1 = await ap_cfu_mgr.createRelease(ap_cfu_dir, { appName: ap_cfu_appName, version: "1.0.0" });
        const ap_cfu_v1Pub = await ap_cfu_mgr.publish(ap_cfu_v1);
        await ap_cfu_mgr.installApp(ap_cfu_v1.manifest);

        // checkForUpdates → v1 是最新，应无更新
        const ap_cfu_noUpdate = await ap_cfu_mgr.checkForUpdates(ap_cfu_v1Pub.appId);
        const ap_cfu_noUpdateOk = ap_cfu_noUpdate !== null && ap_cfu_noUpdate.hasUpdate === false;

        // 修改文件并发布 v2
        const ap_cfu_v2Html = await ap_cfu_dir.get("index.html", { create: "file" });
        await ap_cfu_v2Html.write("<h1>V2</h1>");
        const ap_cfu_v2New = await ap_cfu_dir.get("new.js", { create: "file" });
        await ap_cfu_v2New.write("console.log('new');");

        const ap_cfu_v2 = await ap_cfu_mgr.createRelease(ap_cfu_dir, { appName: ap_cfu_appName, version: "2.0.0" });
        const ap_cfu_v2Pub = await ap_cfu_mgr.publish(ap_cfu_v2);

        // checkForUpdates → 应检测到更新
        const ap_cfu_hasUpdate = await ap_cfu_mgr.checkForUpdates(ap_cfu_v1Pub.appId);
        const ap_cfu_hasUpdateOk = ap_cfu_hasUpdate !== null && ap_cfu_hasUpdate.hasUpdate === true;
        const ap_cfu_versionOk = ap_cfu_hasUpdate.currentVersion === "1.0.0" && ap_cfu_hasUpdate.latestVersion === "2.0.0";
        const ap_cfu_appNameOk = ap_cfu_hasUpdate.appName === ap_cfu_appName;
        const ap_cfu_diffHasModified = "index.html" in (ap_cfu_hasUpdate.diffSummary?.modified || {});
        const ap_cfu_diffHasAdded = "new.js" in (ap_cfu_hasUpdate.diffSummary?.added || {});

        // 清理
        const ap_cfu_installedDir = await ap_cfu_appsRoot.get(`${ap_cfu_appName}-${ap_cfu_v1Pub.appId}`);
        if (ap_cfu_installedDir) await ap_cfu_installedDir.remove();
        ap_cfu_mgr.stop();

        const ap_cfu_allChecks =
          ap_cfu_noUpdateOk && ap_cfu_hasUpdateOk && ap_cfu_versionOk &&
          ap_cfu_appNameOk && ap_cfu_diffHasModified && ap_cfu_diffHasAdded;

        await clearPublishData(ap_cfu_ns);

        return {
          assert: ap_cfu_allChecks,
          content: {
            message: ap_cfu_allChecks ? "checkForUpdates 测试成功" : "checkForUpdates 测试失败",
            checks: {
              noUpdateOk: ap_cfu_noUpdateOk,
              hasUpdateOk: ap_cfu_hasUpdateOk,
              versionOk: ap_cfu_versionOk,
              appNameOk: ap_cfu_appNameOk,
              diffHasModified: ap_cfu_diffHasModified,
              diffHasAdded: ap_cfu_diffHasAdded,
              currentVersion: ap_cfu_hasUpdate?.currentVersion,
              latestVersion: ap_cfu_hasUpdate?.latestVersion,
              diffSummary: ap_cfu_hasUpdate?.diffSummary,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- 测试 9：checkAllUpdates 批量检查 -->
  <sb-test name="AppManager checkAllUpdates Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";
        import { AppManager } from "/nos/publish/app-manager.js";
        import { init } from "/nos/fs/handle/main.js";
        import { clearPublishData } from "/nos/publish/db.js";

        const ap_cau_ns = "app-mgr-cau";
        const ap_cau_srv = "ws://localhost:8081";

        const ap_cau_user = new LocalUser(ap_cau_ns);
        await ap_cau_user.ready();
        await ap_cau_user.server.connect(ap_cau_srv);

        const ap_cau_mgr = new AppManager(ap_cau_user);
        ap_cau_mgr.start();

        const ap_cau_appsRoot = await init("apps");
        const ap_cau_root = await init("test-publish");

        // 清理残留目录
        for (const dir of ["cau-app1", "cau-app2"]) {
          const old = await ap_cau_root.get(dir);
          if (old) await old.remove();
        }

        // 创建并发布 + 安装两个不同应用
        const ap_cau_results = [];

        for (const [appName, content] of [["cau-app1", "app1"], ["cau-app2", "app2"]]) {
          const dir = await ap_cau_root.get(appName, { create: "dir" });
          const file = await dir.get("index.html", { create: "file" });
          await file.write(`<h1>${content}</h1>`);

          const release = await ap_cau_mgr.createRelease(dir, { appName, version: "1.0.0" });
          const pub = await ap_cau_mgr.publish(release);
          await ap_cau_mgr.installApp(release.manifest);
          ap_cau_results.push(pub);
        }

        // checkAllUpdates — 两个都已是最新，应返回 2 条 hasUpdate:false
        const ap_cau_updates = await ap_cau_mgr.checkAllUpdates();
        const ap_cau_countOk = ap_cau_updates.length === 2;
        const ap_cau_allFalse = ap_cau_updates.every((u) => u.hasUpdate === false);

        // 升级其中一个
        const ap_cau_dir1 = await ap_cau_root.get("cau-app1");
        const ap_cau_v2File = await ap_cau_dir1.get("index.html", { create: "file" });
        await ap_cau_v2File.write("<h1>app1 V2</h1>");
        const ap_cau_v2 = await ap_cau_mgr.createRelease(ap_cau_dir1, { appName: "cau-app1", version: "2.0.0" });
        await ap_cau_mgr.publish(ap_cau_v2);

        // 再次批量检查 — 应有一条检测到更新
        const ap_cau_updates2 = await ap_cau_mgr.checkAllUpdates();
        const ap_cau_count2Ok = ap_cau_updates2.length >= 1;
        const ap_cau_hasOneUpdate = ap_cau_updates2.some((u) => u.hasUpdate === true && u.appName === "cau-app1");

        // 清理
        for (const r of ap_cau_results) {
          const d = await ap_cau_appsRoot.get(`${r.appName}-${r.appId}`);
          if (d) await d.remove();
        }
        ap_cau_mgr.stop();

        const ap_cau_allChecks = ap_cau_countOk && ap_cau_allFalse && ap_cau_count2Ok && ap_cau_hasOneUpdate;

        await clearPublishData(ap_cau_ns);

        return {
          assert: ap_cau_allChecks,
          content: {
            message: ap_cau_allChecks ? "checkAllUpdates 测试成功" : "checkAllUpdates 测试失败",
            checks: {
              countOk: ap_cau_countOk,
              initialCount: ap_cau_updates.length,
              allFalse: ap_cau_allFalse,
              count2Ok: ap_cau_count2Ok,
              hasOneUpdate: ap_cau_hasOneUpdate,
              updatesAfterUpgrade: ap_cau_updates2.length,
            },
          },
        };
      </script>
    </template>
  </sb-test>
