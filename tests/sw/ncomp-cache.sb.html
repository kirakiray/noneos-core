<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ncomp 缓存策略测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
    <script type="module">
      import registration from "/_install/register.js";
      await registration;
    </script>
  </head>
  <body>
    <h1>ncomp 缓存策略测试</h1>

    <sb-test name="请求 /ncomp/ 资源后会写入 OPFS 缓存与元数据">
      <template>
        <script type="module">
          {
            const path = "/ncomp/user-name/user-name.html";
            const metaPath = "/nos-config/ncomp-meta/user-name/user-name.html.json";

            // 先清理旧缓存，确保本次是首次请求
            const rootHandle = await navigator.storage.getDirectory();
            const clean = async (targetPath) => {
              const parts = targetPath.split("/").filter(Boolean);
              const name = parts.pop();
              let dir = rootHandle;
              for (const part of parts) {
                dir = await dir.getDirectoryHandle(part).catch(() => null);
                if (!dir) return;
              }
              await dir.removeEntry(name).catch(() => {});
            };
            await clean(path);
            await clean(metaPath);

            // 通过 Service Worker 请求组件资源
            const response = await fetch(path);
            const status = response.status;
            const contentType = response.headers.get("Content-Type");
            const text = await response.text();

            // 等待后台异步写入 OPFS 缓存
            await new Promise((r) => setTimeout(r, 500));

            // 读取 OPFS 缓存
            const getFileHandle = async (targetPath, create) => {
              const parts = targetPath.split("/").filter(Boolean);
              const name = parts.pop();
              let dir = rootHandle;
              for (const part of parts) {
                dir = await dir.getDirectoryHandle(part, { create });
              }
              return dir.getFileHandle(name, { create });
            };

            const cachedFile = await getFileHandle(path)
              .then((h) => h.getFile())
              .catch(() => null);

            const metaFile = await getFileHandle(metaPath)
              .then((h) => h.getFile())
              .then((f) => f.text())
              .then((t) => JSON.parse(t))
              .catch(() => null);

            const hasCache = cachedFile && cachedFile.size > 0;
            const hasMeta = !!metaFile;
            const hasCachedAt = hasMeta && typeof metaFile.cachedAt === "number";
            const hasHash = hasMeta && typeof metaFile.hash === "string" && metaFile.hash.length > 0;

            return {
              assert:
                status === 200 &&
                text.length > 0 &&
                hasCache &&
                hasMeta &&
                hasCachedAt &&
                hasHash,
              content: {
                status,
                contentType,
                textLength: text.length,
                hasCache,
                hasMeta,
                hasCachedAt,
                hasHash,
                cachedAt: metaFile?.cachedAt,
                hashPreview: metaFile?.hash?.slice(0, 16),
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="缓存未过期时重复请求仍能从 OPFS 命中">
      <template>
        <script type="module">
          {
            const path = "/ncomp/user-name/user-name.html";
            const metaPath = "/nos-config/ncomp-meta/user-name/user-name.html.json";

            const rootHandle = await navigator.storage.getDirectory();
            const getFileHandle = async (targetPath) => {
              const parts = targetPath.split("/").filter(Boolean);
              const name = parts.pop();
              let dir = rootHandle;
              for (const part of parts) {
                dir = await dir.getDirectoryHandle(part);
              }
              return dir.getFileHandle(name);
            };

            // 确保缓存和元数据存在且未过期
            const metaHandle = await getFileHandle(metaPath);
            const metaFile = await metaHandle.getFile();
            const meta = JSON.parse(await metaFile.text());
            meta.cachedAt = Date.now();
            const writable = await metaHandle.createWritable();
            await writable.write(JSON.stringify(meta));
            await writable.close();

            // 读取缓存内容用于后续对比
            const cacheHandle = await getFileHandle(path);
            const cacheFile = await cacheHandle.getFile();
            const cacheText = await cacheFile.text();

            // 再次请求
            const response = await fetch(path);
            const responseText = await response.text();

            return {
              assert: response.status === 200 && responseText === cacheText,
              content: {
                status: response.status,
                cacheLength: cacheText.length,
                responseLength: responseText.length,
                same: responseText === cacheText,
              },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
