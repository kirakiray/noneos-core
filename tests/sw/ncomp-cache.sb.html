<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ncomp 缓存策略测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
    <script type="module">
      import registration from "/_install/register.js";
      await registration;
    </script>
  </head>
  <body>
    <h1>ncomp 缓存策略测试</h1>

    <sb-test name="请求 /ncomp/ 资源后会写入 OPFS 缓存与元数据">
      <template>
        <script type="module">
          {
            const { get } = await import("/nos/fs/main.js");

            const path = "ncomp/user-name/user-name.html";
            const metaPath =
              "nos-config/ncomp-meta/user-name/user-name.html.json";

            // 先清理旧缓存，确保本次是首次请求
            // const clean = async (targetPath) => {
            //   const handle = await get(targetPath).catch(() => null);
            //   if (handle) {
            //     await handle.remove();
            //   }
            // };
            // await clean(path);
            // await clean(metaPath);

            // debugger

            // 通过 Service Worker 请求组件资源
            const response = await fetch("/" + path);
            const status = response.status;
            const contentType = response.headers.get("Content-Type");
            const text = await response.text();

            // 等待后台异步写入 OPFS 缓存
            await new Promise((r) => setTimeout(r, 500));

            // 读取 OPFS 缓存
            const cachedHandle = await get(path).catch(() => null);
            const cachedText = cachedHandle
              ? await cachedHandle.text().catch(() => "")
              : "";

            const metaHandle = await get(metaPath).catch(() => null);
            const meta = metaHandle
              ? await metaHandle.json().catch(() => null)
              : null;

            const hasCache = cachedText.length > 0;
            const hasMeta = !!meta;
            const hasCachedAt = hasMeta && typeof meta.cachedAt === "number";
            const hasHash =
              hasMeta && typeof meta.hash === "string" && meta.hash.length > 0;

            return {
              assert:
                status === 200 &&
                text.length > 0 &&
                hasCache &&
                hasMeta &&
                hasCachedAt &&
                hasHash,
              content: {
                status,
                contentType,
                textLength: text.length,
                hasCache,
                hasMeta,
                hasCachedAt,
                hasHash,
                cachedAt: meta?.cachedAt,
                hashPreview: meta?.hash?.slice(0, 16),
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="缓存未过期时重复请求仍能从 OPFS 命中">
      <template>
        <script type="module">
          {
            const { get } = await import("/nos/fs/main.js");

            const path = "ncomp/user-name/user-name.html";
            const metaPath =
              "nos-config/ncomp-meta/user-name/user-name.html.json";

            // 确保缓存和元数据存在且未过期
            const metaHandle = await get(metaPath);
            const meta = await metaHandle.json();
            meta.cachedAt = Date.now();
            await metaHandle.write(JSON.stringify(meta));

            // 读取缓存内容用于后续对比
            const cacheHandle = await get(path);
            const cacheText = await cacheHandle.text();

            // 再次请求
            const response = await fetch("/" + path);
            const responseText = await response.text();

            return {
              assert: response.status === 200 && responseText === cacheText,
              content: {
                status: response.status,
                cacheLength: cacheText.length,
                responseLength: responseText.length,
                same: responseText === cacheText,
              },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
