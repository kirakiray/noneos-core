<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>host-cache 离线缓存测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <h1>host-cache 离线缓存测试</h1>

    <!-- 注意：本测试会独占 Service Worker（SW 按 scope 全局共享）。 -->
    <!-- 与其他 SW 测试混跑时，controller 可能被别的 SW 抢占，导致 -->
    <!-- /__host-cache 等虚拟路由穿透到静态服务器返回 HTML。因此下面 -->
    <!-- 的轮询以「/__host-cache 能返回合法 JSON」为准，而非仅看 ready。 -->

    <sb-test name="注册测试 SW 并等待 initHostCache 完成">
      <template>
        <script type="module">
          // 先清理已有 SW
          const regs_1 = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs_1.map((r) => r.unregister()));

          // 注册测试 SW（启用 HOST_CACHE_CONFIG）
          const reg_1 = await navigator.serviceWorker.register(
            "/host-cache-test-sw.js"
          );

          // 等待测试 SW 真正取得本页控制权。
          // 注意：不能用 navigator.serviceWorker.ready —— 混跑时上一个测试注册的
          // 正式 sw.js 仍在 active 且仍控制着其它 client（如顶层 test-all.html），
          // 此时 ready 会立刻用「旧的 active 注册」resolve，而测试 SW 停在 waiting，
          // 导致 /__host-cache 等虚拟路由穿透到静态服务器返回 404 HTML。
          // 这里显式等待新 worker 走到 activated 并接管当前页面。
          const waitForControl_1 = async () => {
            const isTestSw_1 = () =>
              navigator.serviceWorker.controller?.scriptURL?.includes(
                "host-cache-test-sw.js"
              );
            if (isTestSw_1()) return true;

            await new Promise((resolve_1) => {
              let done_1 = false;
              const finish_1 = () => {
                if (done_1) return;
                done_1 = true;
                clearTimeout(timer_1);
                navigator.serviceWorker.removeEventListener(
                  "controllerchange",
                  onChange_1
                );
                resolve_1();
              };
              const onChange_1 = () => {
                if (isTestSw_1()) finish_1();
              };
              navigator.serviceWorker.addEventListener(
                "controllerchange",
                onChange_1
              );

              // waiting 中的 worker 自身 install 时会调用 skipWaiting，
              // 这里跟踪其状态机，activated 后即可判定接管完成
              const pending_1 = reg_1.installing || reg_1.waiting;
              pending_1?.addEventListener("statechange", () => {
                if (pending_1.state === "activated") onChange_1();
              });

              const timer_1 = setTimeout(finish_1, 20000);
            });

            return isTestSw_1();
          };

          const controlled_1 = await waitForControl_1();

          // 接管后轮询等待 initHostCache 完成（precaching 结束）
          let status_1;
          for (let i_1 = 0; i_1 < 100; i_1++) {
            try {
              const response_1 = await fetch("/__host-cache", {
                cache: "no-store",
              });
              if (
                response_1.ok &&
                response_1.headers.get("content-type")?.includes("json")
              ) {
                status_1 = await response_1.json();
                if (status_1?.name === "test-host-cache" && !status_1.precaching) {
                  break;
                }
              }
            } catch {}
            await new Promise((r_1) => setTimeout(r_1, 200));
          }

          const checks_1 = {
            swRegistered: controlled_1,
            hasName: status_1?.name === "test-host-cache",
            hasVersion: status_1?.version === "1.0.0",
            hasFileCount: status_1?.fileCount === 1,
            notPrecaching: status_1?.precaching === false,
          };

          return {
            assert: Object.values(checks_1).every(Boolean),
            content: {
              status: status_1,
              checks: checks_1,
              controller: navigator.serviceWorker.controller?.scriptURL || null,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="预缓存的文件可通过 fetch 正常访问">
      <template>
        <script type="module">
          const response_2 = await fetch(
            "/tests/sw/host-cache-test-file.txt",
            { cache: "no-store" }
          );
          const text_2 = await response_2.text();

          return {
            assert:
              response_2.status === 200 && text_2 === "Hello host-cache test!",
            content: { status: response_2.status, text: text_2 },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="OPFS 中存在已缓存的文件">
      <template>
        <script type="module">
          const root_3 = await navigator.storage.getDirectory();
          let hasFile_3 = false;
          let fileContent_3 = "";

          try {
            const dir_3 = await root_3.getDirectoryHandle("host-cache");
            const filesDir_3 = await dir_3.getDirectoryHandle("files");
            const testsDir_3 = await filesDir_3.getDirectoryHandle("tests");
            const swDir_3 = await testsDir_3.getDirectoryHandle("sw");
            const fileHandle_3 = await swDir_3.getFileHandle(
              "host-cache-test-file.txt"
            );
            const file_3 = await fileHandle_3.getFile();
            fileContent_3 = await file_3.text();
            hasFile_3 = fileContent_3.length > 0;
          } catch {}

          return {
            assert: hasFile_3 && fileContent_3 === "Hello host-cache test!",
            content: { hasFile: hasFile_3, fileContent: fileContent_3 },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="版本未变化时 __update-host-cache 返回 version-up-to-date">
      <template>
        <script type="module">
          const response_4 = await fetch("/__update-host-cache", {
            cache: "no-store",
          });
          // 若 SW 未接管，此处会拿到静态服务器的 HTML，直接 json() 会抛出
          // 误导性的 "Unexpected token '<'"，故先校验 content-type
          const isJson_4 = response_4.headers
            .get("content-type")
            ?.includes("json");
          const result_4 = isJson_4 ? await response_4.json() : null;

          return {
            assert:
              result_4?.ok === true && result_4?.reason === "version-up-to-date",
            content: {
              result: result_4,
              isJson: isJson_4,
              hint: isJson_4 ? undefined : "SW 未接管，响应不是 JSON",
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="删除 OPFS 缓存后 __update-host-cache 重新拉取">
      <template>
        <script type="module">
          // 删除 OPFS 中的 host-cache 目录
          const root_5 = await navigator.storage.getDirectory();
          await root_5
            .removeEntry("host-cache", { recursive: true })
            .catch(() => {});

          // 触发更新
          const response_5 = await fetch("/__update-host-cache", {
            cache: "no-store",
          });
          // 同上：先校验 content-type，避免 SW 未接管时抛出误导性的 JSON 解析错误
          const isJson_5 = response_5.headers
            .get("content-type")
            ?.includes("json");
          const result_5 = isJson_5 ? await response_5.json() : null;

          // 验证重新拉取成功
          const checks_5 = {
            ok: result_5?.ok === true,
            downloaded: result_5?.downloaded === 1,
            failed: result_5?.failed === 0,
          };

          // 验证文件已重新缓存
          let hasFile_5 = false;
          try {
            const dir_5 = await root_5.getDirectoryHandle("host-cache");
            const filesDir_5 = await dir_5.getDirectoryHandle("files");
            const testsDir_5 = await filesDir_5.getDirectoryHandle("tests");
            const swDir_5 = await testsDir_5.getDirectoryHandle("sw");
            const fileHandle_5 = await swDir_5.getFileHandle(
              "host-cache-test-file.txt"
            );
            const file_5 = await fileHandle_5.getFile();
            hasFile_5 = (await file_5.text()) === "Hello host-cache test!";
          } catch {}

          checks_5.hasFile = hasFile_5;

          return {
            assert: Object.values(checks_5).every(Boolean),
            content: { result: result_5, checks: checks_5 },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="清理测试环境后重新注册正式 SW">
      <template>
        <script type="module">
          // 清理 OPFS host-cache
          const root_6 = await navigator.storage.getDirectory();
          await root_6
            .removeEntry("host-cache", { recursive: true })
            .catch(() => {});

          // 注销测试 SW，注册正式 SW
          const regs_6 = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs_6.map((r) => r.unregister()));
          await navigator.serviceWorker.register("/sw.js");
          await navigator.serviceWorker.ready;

          return {
            assert: true,
            content: { message: "测试环境已清理，正式 SW 已恢复" },
          };
        </script>
      </template>
    </sb-test>
  </body>
</html>
