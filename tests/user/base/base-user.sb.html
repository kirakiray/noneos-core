<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaseUser Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
  </head>
  <body>
    <h1>BaseUser Tests</h1>

    <sb-test name="Create and Initialize User Test">
      <template>
        <script>
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建用户
          const user = new BaseUser("test-user-1");

          // 初始化用户
          await user.init();

          const hasUserId = !!user.userId;
          const hasPublicKey = !!user.publicKey;

          return {
            assert: hasUserId && hasPublicKey,
            content: {
              message: "用户创建和初始化成功",
              userId: user.userId,
              publicKeyLength: user.publicKey.length,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Sign and Verify Test">
      <template>
        <script>
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建用户
          const user = new BaseUser("test-user-2");
          await user.init();

          // 签名数据
          const data = {
            message: "Hello, NoneOS!",
            timestamp: Date.now(),
          };

          const signedData = await user.sign(data);

          const hasSignature = !!signedData.signature;
          const hasSignTime = !!signedData.signTime;
          const hasPublicKey = !!signedData.publicKey;

          // 验证签名
          const isValid = await user.verify(signedData);

          // 篡改数据后验证
          const tamperedData = { ...signedData, message: "Tampered!" };
          const isTamperedValid = await user.verify(tamperedData);

          return {
            assert:
              hasSignature &&
              hasSignTime &&
              hasPublicKey &&
              isValid &&
              !isTamperedValid,
            content: {
              message: "签名和验证测试成功",
              originalMessage: data.message,
              signatureValid: isValid,
              tamperedMessageValid: isTamperedValid,
              signatureLength: signedData.signature.length,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Public Key Mode Test">
      <template>
        <script>
          import { BaseUser } from "/nos/user/base-user.js";

          // 首先创建一个完整用户并获取公钥
          const fullUser = new BaseUser("test-user-3");
          await fullUser.init();
          const publicKey = fullUser.publicKey;

          // 使用公钥创建用户（只读模式）
          const publicKeyUser = new BaseUser(publicKey);
          await publicKeyUser.init();

          const hasUserId = !!publicKeyUser.userId;
          const hasPublicKey = !!publicKeyUser.publicKey;
          const noSign = publicKeyUser.sign === null;

          // 使用公钥用户验证数据
          const data = { message: "Test message" };
          const signedData = await fullUser.sign(data);
          const isValid = await publicKeyUser.verify(signedData);

          return {
            assert: hasUserId && hasPublicKey && noSign && isValid,
            content: {
              message: "公钥模式测试成功",
              userId: publicKeyUser.userId,
              publicKeyLength: publicKeyUser.publicKey.length,
              canSign: publicKeyUser.sign !== null,
              verifySuccess: isValid,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="User Persistence Test">
      <template>
        <script>
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建第一个用户实例
          const user1 = new BaseUser("test-user-4");
          await user1.init();
          const userId1 = user1.userId;
          const publicKey1 = user1.publicKey;

          // 关闭连接
          user1.close();

          // 创建第二个用户实例（相同ID）
          const user2 = new BaseUser("test-user-4");
          await user2.init();
          const userId2 = user2.userId;
          const publicKey2 = user2.publicKey;

          // 验证数据持久化
          const sameUserId = userId1 === userId2;
          const samePublicKey = publicKey1 === publicKey2;

          // 验证签名功能
          const data = { message: "Persistence test" };
          const signedData = await user2.sign(data);
          const isValid = await user2.verify(signedData);

          return {
            assert: sameUserId && samePublicKey && isValid,
            content: {
              message: "用户数据持久化测试成功",
              userIdMatch: sameUserId,
              publicKeyMatch: samePublicKey,
              signatureValid: isValid,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Event Binding Test">
      <template>
        <script>
          import { BaseUser } from "/nos/user/base-user.js";

          const user = new BaseUser("test-user-5");
          await user.init();

          let eventFired = false;
          const eventName = "test-event";

          // 绑定事件
          const unbind = user.bind(eventName, () => {
            eventFired = true;
          });

          // 触发事件
          user.dispatchEvent(new CustomEvent(eventName));

          // 解绑事件
          unbind();

          // 再次触发事件（不应该执行）
          user.dispatchEvent(new CustomEvent(eventName));

          return {
            assert: eventFired,
            content: {
              message: "事件绑定测试成功",
              eventFired: eventFired,
            },
          };
        </script>
      </template>
    </sb-test>
  </body>
</html>
