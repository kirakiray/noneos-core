<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaseUser Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
  </head>
  <body>
    <h1>BaseUser Tests</h1>

    <sb-test name="Create and Initialize User Test">
      <template>
        <script type="module">
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建用户
          const initUser = new BaseUser("test-user-1");

          // 初始化用户
          await initUser.init();

          const hasInitUserId = !!initUser.userId;
          const hasInitPublicKey = !!initUser.publicKey;

          return {
            assert: hasInitUserId && hasInitPublicKey,
            content: {
              message: "用户创建和初始化成功",
              userId: initUser.userId,
              publicKeyLength: initUser.publicKey.length,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Sign and Verify Test">
      <template>
        <script type="module">
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建用户
          const signingUser = new BaseUser("test-user-2");
          await signingUser.init();

          // 签名数据
          const originalData = {
            message: "Hello, NoneOS!",
            timestamp: Date.now(),
          };

          const resultSignedData = await signingUser.sign(originalData);

          const hasSignature = !!resultSignedData.signature;
          const hasSignTime = !!resultSignedData.signTime;
          const hasPublicKey = !!resultSignedData.publicKey;

          // 验证签名
          const isSignatureValid = await signingUser.verify(resultSignedData);

          // 篡改数据后验证
          const tamperedMsgData = { ...resultSignedData, message: "Tampered!" };
          const isTamperedValid = await signingUser.verify(tamperedMsgData);

          return {
            assert:
              hasSignature &&
              hasSignTime &&
              hasPublicKey &&
              isSignatureValid &&
              !isTamperedValid,
            content: {
              message: "签名和验证测试成功",
              originalMessage: originalData.message,
              signatureValid: isSignatureValid,
              tamperedMessageValid: isTamperedValid,
              signatureLength: resultSignedData.signature.length,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Public Key Mode Test">
      <template>
        <script type="module">
          import { BaseUser } from "/nos/user/base-user.js";

          // 首先创建一个完整用户并获取公钥
          const fullUser = new BaseUser("test-user-3");
          await fullUser.init();
          const publicKeyHex = fullUser.publicKey;

          // 使用公钥创建用户（只读模式）
          const publicKeyUser = new BaseUser(publicKeyHex);
          await publicKeyUser.init();

          const hasPubUserUserId = !!publicKeyUser.userId;
          const hasPubUserPublicKey = !!publicKeyUser.publicKey;
          const isSignFunctionDisabled = publicKeyUser.sign === null;

          // 使用公钥用户验证数据
          const testDataForPubMode = { message: "Test message" };
          const signedDataForPubMode = await fullUser.sign(testDataForPubMode);
          const isPubModeVerifySuccess = await publicKeyUser.verify(signedDataForPubMode);

          return {
            assert: hasPubUserUserId && hasPubUserPublicKey && isSignFunctionDisabled && isPubModeVerifySuccess,
            content: {
              message: "公钥模式测试成功",
              userId: publicKeyUser.userId,
              publicKeyLength: publicKeyUser.publicKey.length,
              canSign: publicKeyUser.sign !== null,
              verifySuccess: isPubModeVerifySuccess,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="User Persistence Test">
      <template>
        <script type="module">
          import { BaseUser } from "/nos/user/base-user.js";

          // 创建第一个用户实例
          const persistenceUser1 = new BaseUser("test-user-4");
          await persistenceUser1.init();
          const savedUserId1 = persistenceUser1.userId;
          const savedPublicKey1 = persistenceUser1.publicKey;

          // 关闭连接
          persistenceUser1.close();

          // 创建第二个用户实例（相同ID）
          const persistenceUser2 = new BaseUser("test-user-4");
          await persistenceUser2.init();
          const savedUserId2 = persistenceUser2.userId;
          const savedPublicKey2 = persistenceUser2.publicKey;

          // 验证数据持久化
          const isUserIdMatched = savedUserId1 === savedUserId2;
          const isPublicKeyMatched = savedPublicKey1 === savedPublicKey2;

          // 验证签名功能
          const persistenceTestData = { message: "Persistence test" };
          const persistenceSignedData = await persistenceUser2.sign(persistenceTestData);
          const isPersistenceVerifyValid = await persistenceUser2.verify(persistenceSignedData);

          return {
            assert: isUserIdMatched && isPublicKeyMatched && isPersistenceVerifyValid,
            content: {
              message: "用户数据持久化测试成功",
              userIdMatch: isUserIdMatched,
              publicKeyMatch: isPublicKeyMatched,
              signatureValid: isPersistenceVerifyValid,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Event Binding Test">
      <template>
        <script type="module">
          import { BaseUser } from "/nos/user/base-user.js";

          const eventUser = new BaseUser("test-user-5");
          await eventUser.init();

          let isEventFired = false;
          const testEventName = "test-event";

          // 绑定事件
          const unbindEvent = eventUser.bind(testEventName, () => {
            isEventFired = true;
          });

          // 触发事件
          eventUser.dispatchEvent(new CustomEvent(testEventName));

          // 解绑事件
          unbindEvent();

          // 再次触发事件（不应该执行）
          eventUser.dispatchEvent(new CustomEvent(testEventName));

          return {
            assert: isEventFired,
            content: {
              message: "事件绑定测试成功",
              eventFired: isEventFired,
            },
          };
        </script>
      </template>
    </sb-test>
  </body>
</html>
