<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Server Test</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>

  <body>
    <h1>Connect Server Tests</h1>

    <sb-test name="User Connect to Handshake Server Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace1 = "test-connect";
          const user1 = new LocalUser(namespace1);

          await user1.ready();

          let success = false;
          let error;
          const url = "ws://127.0.0.1:8081";
          try {
            success = await user1.connectServer(url);
          } catch (e) {
            error = e;
          }

          return {
            assert: success === true,
            content: {
              message: success
                ? "Successfully connected and returned true"
                : "Connection failed",
              userId: user1.userId,
              error: error ? error.message : null,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Custom Event Forwarding Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace2 = "test-msg";
          const user2 = new LocalUser(namespace2);
          await user2.ready();

          const url2 = "ws://127.0.0.1:8081";
          await user2.connectServer(url2);

          const msg2 =
            "Hello Server " + Math.random().toString(36).substring(2, 8);
          let receivedDetail = null;

          const messagePromise = new Promise((resolve) => {
            user2.addEventListener(
              "message",
              (event) => {
                receivedDetail = event.detail;
                resolve();
              },
              { once: true },
            );
          });

          user2.sendToServer(url2, msg2);

          await Promise.race([
            messagePromise,
            new Promise((res) => setTimeout(res, 3000)),
          ]);

          const isEchoMatched =
            receivedDetail &&
            receivedDetail.data === "Server received: " + msg2;

          return {
            assert: isEchoMatched,
            content: {
              message: isEchoMatched
                ? "Received correct event from LocalUser"
                : "Event match failed or timeout",
              sent: msg2,
              received: receivedDetail ? receivedDetail.data : null,
              url: receivedDetail ? receivedDetail.url : null,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="WebSocket Persistence and Reuse Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace3 = "test-reuse";
          const user3 = new LocalUser(namespace3);
          await user3.ready();

          const url3 = "ws://127.0.0.1:8081";

          // 第一次连接
          const firstResult = await user3.connectServer(url3);

          // 第二次连接（应该直接返回 true）
          const secondResult = await user3.connectServer(url3);

          return {
            assert: firstResult === true && secondResult === true,
            content: {
              message: "Successfully reused existing connection",
              firstResult,
              secondResult,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Tampered Data Handshake Test (Should Fail)">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace4 = "test-tamper-data";
          const user4 = new LocalUser(namespace4);
          await user4.ready();

          const userInfo4 = await user4.getInfo();
          // 模拟篡改数据：修改用户名但保留原有的（针对旧数据的）签名
          const tamperedInfo4 = { ...userInfo4, username: "hacker" };

          const url4 = "ws://127.0.0.1:8081";
          let serverResponse4 = null;

          const handshakeResult4 = await new Promise((resolve) => {
            const ws = new WebSocket(url4);
            let pendingSend = null;
            let hasResolved = false;

            const safeResolve = (value) => {
              if (!hasResolved) {
                hasResolved = true;
                resolve(value);
              }
            };

            ws.onopen = () => {
              if (pendingSend !== null) {
                ws.send(pendingSend);
                pendingSend = null;
              }
            };

            ws.onmessage = (e) => {
              const data = JSON.parse(e.data);
              if (data.type === "handshake_challenge") {
                // 模拟攻击者：收到挑战后，发送一个包含篡改数据的响应，但由于没有私钥，无法生成合法的 outer signature
                // 这里我们直接发送一个非法的 signature 或者尝试重放旧的签名（如果结构允许）
                const payload = JSON.stringify({
                  type: "handshake_response",
                  challenge: data.challenge,
                  userId: user4.userId,
                  username: "hacker",
                  publicKey: userInfo4.publicKey,
                  signature: "YQ==", // Valid base64 (for 'a'), but definitely not a valid signature
                });
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(payload);
                } else {
                  pendingSend = payload;
                }
                return;
              }
              serverResponse4 = data;
            };

            ws.onclose = () => {
              // 连接关闭时，如果已收到服务器响应，使用该响应
              if (serverResponse4) {
                safeResolve(serverResponse4);
              } else {
                safeResolve({ status: "error", message: "Connection closed without response" });
              }
            };

            ws.onerror = () => {
              // Safari 可能在 onmessage 之前触发 onerror，延迟处理以允许 onmessage 先到达
              setTimeout(() => {
                if (!hasResolved) {
                  if (serverResponse4) {
                    safeResolve(serverResponse4);
                  } else {
                    safeResolve({ status: "error", message: "WebSocket error" });
                  }
                }
              }, 300);
            };

            setTimeout(() => {
              ws.close();
              safeResolve({ status: "error", message: "timeout" });
            }, 3000);
          });

          const isRejected4 =
            handshakeResult4.status === "error" &&
            handshakeResult4.message.includes("Verification failed");

          return {
            assert: isRejected4,
            content: {
              message: isRejected4
                ? "Server correctly rejected tampered data"
                : "Server failed to detect tampering",
              response: handshakeResult4,
            },
          };
        </script>
      </template>
    </sb-test>

          await user5.ready();

          const userInfo5 = await user5.getInfo();

          const url5 = "ws://127.0.0.1:8081";
          let serverResponse5 = null;

          const handshakeResult5 = await new Promise((resolve) => {

            ws.onmessage = async (e) => {

                const payload = JSON.stringify(response);

                return;

            };

            ws.onclose = () => {

              if (serverResponse5) {

              setTimeout(() => {

                  if (serverResponse5) {
                    safeResolve(serverResponse5);
                  } else {
                    safeResolve({ status: "error", message: "WebSocket error" });

              }, 300);
            };

            setTimeout(() => {

          });

          const isRejected5 =

          return {
            assert: isRejected5,

        </script>
      </template>
    </sb-test>
