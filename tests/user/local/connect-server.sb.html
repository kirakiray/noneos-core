    <h1>Connect Server Tests</h1>

    <sb-test name="User Connect to Handshake Server Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace1 = "test-connect";
          const user1 = new LocalUser(namespace1);

          await user1.ready();

          let connectResult1 = null;
          let connectError1;
          const url = "ws://localhost:8081";
          try {
            connectResult1 = await user1.server.connect(url);
          } catch (e) {
            connectError1 = e;
          }

          const isConnected1 = connectResult1 && connectResult1.success === true;

          return {
            assert: isConnected1 === true,
            content: {
              message: isConnected1
                ? "Successfully connected"
                : "Connection failed",
              userId: user1.userId,
              version: connectResult1 ? connectResult1.version : null,
              error: connectError1 ? connectError1.message : null,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Server Version Retrieval Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespaceVersion = "test-version";
          const userVersion = new LocalUser(namespaceVersion);
          await userVersion.ready();

          const versionUrl = "ws://localhost:8081";
          const versionResult = await userVersion.server.connect(versionUrl);

          const hasVersion =
            versionResult &&
            versionResult.success === true &&
            typeof versionResult.version === "string" &&
            versionResult.version.length > 0;

          return {
            assert: hasVersion === true,
            content: {
              message: hasVersion
                ? `Server version retrieved: ${versionResult.version}`
                : "Failed to retrieve server version",
              version: versionResult ? versionResult.version : null,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="WebSocket Persistence and Reuse Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace3 = "test-reuse";
          const user3 = new LocalUser(namespace3);
          await user3.ready();

          const url3 = "ws://localhost:8081";

          // 第一次连接
          const firstResult = await user3.server.connect(url3);

          // 第二次连接（应该直接返回已缓存的结果）
          const secondResult = await user3.server.connect(url3);

          return {
            assert:
              firstResult.success === true && secondResult.success === true,
            content: {
              message: "Successfully reused existing connection",
              firstResult,
              secondResult,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Tampered Data Handshake Test (Should Fail)">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace4 = "test-tamper-data";
          const user4 = new LocalUser(namespace4);
          await user4.ready();

          const userInfo4 = await user4.getInfo();
          // 模拟篡改数据：修改用户名但保留原有的（针对旧数据的）签名
          const tamperedInfo4 = { ...userInfo4, username: "hacker" };

          const url4 = "ws://localhost:8081";
          let serverResponse4 = null;

          const handshakeResult4 = await new Promise((resolve) => {
            const ws = new WebSocket(url4);
            let pendingSend = null;
            let hasResolved = false;

            const safeResolve = (value) => {
              if (!hasResolved) {
                hasResolved = true;
                resolve(value);
              }
            };

            ws.onopen = () => {
              if (pendingSend !== null) {
                ws.send(pendingSend);
                pendingSend = null;
              }
            };

            ws.onmessage = (e) => {
              const data = JSON.parse(e.data);
              if (data.type === "handshake_challenge") {
                // 模拟攻击者：收到挑战后，发送一个包含篡改数据的响应，但由于没有私钥，无法生成合法的 outer signature
                // 这里我们直接发送一个非法的 signature 或者尝试重放旧的签名（如果结构允许）
                const payload = JSON.stringify({
                  type: "handshake_response",
                  challenge: data.challenge,
                  userId: user4.userId,
                  username: "hacker",
                  publicKey: userInfo4.publicKey,
                  signature: "YQ==", // Valid base64 (for 'a'), but definitely not a valid signature
                });
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(payload);
                } else {
                  pendingSend = payload;
                }
                return;
              }
              serverResponse4 = data;
            };

            ws.onclose = () => {
              // 连接关闭时，如果已收到服务器响应，使用该响应
              if (serverResponse4) {
                safeResolve(serverResponse4);
              } else {
                safeResolve({
                  status: "error",
                  message: "Connection closed without response",
                });
              }
            };

            ws.onerror = () => {
              // Safari 可能在 onmessage 之前触发 onerror，延迟处理以允许 onmessage 先到达
              setTimeout(() => {
                if (!hasResolved) {
                  if (serverResponse4) {
                    safeResolve(serverResponse4);
                  } else {
                    safeResolve({
                      status: "error",
                      message: "WebSocket error",
                    });
                  }
                }
              }, 300);
            };

            setTimeout(() => {
              ws.close();
              safeResolve({ status: "error", message: "timeout" });
            }, 3000);
          });

          const isRejected4 =
            handshakeResult4.status === "error" &&
            handshakeResult4.message.includes("Verification failed");

          return {
            assert: isRejected4,
            content: {
              message: isRejected4
                ? "Server correctly rejected tampered data"
                : "Server failed to detect tampering",
              response: handshakeResult4,
            },
          };
        </script>
      </template>
    </sb-test>

            ws.onmessage = async (e) => {
              const data = JSON.parse(e.data);
              if (data.type === "handshake_challenge") {

                const payload = JSON.stringify(response);
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(payload);
                } else {
                  pendingSend = payload;
                }
                return;
              }
              serverResponse5 = data;
            };

            ws.onclose = () => {
              // 连接关闭时，如果已收到服务器响应，使用该响应
              if (serverResponse5) {
                safeResolve(serverResponse5);
              } else {
                safeResolve({
                  status: "error",
                  message: "Connection closed without response",
                });
              }
            };

            ws.onerror = () => {
              // Safari 可能在 onmessage 之前触发 onerror，延迟处理以允许 onmessage 先到达
              setTimeout(() => {
                if (!hasResolved) {
                  if (serverResponse5) {
                    safeResolve(serverResponse5);
                  } else {
                    safeResolve({
                      status: "error",
                      message: "WebSocket error",
                    });
                  }
                }
              }, 300);
            };

            setTimeout(() => {
              ws.close();
              safeResolve({ status: "error", message: "timeout" });
            }, 3000);
          });

          const isRejected5 =
            handshakeResult5.status === "error" &&
            handshakeResult5.message.includes("Verification failed");

          return {
            assert: isRejected5,
            content: {
              message: isRejected5
                ? "Server correctly rejected wrong signature"
                : "Server failed to detect wrong signature",
              response: handshakeResult5,
            },
          };
        </script>
      </template>

    <sb-test name="Handshake Timeout Test (No Response to Challenge)">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace6 = "test-timeout";
          const user6 = new LocalUser(namespace6);
          await user6.ready();

          const url6 = "ws://localhost:8081";
          let serverResponse6 = null;

          const handshakeResult6 = await new Promise((resolve) => {
            const ws = new WebSocket(url6);
            let hasResolved = false;

            const safeResolve = (value) => {
              if (!hasResolved) {
                hasResolved = true;
                resolve(value);
              }
            };

            ws.onopen = () => {
              // 收到 onopen 后不做任何事，故意不回复 handshake_challenge
            };

            ws.onmessage = (e) => {
              const data = JSON.parse(e.data);
              // 记录服务器任何响应，但故意不回复
              serverResponse6 = data;
            };

            ws.onclose = (event) => {
              safeResolve({
                status: "closed",
                reason: event.reason || "Connection closed",
                serverResponse: serverResponse6,
              });
            };

            ws.onerror = () => {
              setTimeout(() => {
                if (!hasResolved && serverResponse6) {
                  safeResolve({
                    status: "closed",
                    serverResponse: serverResponse6,
                  });
                } else if (!hasResolved) {
                  safeResolve({ status: "error", message: "WebSocket error" });
                }
              }, 300);
            };

            // 安全阀：10秒后强制结束
            setTimeout(() => {
              ws.close();
              safeResolve({
                status: "timeout",
                serverResponse: serverResponse6,
              });
            }, 10000);
          });

          const isTimeoutHandled =
            serverResponse6 !== null &&
            serverResponse6.type === "handshake" &&
            serverResponse6.status === "error" &&
            serverResponse6.message.includes("timeout");

          return {
            assert: isTimeoutHandled,
            content: {
              message: isTimeoutHandled
                ? "Server correctly disconnected after handshake timeout"
                : "Server did not handle timeout as expected",
              serverResponse: serverResponse6,
              result: handshakeResult6,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Latency Measurement Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace7 = "test-latency";
          const user7 = new LocalUser(namespace7);
          await user7.ready();

          const url7 = "ws://localhost:8081";
          await user7.server.connect(url7);

          // 执行延迟测试：客户端测量 RTT，服务器也能知道延迟
          const result = await user7.server.testLatency(url7);

          // 验证结果合理性
          const hasValidRtt = result.rtt >= 0 && result.rtt < 10000;
          const hasValidOneWay =
            result.oneWayLatency >= 0 && result.oneWayLatency < 5000;
          const timestampsValid =
            result.clientTime >= 0 &&
            result.serverRecvTime >= 0 &&
            result.serverSendTime >= 0 &&
            result.clientRecvTime >= 0;

          // client_time < server_recv_time < client_recv_time（正常情况下）
          // 注意：由于 client 和 server 时钟不完全同步，clientTime 可能略大于 serverRecvTime
          // 但 RTT = clientRecvTime - clientTime 始终是正确的相对测量
          const rttPositive = result.rtt >= 0;

          const allValid =
            hasValidRtt && hasValidOneWay && timestampsValid && rttPositive;

          return {
            assert: allValid,
            content: {
              message: allValid
                ? `Latency measurement successful — RTT: ${result.rtt}ms, one-way: ~${result.oneWayLatency}ms`
                : "Latency measurement produced invalid results",
              rtt: result.rtt,
              oneWayLatency: result.oneWayLatency,
              clientTime: result.clientTime,
              serverRecvTime: result.serverRecvTime,
              serverSendTime: result.serverSendTime,
              clientRecvTime: result.clientRecvTime,
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Periodic Latency Monitor Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const namespace8 = "test-latency-monitor";
          const user8 = new LocalUser(namespace8);
          await user8.ready();

          const url8 = "ws://localhost:8081";
          await user8.server.connect(url8);

          // 收集 2 次周期性测量结果
          const measurements = [];

          const listener = (e) => {
            if (e.detail.url === url8) {
              measurements.push(e.detail);
            }
          };
          const cancel = user8.bind("latency_test", listener);

          // 启动监测，每隔 100ms 测一次（测试时用短间隔）
          user8.server.startLatencyMonitor(100);

          // 等待收集到 2 次有效数据
          await new Promise((resolve, reject) => {
            const check = setInterval(() => {
              if (measurements.length >= 2) {
                clearInterval(check);
                resolve();
              }
            }, 50);
            setTimeout(() => {
              clearInterval(check);
              reject(new Error("Timeout waiting for measurements"));
            }, 5000);
          });

          user8.server.stopLatencyMonitor();
          cancel();

          // 验证所有测量结果有效
          const allValid8 = measurements.every(
            (m) => m.rtt >= 0 && m.rtt < 10000 && m.oneWayLatency >= 0,
          );

          return {
            assert: allValid8 && measurements.length >= 2,
            content: {
              message: allValid8
                ? `Collected ${measurements.length} valid latency measurements`
                : "Some measurements were invalid",
              count: measurements.length,
              samples: measurements,
            },
          };
        </script>
      </template>
    </sb-test>
