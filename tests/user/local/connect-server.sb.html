<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Server Test</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
</head>

<body>
  <h1>Connect Server Tests</h1>

  <sb-test name="User Connect to Handshake Server Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const namespace1 = "test-connect";
        const user1 = new LocalUser(namespace1);
        
        await user1.ready();
        
        let success = false;
        let error;
        const url = "ws://127.0.0.1:8081";
        try {
          success = await user1.connectServer(url);
        } catch (e) {
          error = e;
        }

        return {
          assert: success === true,
          content: {
            message: success ? "Successfully connected and returned true" : "Connection failed",
            userId: user1.userId,
            error: error ? error.message : null
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Custom Event Forwarding Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const namespace2 = "test-msg";
        const user2 = new LocalUser(namespace2);
        await user2.ready();

        const url2 = "ws://127.0.0.1:8081";
        await user2.connectServer(url2);
        
        const msg2 = "Hello Server " + Math.random().toString(36).substring(2, 8);
        let receivedDetail = null;

        const messagePromise = new Promise((resolve) => {
          user2.addEventListener("message", (event) => {
            receivedDetail = event.detail;
            resolve();
          }, { once: true });
        });

        user2.sendToServer(url2, msg2);
        
        await Promise.race([
          messagePromise,
          new Promise(res => setTimeout(res, 3000))
        ]);

        const isEchoMatched = receivedDetail && receivedDetail.data === "Server received: " + msg2;
        
        return {
          assert: isEchoMatched,
          content: {
            message: isEchoMatched ? "Received correct event from LocalUser" : "Event match failed or timeout",
            sent: msg2,
            received: receivedDetail ? receivedDetail.data : null,
            url: receivedDetail ? receivedDetail.url : null
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="WebSocket Persistence and Reuse Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const namespace3 = "test-reuse";
        const user3 = new LocalUser(namespace3);
        await user3.ready();

        const url3 = "ws://127.0.0.1:8081";
        
        // 第一次连接
        const firstResult = await user3.connectServer(url3);
        
        // 第二次连接（应该直接返回 true）
        const secondResult = await user3.connectServer(url3);

        return {
          assert: firstResult === true && secondResult === true,
          content: {
            message: "Successfully reused existing connection",
            firstResult,
            secondResult
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Tampered Data Handshake Test (Should Fail)">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const namespace4 = "test-tamper-data";
        const user4 = new LocalUser(namespace4);
        await user4.ready();

        const userInfo4 = await user4.getInfo();
        const tamperedInfo4 = { ...userInfo4, username: "hacker" };
        
        const url4 = "ws://127.0.0.1:8081";
        let serverResponse4 = null;

        const handshakeResult4 = await new Promise((resolve) => {
          const ws = new WebSocket(url4);
          ws.onopen = () => ws.send(JSON.stringify(tamperedInfo4));
          ws.onmessage = (e) => {
            serverResponse4 = JSON.parse(e.data);
            ws.close();
            resolve(serverResponse4);
          };
          ws.onerror = () => resolve({ status: "error", message: "WebSocket error" });
          setTimeout(() => { ws.close(); resolve({ status: "error", message: "timeout" }); }, 3000);
        });

        const isRejected4 = handshakeResult4.status === "error" && handshakeResult4.message.includes("Verification failed");

        return {
          assert: isRejected4,
          content: {
            message: isRejected4 ? "Server correctly rejected tampered data" : "Server failed to detect tampering",
            response: handshakeResult4
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Tampered Signature Handshake Test (Should Fail)">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const namespace5 = "test-tamper-sig";
        const user5 = new LocalUser(namespace5);
        await user5.ready();

        const userInfo5 = await user5.getInfo();
        const tamperedSig5 = userInfo5.signature.slice(0, -1) + (userInfo5.signature.endsWith("A") ? "B" : "A");
        const tamperedInfo5 = { ...userInfo5, signature: tamperedSig5 };
        
        const url5 = "ws://127.0.0.1:8081";
        let serverResponse5 = null;

        const handshakeResult5 = await new Promise((resolve) => {
          const ws = new WebSocket(url5);
          ws.onopen = () => ws.send(JSON.stringify(tamperedInfo5));
          ws.onmessage = (e) => {
            serverResponse5 = JSON.parse(e.data);
            ws.close();
            resolve(serverResponse5);
          };
          ws.onerror = () => resolve({ status: "error", message: "WebSocket error" });
          setTimeout(() => { ws.close(); resolve({ status: "error", message: "timeout" }); }, 3000);
        });

        const isRejected5 = handshakeResult5.status === "error" && handshakeResult5.message.includes("Verification failed");

        return {
          assert: isRejected5,
          content: {
            message: isRejected5 ? "Server correctly rejected wrong signature" : "Server failed to detect wrong signature",
            response: handshakeResult5
          },
        };
      </script>
    </template>
  </sb-test>
</body>

</html>
