    <h1>Agent Data By Server Tests</h1>

    <!-- ============================================================ -->
    <!-- 使用说明                                                     -->
    <!-- ============================================================ -->
    <!--
    任意用户可以通过服务器查询其他用户的在线状态，并通过服务器转发数据。

    ## 1. 查询用户在线状态

    发送：
        { "type": "query", "action": "user_online", "user_id": "<targetUserId>" }

    响应（在线）：
        {
          "type": "query_response",
          "action": "user_online",
          "status": "ok",
          "online": true,
          "sessions": ["s-xxxx", "s-yyyy"]
        }

    响应（离线）：
        {
          "type": "query_response",
          "action": "user_online",
          "status": "ok",
          "online": false,
          "sessions": []
        }

    ## 2. 通过服务器转发数据到指定用户 session

    发送：
        {
          "type": "relay",
          "action": "send_data",
          "target_user_id": "<targetUserId>",
          "target_session_id": "<targetSessionId>",
          "data": <any JSON value>
        }

    响应（成功）：
        {
          "type": "relay_response",
          "action": "send_data",
          "status": "ok",
          "message": "Data delivered to target"
        }

    响应（失败）：
        {
          "type": "relay_response",
          "action": "send_data",
          "status": "error",
          "message": "Target session not found or offline"
        }

    ## 3. 目标用户接收转发数据

    目标用户将收到：
        {
          "type": "relay",
          "from_user_id": "<senderUserId>",
          "from_session_id": "<senderSessionId>",
          "data": <any JSON value>
        }
    -->

    <!-- ============================================================ -->
    <!-- Test 1: 查询用户在线状态（自己查询自己）                      -->
    <!-- ============================================================ -->
    <sb-test name="Query Self Online Status">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          const t1Ns = "agent-t1-ns";
          const t1User = new LocalUser(t1Ns);
          await t1User.ready();

          const t1Url = "ws://localhost:8081";

          // 连接服务器
          await t1User.server.connect(t1Url);

          // 查询自己的在线状态
          const t1Result = await t1User.server.queryUserOnline(t1Url, t1User.userId);

          const t1Online = t1Result.online === true;
          const t1SessionIsArray = Array.isArray(t1Result.sessions);
          const t1SessionCount = t1Result.sessions?.length;
          const t1SessionIdMatch = t1SessionIsArray && t1SessionCount === 1 && t1Result.sessions[0] === t1User.sessionId;
          const t1HasSession = t1SessionIsArray && t1SessionCount === 1 && t1Result.sessions[0] === t1User.sessionId;

          return {
            assert: t1Online && t1HasSession,
            content: {
              message:
                t1Online && t1HasSession
                  ? "Self online query succeeded"
                  : "Self online query failed",
              online: t1Result.online,
              sessions: t1Result.sessions,
              expectedSessionId: t1User.sessionId,
              checks: {
                t1Online,
                t1SessionIsArray,
                t1SessionCount,
                t1SessionIdMatch,
                t1HasSession,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <!-- Test 4: 通过服务器转发数据到指定用户 session                   -->
    <!-- ============================================================ -->
    <sb-test name="Relay Data to Target User Session">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          // 发送方用户
          const t4SendNs = "agent-t4send-ns";
          const t4Sender = new LocalUser(t4SendNs);
          await t4Sender.ready();

          // 接收方用户
          const t4RecvNs = "agent-t4recv-ns";
          const t4Receiver = new LocalUser(t4RecvNs);
          await t4Receiver.ready();

          const t4Url = "ws://localhost:8081";

          // 两个用户都连接服务器
          await t4Sender.server.connect(t4Url);
          await t4Receiver.server.connect(t4Url);

          // 接收方监听 relay 事件
          const t4RecvPromise = new Promise((resolve) => {
            const t4Handler = (e) => {
              let data;
              try {
                data =
                  typeof e.detail.data === "string"
                    ? JSON.parse(e.detail.data)
                    : e.detail.data;
              } catch {
                return;
              }
              if (
                data?.type === "relay" &&
                data?.from_user_id === t4Sender.userId
              ) {
                t4Receiver.removeEventListener("message", t4Handler);
                resolve(data);
              }
            };
            t4Receiver.addEventListener("message", t4Handler);

            setTimeout(() => {
              t4Receiver.removeEventListener("message", t4Handler);
              resolve(null);
            }, 5000);
          });

          // 发送数据
          const t4Payload = {
            text: "Hello from sender!",
            number: 42,
            timestamp: Date.now(),
          };

          const t4SendResult = await t4Sender.server.relayToUserViaServer(
            t4Url,
            t4Receiver.userId,
            t4Receiver.sessionId,
            t4Payload,
          );

          // 等待接收方收到
          const t4Received = await t4RecvPromise;

          const t4SendOk = t4SendResult.status === "ok";
          const t4ReceivedNotNull = t4Received !== null;
          const t4TextMatch = t4Received?.data?.text === t4Payload.text;
          const t4NumMatch = t4Received?.data?.number === t4Payload.number;
          const t4RecvOk = t4ReceivedNotNull && t4TextMatch && t4NumMatch;

          return {
            assert: t4SendOk && t4RecvOk,
            content: {
              message:
                t4SendOk && t4RecvOk
                  ? "Data successfully relayed from sender to receiver"
                  : "Relay test failed",
              sendStatus: t4SendResult.status,
              sendMessage: t4SendResult.message,
              receivedPayload: t4Received,
              expectedPayload: t4Payload,
              checks: {
                t4SendOk,
                t4ReceivedNotNull,
                t4TextMatch,
                t4NumMatch,
                t4RecvOk,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <!-- Test 7: 通过服务器转发二进制 Uint8Array（0-255 全字节值）      -->
    <!-- ============================================================ -->
    <sb-test name="Relay Binary Uint8Array (0-255) to Target User Session">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/local/user.js";

          // 发送方
          const t7SendNs = "agent-t7send-ns";
          const t7Sender = new LocalUser(t7SendNs);
          await t7Sender.ready();

          // 接收方
          const t7RecvNs = "agent-t7recv-ns";
          const t7Receiver = new LocalUser(t7RecvNs);
          await t7Receiver.ready();

          const t7Url = "ws://localhost:8081";

          await t7Sender.server.connect(t7Url);
          await t7Receiver.server.connect(t7Url);

          // 构造 0-255 全字节值
          const t7ExpectedBytes = new Uint8Array(256);
          for (let i = 0; i < 256; i++) {
            t7ExpectedBytes[i] = i;
          }

          // 辅助函数：解析二进制 relay 帧
          const t7ParseBinaryRelay = async (blob) => {
            const buffer = await blob.arrayBuffer();
            const bytes = new Uint8Array(buffer);
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const headerLen = view.getUint32(0, false);
            const headerBytes = bytes.slice(4, 4 + headerLen);
            const headerText = new TextDecoder().decode(headerBytes);
            const header = JSON.parse(headerText);
            const payload = bytes.slice(4 + headerLen);
            return { header, payload };
          };

          const t7RecvPromise = new Promise((resolve) => {
            const t7Handler = async (e) => {
              if (typeof e.detail.data === "string") {
                return;
              }
              const t7Parsed = await t7ParseBinaryRelay(e.detail.data);
              if (
                t7Parsed.header?.type === "relay" &&
                t7Parsed.header?.from_user_id === t7Sender.userId
              ) {
                t7Receiver.removeEventListener("message", t7Handler);
                resolve(t7Parsed);
              }
            };
            t7Receiver.addEventListener("message", t7Handler);

            setTimeout(() => {
              t7Receiver.removeEventListener("message", t7Handler);
              resolve(null);
            }, 5000);
          });

          // 发送二进制数据
          const t7SendResult = await t7Sender.server.relayToUserViaServer(
            t7Url,
            t7Receiver.userId,
            t7Receiver.sessionId,
            t7ExpectedBytes,
          );

          const t7Received = await t7RecvPromise;

          const t7SendOk = t7SendResult.status === "ok";
          const t7ReceivedNotNull = t7Received !== null;
          const t7PayloadLenMatch = t7ReceivedNotNull && t7Received.payload.length === t7ExpectedBytes.length;
          const t7PayloadContentMatch = t7PayloadLenMatch && t7Received.payload.every((v, i) => v === t7ExpectedBytes[i]);
          const t7RecvOk = t7ReceivedNotNull && t7PayloadLenMatch && t7PayloadContentMatch;

          return {
            assert: t7SendOk && t7RecvOk,
            content: {
              message:
                t7SendOk && t7RecvOk
                  ? "Binary Uint8Array (0-255) successfully relayed"
                  : "Binary Uint8Array relay failed",
              sendStatus: t7SendResult.status,
              sendMessage: t7SendResult.message,
              receivedHeader: t7Received?.header,
              receivedLength: t7Received?.payload?.length,
              expectedLength: t7ExpectedBytes.length,
              checks: {
                t7SendOk,
                t7ReceivedNotNull,
                t7PayloadLenMatch,
                t7PayloadContentMatch,
                t7RecvOk,
              },
            },
          };
        </script>
      </template>
    </sb-test>
