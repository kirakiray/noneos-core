    <!--
    ## get_traffic_stats 命令

    管理员可以查询服务器的实时流量统计数据：

    发送：
      { "type": "admin", "action": "get_traffic_stats" }

    响应：
      {
        "type": "admin_response",
        "action": "get_traffic_stats",
        "status": "ok",
        "traffic": {
          "global": {
            "inbound_bytes": 12345,
            "outbound_bytes": 67890,
            "relay_forwarded_bytes": 54321,
            "handshake_bytes": 9876
          },
          "users": [
            {
              "user_id": "...",
              "username": "...",
              "session_count": 1,
              "inbound_bytes": 1000,
              "outbound_bytes": 2000,
              "relay_forwarded_bytes": 500,
              "handshake_bytes": 100
            }
          ],
          "time_distribution": [
            {
              "minute_epoch": 1718000000,
              "inbound_bytes": 100,
              "outbound_bytes": 200,
              "relay_forwarded_bytes": 50
            }
          ]
        }
      }

    ## get_traffic_history 命令

    查询历史流量数据（需配置 traffic_db_path），支持分页：

    发送：
      { "type": "admin", "action": "get_traffic_history", "page": 1, "page_size": 20, "from_ms": "可选，毫秒", "user_id": "可选" }

    响应：
      {
        "type": "admin_response",
        "action": "get_traffic_history",
        "status": "ok",
        "total": 123,
        "page": 1,
        "page_size": 20,
        "history": [ ... ]
      }
    -->

    <sb-test name="Admin Get Traffic Stats (Empty)">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";

          const adminEmptyData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const emptyNs = "admin-ts-empty-ns";

          try {
            await deleteUser(emptyNs, { skipConfirm: true });
          } catch (e) { /* ignore */ }

          await saveUserKeys(emptyNs, adminEmptyData.keys);
          await saveUserInfo(emptyNs, adminEmptyData.info);

          const emptyAdmin = new AdminUser(emptyNs);
          await emptyAdmin.ready();

          const emptyUrl = "ws://localhost:8081";

          // 只连接管理员自己，获取流量统计
          await emptyAdmin.server.connect(emptyUrl);
          const emptyResult = await emptyAdmin.getTrafficStats(emptyUrl);

          const emptyHasGlobal = emptyResult?.traffic?.global != null;
          const emptyHasUsers = Array.isArray(emptyResult?.traffic?.users);
          const emptyHasTimeDist = Array.isArray(emptyResult?.traffic?.time_distribution);
          const emptyAllFields = emptyHasGlobal && emptyHasUsers && emptyHasTimeDist;

          // global 字段齐全
          const emptyG = emptyResult.traffic.global;
          const emptyGlobalOK = typeof emptyG.inbound_bytes === 'number'
            && typeof emptyG.outbound_bytes === 'number'
            && typeof emptyG.relay_forwarded_bytes === 'number'
            && typeof emptyG.handshake_bytes === 'number';

          const emptyAllOk = emptyAllFields && emptyGlobalOK;

          // 退出登录：断开连接
          emptyAdmin.server.disconnect(emptyUrl);

          return {
            assert: emptyAllOk,
            content: {
              message: emptyAllOk
                ? "Traffic stats response has all expected fields"
                : "Missing some traffic stats fields",
              status: emptyResult.status,
              global: emptyResult.traffic.global,
              userCount: emptyResult.traffic.users.length,
              distCount: emptyResult.traffic.time_distribution.length,
              checks: {
                emptyAllFields,
                emptyHasGlobal,
                emptyHasUsers,
                emptyHasTimeDist,
                emptyGlobalOK,
                inboundType: typeof emptyG?.inbound_bytes,
                outboundType: typeof emptyG?.outbound_bytes,
                relayType: typeof emptyG?.relay_forwarded_bytes,
                handshakeType: typeof emptyG?.handshake_bytes,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin Get Traffic Stats After Handshake">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/local/user.js";

          const hsAdminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const hsAdminNs = "admin-ts-hs-ns";
          try { await deleteUser(hsAdminNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(hsAdminNs, hsAdminData.keys);
          await saveUserInfo(hsAdminNs, hsAdminData.info);
          const hsAdmin = new AdminUser(hsAdminNs);
          await hsAdmin.ready();

          // 准备两个普通用户，连接到服务器
          const hsUserANs = "ts-user-a-ns";
          const hsUserBNs = "ts-user-b-ns";
          const hsUserA = new LocalUser(hsUserANs);
          const hsUserB = new LocalUser(hsUserBNs);
          await hsUserA.ready();
          await hsUserB.ready();

          const hsUrl = "ws://localhost:8081";

          // 连接三个用户（管理员 + 两个普通用户）
          await hsAdmin.server.connect(hsUrl);
          await hsUserA.server.connect(hsUrl);
          await hsUserB.server.connect(hsUrl);

          // 轮询流量统计，直到至少有 3 个用户（管理员 + userA + userB）
          // WebKit 下 WebSocket 处理可能较慢，需要重试
          let hsResult = null;
          let hsUserCount = 0;
          const hsRetryMax = 10;
          const hsRetryDelay = 300;
          for (let i = 0; i < hsRetryMax; i++) {
            hsResult = await hsAdmin.getTrafficStats(hsUrl);
            hsUserCount = hsResult?.traffic?.users?.length || 0;
            if (hsUserCount >= 3) break;
            await new Promise(r => setTimeout(r, hsRetryDelay));
          }

          // 验证：至少有 3 个用户的流量记录（管理员 + userA + userB）
          const hsHasThree = hsUserCount >= 3;

          // 每个用户都应该有 handshake 流量
          const hsAllHandshake = hsResult?.traffic?.users?.every(
            u => u.handshake_bytes > 0
          ) || false;

          // 全局 handshake 应大于 0
          const hsGlobalOK = (hsResult?.traffic?.global?.handshake_bytes || 0) > 0;

          const hsAllOk = hsHasThree && hsAllHandshake && hsGlobalOK;

          // 退出登录：断开所有连接
          hsAdmin.server.disconnect(hsUrl);
          hsUserA.server.disconnect(hsUrl);
          hsUserB.server.disconnect(hsUrl);

          return {
            assert: hsAllOk,
            content: {
              message: hsAllOk
                ? `Traffic stats shows ${hsUserCount} user(s), all have handshake data`
                : "Traffic stats missing expected users",
              userCount: hsUserCount,
              users: hsResult?.traffic?.users,
              global: hsResult?.traffic?.global,
              checks: {
                hsHasThree,
                expectedMinUsers: 3,
                actualUserCount: hsUserCount,
                hsAllHandshake,
                hsGlobalOK,
                globalHandshakeBytes: hsResult?.traffic?.global?.handshake_bytes,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Traffic Stats Include Relay Forwarding">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/local/user.js";

          const relayAdminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const relayAdminNs = "admin-ts-relay-ns";
          try { await deleteUser(relayAdminNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(relayAdminNs, relayAdminData.keys);
          await saveUserInfo(relayAdminNs, relayAdminData.info);
          const relayAdmin = new AdminUser(relayAdminNs);
          await relayAdmin.ready();

          const relayUserANs = "ts-relay-a-ns";
          const relayUserBNs = "ts-relay-b-ns";
          const relayUserA = new LocalUser(relayUserANs);
          const relayUserB = new LocalUser(relayUserBNs);
          await relayUserA.ready();
          await relayUserB.ready();

          const relayUrl = "ws://localhost:8081";

          // 连接三个用户
          await relayAdmin.server.connect(relayUrl);
          await relayUserA.server.connect(relayUrl);
          await relayUserB.server.connect(relayUrl);

          // 查询用户B的 sessionId
          const relayQuery = await relayAdmin.server.queryUserOnline(relayUrl, relayUserB.userId);
          const relayTargetSession = relayQuery.sessions[0];

          // userA 通过服务器 relay 一条消息到 userB
          const relayPayload = { text: "Hello from userA!", seq: 1 };
          const relaySendResult = await relayUserA.server.relayToUserViaServer(
            relayUrl,
            relayUserB.userId,
            relayTargetSession,
            relayPayload
          );

          // 确认 relay 成功
          const relayOk = relaySendResult?.status === "ok";

          // 管理员查询流量统计
          await new Promise(r => setTimeout(r, 200));
          const relayResult = await relayAdmin.getTrafficStats(relayUrl);

          // 找到 userA 的流量数据，验证 relay_forwarded_bytes > 0
          const relayUserAStats = relayResult?.traffic?.users?.find(u => u.user_id === relayUserA.userId);

          const relayAForwarded = (relayUserAStats?.relay_forwarded_bytes || 0) > 0;
          const relayGlobalForward = (relayResult?.traffic?.global?.relay_forwarded_bytes || 0) > 0;
          const relayGlobalOut = (relayResult?.traffic?.global?.outbound_bytes || 0) > 0;

          const relayAllOk = relayOk && relayAForwarded && relayGlobalForward && relayGlobalOut;

          // 退出登录：断开所有连接
          relayAdmin.server.disconnect(relayUrl);
          relayUserA.server.disconnect(relayUrl);
          relayUserB.server.disconnect(relayUrl);

          return {
            assert: relayAllOk,
            content: {
              message: relayAllOk
                ? `Relay forwarding traffic recorded: userA forwarded=${relayUserAStats?.relay_forwarded_bytes} bytes`
                : "Relay failed or traffic not recorded",
              relaySuccess: relayOk,
              userAStats: relayUserAStats,
              global: relayResult?.traffic?.global,
              sendResult: relaySendResult,
              checks: {
                relayOk,
                relaySendStatus: relaySendResult?.status,
                relayAForwarded,
                relayAForwardedBytes: relayUserAStats?.relay_forwarded_bytes,
                relayGlobalForward,
                relayGlobalForwardBytes: relayResult?.traffic?.global?.relay_forwarded_bytes,
                relayGlobalOut,
                relayGlobalOutBytes: relayResult?.traffic?.global?.outbound_bytes,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Traffic Stats Include Time Distribution">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/local/user.js";

          const tdAdminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const tdAdminNs = "admin-ts-time-ns";
          try { await deleteUser(tdAdminNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(tdAdminNs, tdAdminData.keys);
          await saveUserInfo(tdAdminNs, tdAdminData.info);
          const tdAdmin = new AdminUser(tdAdminNs);
          await tdAdmin.ready();

          const tdUserNs = "ts-time-user-ns";
          const tdUser = new LocalUser(tdUserNs);
          await tdUser.ready();

          const tdUrl = "ws://localhost:8081";
          await tdAdmin.server.connect(tdUrl);
          await tdUser.server.connect(tdUrl);

          // 做一些 relay 操作产生流量
          const tdQuery = await tdAdmin.server.queryUserOnline(tdUrl, tdUser.userId);
          const tdSession = tdQuery.sessions[0];
          await tdAdmin.server.relayToUserViaServer(tdUrl, tdUser.userId, tdSession, { ping: true });

          await new Promise(r => setTimeout(r, 200));
          const tdResult = await tdAdmin.getTrafficStats(tdUrl);
          const tdDist = tdResult?.traffic?.time_distribution || [];

          // 时间分布应该至少有一条记录
          const tdHasDist = tdDist.length > 0;

          // 每条记录应包含必要字段
          const tdBucketsValid = tdDist.every(b =>
            typeof b.minute_epoch === 'number'
            && b.minute_epoch > 0
            && typeof b.inbound_bytes === 'number'
            && typeof b.outbound_bytes === 'number'
          );

          const tdAllOk = tdHasDist && tdBucketsValid;

          // 退出登录：断开连接
          tdAdmin.server.disconnect(tdUrl);
          tdUser.server.disconnect(tdUrl);

          return {
            assert: tdAllOk,
            content: {
              message: tdAllOk
                ? `Time distribution has ${tdDist.length} bucket(s) with valid fields`
                : "Time distribution missing or invalid",
              bucketCount: tdDist.length,
              sample: tdDist.slice(0, 3),
              allValid: tdBucketsValid,
              checks: {
                tdHasDist,
                tdBucketsValid,
                bucketCount: tdDist.length,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Traffic Stats User Detail Correlation">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/local/user.js";

          const corrAdminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const corrAdminNs = "admin-ts-corr-ns";
          try { await deleteUser(corrAdminNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(corrAdminNs, corrAdminData.keys);
          await saveUserInfo(corrAdminNs, corrAdminData.info);
          const corrAdmin = new AdminUser(corrAdminNs);
          await corrAdmin.ready();

          const corrUserNs = "ts-corr-user-ns";
          const corrUser = new LocalUser(corrUserNs);
          await corrUser.ready();

          const corrUrl = "ws://localhost:8081";
          await corrAdmin.server.connect(corrUrl);
          await corrUser.server.connect(corrUrl);

          // 发送多条 relay 消息
          const corrQuery = await corrAdmin.server.queryUserOnline(corrUrl, corrUser.userId);
          const corrSession = corrQuery.sessions[0];

          for (let i = 0; i < 3; i++) {
            await corrAdmin.server.relayToUserViaServer(corrUrl, corrUser.userId, corrSession, { msg: `hello-${i}` });
          }

          await new Promise(r => setTimeout(r, 300));
          const corrResult = await corrAdmin.getTrafficStats(corrUrl);

          // 验证用户级和全局统计的一致性
          const corrGlobal = corrResult?.traffic?.global;
          const corrUsers = corrResult?.traffic?.users || [];

          const corrUserInbound = corrUsers.reduce((s, u) => s + (u.inbound_bytes || 0), 0);
          const corrUserOutbound = corrUsers.reduce((s, u) => s + (u.outbound_bytes || 0), 0);
          const corrUserRelay = corrUsers.reduce((s, u) => s + (u.relay_forwarded_bytes || 0), 0);

          const corrInOK = (corrGlobal?.inbound_bytes || 0) >= corrUserInbound;
          const corrOutOK = (corrGlobal?.outbound_bytes || 0) >= corrUserOutbound;
          const corrRelayOK = (corrGlobal?.relay_forwarded_bytes || 0) >= corrUserRelay;
          const corrConsistent = corrInOK && corrOutOK && corrRelayOK;

          const corrAllSessions = corrUsers.every(u => u.session_count > 0);

          const corrOk = corrConsistent && corrAllSessions;

          // 退出登录：断开连接
          corrAdmin.server.disconnect(corrUrl);
          corrUser.server.disconnect(corrUrl);

          return {
            assert: corrOk,
            content: {
              message: corrOk
                ? "Traffic stats are consistent across global/user levels"
                : "Traffic stats inconsistency detected",
              global: corrGlobal,
              users: corrUsers,
              totals: {
                userInbound: corrUserInbound,
                userOutbound: corrUserOutbound,
                userRelay: corrUserRelay,
              },
              checks: {
                corrInOK,
                corrOutOK,
                corrRelayOK,
                corrConsistent,
                corrAllSessions,
                globalInbound: corrGlobal?.inbound_bytes,
                globalOutbound: corrGlobal?.outbound_bytes,
                globalRelay: corrGlobal?.relay_forwarded_bytes,
                sumUserInbound: corrUserInbound,
                sumUserOutbound: corrUserOutbound,
                sumUserRelay: corrUserRelay,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin Get Traffic History (If Persistence Enabled)">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/local/user.js";

          const histAdminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const histAdminNs = "admin-ts-hist-ns";
          try { await deleteUser(histAdminNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(histAdminNs, histAdminData.keys);
          await saveUserInfo(histAdminNs, histAdminData.info);
          const histAdmin = new AdminUser(histAdminNs);
          await histAdmin.ready();

          const histUserNs = "ts-hist-user-ns";
          const histUser = new LocalUser(histUserNs);
          await histUser.ready();

          const histUrl = "ws://localhost:8081";
          await histAdmin.server.connect(histUrl);
          await histUser.server.connect(histUrl);

          // 产生一些流量
          const histQuery = await histAdmin.server.queryUserOnline(histUrl, histUser.userId);
          const histSession = histQuery.sessions[0];
          await histAdmin.server.relayToUserViaServer(histUrl, histUser.userId, histSession, { test: "history-data" });

          await new Promise(r => setTimeout(r, 300));

          // 查询历史流量（如果配置了持久化）
          const histResult = await histAdmin.getTrafficHistory(histUrl, {
            fromMs: Date.now() - 3600_000,
          });

          const histHasHistory = Array.isArray(histResult?.history);

          // 退出登录：断开连接
          histAdmin.server.disconnect(histUrl);
          histUser.server.disconnect(histUrl);

          // 如果数据库未配置，history 将为空数组
          return {
            assert: histHasHistory,
            content: {
              message: histHasHistory
                ? `Traffic history returned ${histResult.history.length} record(s)`
                : "Traffic history not available (persistence not configured, this is expected)",
              status: histResult.status,
              count: histResult.history?.length || 0,
              records: histResult.history,
              checks: {
                histHasHistory,
                historyExists: Array.isArray(histResult?.history),
                historyLength: histResult?.history?.length,
              },
            },
          };
        </script>
      </template>
    </sb-test>
