  <sb-test name="Connect to Remote User and Send Message Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsA = "connect-user-a";
        const nsB = "connect-user-b";
        const serverUrl1 = "ws://localhost:8081";

        // 创建多个 LocalUser：userA 和 userB（含多个 session）
        const userA = new LocalUser(nsA);
        const userB = new LocalUser(nsB);
        const userB2 = new LocalUser(nsB);
        const userB3 = new LocalUser(nsB);

        await Promise.all([userA.ready(), userB.ready(), userB2.ready(), userB3.ready()]);

        // 所有用户都连接到同一台服务器
        await Promise.all([
          userA.server.connect(serverUrl1),
          userB.server.connect(serverUrl1),
          userB2.server.connect(serverUrl1),
          userB3.server.connect(serverUrl1),
        ]);


        // userA 连接 userB
        const remoteB = await userA.connectUser(userB.userId);

        // 获取 userB 的所有 sessionId 列表（应该包含 userB / userB2 / userB3 的三个 sessionId）
        const sessionIds = await remoteB.getSessionIds();
        const hasB1 = sessionIds.includes(userB.sessionId);
        const hasB2 = sessionIds.includes(userB2.sessionId);
        const hasB3 = sessionIds.includes(userB3.sessionId);
        const countAtLeast3 = sessionIds.length >= 3;

        // userA 通过 remoteB 发送消息给 userB
        let receivedMessage = null;
        userB.bind("message", (event) => {
          const rawData = typeof event.detail.data === "string"
            ? event.detail.data
            : new TextDecoder().decode(event.detail.data);
          try {
            const parsed = JSON.parse(rawData);
            if (parsed.type === "relay" && parsed.from_user_id === userA.userId) {
              receivedMessage = parsed.data;
            }
          } catch {}
        });

        await remoteB.send(userB.sessionId, "hello from A");

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const messageReceived = receivedMessage === "hello from A";

        return {
          assert: hasB1 && hasB2 && hasB3 && countAtLeast3 && messageReceived,
          content: {
            message: "connectUser 测试成功，发现同用户多个 session 并成功发送消息",
            userAId: userA.userId,
            userBId: userB.userId,
            sessionIds,
            expectedSessions: [userB.sessionId, userB2.sessionId, userB3.sessionId],
            sentMessage: "hello from A",
            receivedMessage,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="RemoteUser Message Event Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsC = "connect-user-c";
        const nsD = "connect-user-d";
        const serverUrl2 = "ws://localhost:8081";

        const userC = new LocalUser(nsC);
        const userD = new LocalUser(nsD);

        await Promise.all([userC.ready(), userD.ready()]);

        await Promise.all([
          userC.server.connect(serverUrl2),
          userD.server.connect(serverUrl2),
        ]);

        // userC 连接 userD
        const remoteD = await userC.connectUser(userD.userId);

        // 通过 remoteD 监听来自 userD 的消息
        let remoteMessageDetail = null;
        remoteD.bind("message", (event) => {
          remoteMessageDetail = event.detail;
        });

        // 同时通过 userC 监听所有消息
        let localMessageDetail = null;
        userC.bind("message", (event) => {
          const rawData = typeof event.detail.data === "string"
            ? event.detail.data
            : new TextDecoder().decode(event.detail.data);
          try {
            const parsed = JSON.parse(rawData);
            if (parsed.type === "relay" && parsed.from_user_id === userD.userId) {
              localMessageDetail = {
                fromUserId: parsed.from_user_id,
                fromSessionId: parsed.from_session_id,
                data: parsed.data,
                viaServer: event.detail.url,
              };
            }
          } catch {}
        });

        // userD 发送消息给 userC
        const remoteC = await userD.connectUser(userC.userId);
        await remoteC.send(userC.sessionId, "hello from D");

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const remoteEventReceived =
          remoteMessageDetail !== null &&
          remoteMessageDetail.fromUserId === userD.userId &&
          remoteMessageDetail.data === "hello from D";

        const localEventReceived =
          localMessageDetail !== null &&
          localMessageDetail.fromUserId === userD.userId &&
          localMessageDetail.data === "hello from D";

        return {
          assert: remoteEventReceived && localEventReceived,
          content: {
            message: "RemoteUser message 事件测试成功",
            remoteEventDetail: remoteMessageDetail,
            localEventDetail: localMessageDetail,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Binary Relay Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsE = "connect-user-e";
        const nsF = "connect-user-f";
        const serverUrl3 = "ws://localhost:8081";

        const userE = new LocalUser(nsE);
        const userF = new LocalUser(nsF);

        await Promise.all([userE.ready(), userF.ready()]);

        await Promise.all([
          userE.server.connect(serverUrl3),
          userF.server.connect(serverUrl3),
        ]);

        // userE 连接 userF
        const remoteF = await userE.connectUser(userF.userId);

        // userF 监听收到的二进制消息
        let receivedBinary = null;
        let receivedFromUserId = null;
        let receivedFromSessionId = null;
        userF.bind("message", async (event) => {
          const rawData = event.detail.data;
          // 二进制消息：e.data 为 Blob
          if (rawData instanceof Blob) {
            const buffer = await rawData.arrayBuffer();
            const view = new DataView(buffer);

            // 解析帧：[4 字节 header 长度 u32 BE] + [header JSON] + [payload]
            const headerLen = view.getUint32(0, false);
            const headerBytes = new Uint8Array(buffer, 4, headerLen);
            const header = JSON.parse(new TextDecoder().decode(headerBytes));
            const payload = new Uint8Array(buffer, 4 + headerLen);

            receivedFromUserId = header.from_user_id;
            receivedFromSessionId = header.from_session_id;
            receivedBinary = payload;
          }
        });

        // userE 发送二进制数据给 userF
        const binaryPayload = new Uint8Array([0x00, 0x01, 0x02, 0x66, 0x77, 0x88, 0x99, 0xaa, 0xbb, 0xcc]);
        await remoteF.send(userF.sessionId, binaryPayload);

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const binaryReceived = receivedBinary !== null;
        const payloadMatch =
          binaryReceived &&
          receivedBinary.length === binaryPayload.length &&
          receivedBinary.every((b, i) => b === binaryPayload[i]);
        const fromUserMatch = receivedFromUserId === userE.userId;
        const fromSessionMatch = receivedFromSessionId === userE.sessionId;

        return {
          assert: binaryReceived && payloadMatch && fromUserMatch && fromSessionMatch,
          content: {
            message: "二进制 relay 测试成功",
            expectedPayload: Array.from(binaryPayload),
            receivedPayload: receivedBinary ? Array.from(receivedBinary) : null,
            fromUserId: receivedFromUserId,
            fromSessionId: receivedFromSessionId,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Card Exchange Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsG = "card-user-g";
        const nsH = "card-user-h";
        const serverUrl = "ws://localhost:8081";

        const userG = new LocalUser(nsG);
        const userH = new LocalUser(nsH);

        await Promise.all([userG.ready(), userH.ready()]);

        await Promise.all([
          userG.server.connect(serverUrl),
          userH.server.connect(serverUrl),
        ]);

        // userG 连接 userH
        const remoteH = await userG.connectUser(userH.userId);

        // 清空 userG 本地可能残留的名片（测试独立性）
        const existingCard = await userG.card.get(userH.userId);
        if (existingCard) {
          await userG.card.delete(userH.userId);
        }

        // 监听 card_received 事件
        let cardReceivedEvent = null;
        const unbind = userG.bind("card_received", (event) => {
          cardReceivedEvent = event.detail;
        });


        // userG 向 userH 请求名片
        const card = await userG.card.get(userH.userId);

        // 使用 userH 自身的公钥验证名片签名
        const signatureValid = await userH.verify(card);

        console.log("card:", card);

        // 取消事件监听
        unbind();

        // 验证名片数据完整性
        const hasUserId = card.userId === userH.userId;
        const hasPublicKey = typeof card.publicKey === "string" && card.publicKey.length > 0;
        const hasUsername = typeof card.username === "string" && card.username.length > 0;
        const hasSignTime = typeof card.signTime === "number" && card.signTime > 0;
        const hasSignature = typeof card.signature === "string" && card.signature.length > 0;

        // 验证名片中的公钥与 userH 一致（即确认是 userH 签发的）
        const publicKeyMatch = card.publicKey === userH.publicKey;

        // 验证 card_received 事件已触发
        const eventTriggered = cardReceivedEvent !== null;
        const eventUserIdMatch = cardReceivedEvent && cardReceivedEvent.userId === userH.userId;
        const eventSaved = cardReceivedEvent && cardReceivedEvent.saved === true;

        // 重新从 DB 读取，确认已持久化
        const storedCard = await userG.card.get(userH.userId);
        const storedMatch = storedCard && storedCard.userId === userH.userId;

        // 再次请求应返回本地缓存（不再发起网络请求）
        const cachedCard = await userG.card.get(userH.userId);
        const fromCache = cachedCard.userId === userH.userId;

        // 清理
        await userG.card.delete(userH.userId);

        return {
          assert: hasUserId && hasPublicKey && hasUsername && hasSignTime && hasSignature
            && signatureValid && publicKeyMatch && eventTriggered && eventUserIdMatch && eventSaved
            && storedMatch && fromCache,
          content: {
            message: "名片交换测试成功",
            card: {
              userId: card.userId,
              username: card.username,
              signTime: card.signTime,
              hasPublicKey: hasPublicKey,
              hasSignature: hasSignature,
            },
            signatureValid,
            verification: publicKeyMatch ? "公钥匹配" : "公钥不匹配",
            eventTriggered,
            eventDetail: cardReceivedEvent,
            storedInDb: storedMatch,
            cachedReturned: fromCache,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="E2EE Encrypted Message Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsI = "e2ee-test-i";
        const nsJ = "e2ee-test-j";
        const e2eeUrl = "ws://localhost:8081";

        const userI = new LocalUser(nsI);
        const userJ = new LocalUser(nsJ);

        await Promise.all([userI.ready(), userJ.ready()]);

        await Promise.all([
          userI.server.connect(e2eeUrl),
          userJ.server.connect(e2eeUrl),
        ]);

        // 双向连接，确保双方都能接收加密消息
        const remoteJ = await userI.connectUser(userJ.userId);
        const remoteI = await userJ.connectUser(userI.userId);

        // 清空可能残留的名片，强制触发网络交换
        const existingJ = await userI.card.getByDB(userJ.userId);
        if (existingJ) await userI.card.delete(userJ.userId);
        const existingI = await userJ.card.getByDB(userI.userId);
        if (existingI) await userJ.card.delete(userI.userId);

        // 交换名片（双方都要持有对方公钥才能 E2EE）
        const cardJ = await userI.card.get(userJ.userId);
        const cardI = await userJ.card.get(userI.userId);
        const haveBothCards = cardJ !== null && cardI !== null;
        const haveBothKeys = !!(await userI.card.getByDB(userJ.userId))?.publicKey
          && !!(await userJ.card.getByDB(userI.userId))?.publicKey;

        // 监听 userJ 侧原始消息：检查是否为二进制帧（证明加密）
        let rawIsBinary = false;
        const unbindRaw = userJ.bind("message", (event) => {
          if (event.detail.data instanceof Blob) {
            rawIsBinary = true;
          }
        });

        // 监听解密后的消息到达
        let receivedData = null;
        const messagePromise = new Promise((resolve) => {
          remoteI.bind("message", (event) => {
            receivedData = event.detail.data;
            resolve();
          });
        });

        // userI 发送一个纯对象（触发 E2EE 加密路径）
        const sentData = { text: "hello encrypted", num: 42 };
        await remoteJ.send(userJ.sessionId, sentData);

        // 等待解密后的消息到达或超时
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Timeout")), 3000)
        );
        await Promise.race([messagePromise, timeout]);

        unbindRaw();

        const messageCorrect =
          receivedData !== null &&
          typeof receivedData === "object" &&
          receivedData.text === "hello encrypted" &&
          receivedData.num === 42;

        return {
          assert: haveBothCards && haveBothKeys && rawIsBinary && messageCorrect,
          content: {
            message: messageCorrect
              ? "E2EE 加密测试成功：原始 relay 为二进制帧，解密后内容正确"
              : "E2EE 加密测试失败",
            haveBothCards,
            haveBothKeys,
            rawIsBinary,
            sentData,
            receivedData,
          },
        };
      </script>
    </template>
  </sb-test>
</body>
