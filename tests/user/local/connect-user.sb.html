  <h1>Connect User Tests</h1>

  <sb-test name="Connect to Remote User and Send Message Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsA = "connect-user-a";
        const nsB = "connect-user-b";
        const serverUrl1 = "ws://localhost:8081";

        // 创建多个 LocalUser：userA 和 userB（含多个 session）
        const userA = new LocalUser(nsA);
        const userB = new LocalUser(nsB);
        const userB2 = new LocalUser(nsB);
        const userB3 = new LocalUser(nsB);

        await Promise.all([userA.ready(), userB.ready(), userB2.ready(), userB3.ready()]);

        // 所有用户都连接到同一台服务器
        await Promise.all([
          userA.server.connect(serverUrl1),
          userB.server.connect(serverUrl1),
          userB2.server.connect(serverUrl1),
          userB3.server.connect(serverUrl1),
        ]);

        // userA 连接 userB（使用纯服务端转发模式，不发起 WebRTC）
        const remoteB = await userA.connectUser(userB.userId, { mode: "relay" });

        // 获取 userB 的所有 sessionId 列表（应该包含 userB / userB2 / userB3 的三个 sessionId）
        const sessionIds = await remoteB.getSessionIds();
        const hasB1 = sessionIds.includes(userB.sessionId);
        const hasB2 = sessionIds.includes(userB2.sessionId);
        const hasB3 = sessionIds.includes(userB3.sessionId);
        const countAtLeast3 = sessionIds.length >= 3;

        // userA 通过 remoteB 发送消息给 userB
        let receivedMessage = null;
        userB.bind("message", (event) => {
          const rawData = typeof event.detail.data === "string"
            ? event.detail.data
            : new TextDecoder().decode(event.detail.data);
          try {
            const parsed = JSON.parse(rawData);
            if (parsed.type === "relay" && parsed.from_user_id === userA.userId) {
              receivedMessage = parsed.data;
            }
          } catch {}
        });

        await remoteB.send(userB.sessionId, "hello from A");

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const messageReceived = receivedMessage === "hello from A";

        return {
          assert: hasB1 && hasB2 && hasB3 && countAtLeast3 && messageReceived,
          content: {
            message: "connectUser 测试成功，发现同用户多个 session 并成功发送消息",
            userAId: userA.userId,
            userBId: userB.userId,
            sessionIds,
            expectedSessions: [userB.sessionId, userB2.sessionId, userB3.sessionId],
            sentMessage: "hello from A",
            receivedMessage,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="RemoteUser Message Event Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsC = "connect-user-c";
        const nsD = "connect-user-d";
        const serverUrl2 = "ws://localhost:8081";

        const userC = new LocalUser(nsC);
        const userD = new LocalUser(nsD);

        await Promise.all([userC.ready(), userD.ready()]);

        await Promise.all([
          userC.server.connect(serverUrl2),
          userD.server.connect(serverUrl2),
        ]);

        // userC 连接 userD（使用纯服务端转发模式，不发起 WebRTC）
        const remoteD = await userC.connectUser(userD.userId, { mode: "relay" });

        // 通过 remoteD 监听来自 userD 的消息
        let remoteMessageDetail = null;
        remoteD.bind("message", (event) => {
          remoteMessageDetail = event.detail;
        });

        // 同时通过 userC 监听所有消息
        let localMessageDetail = null;
        userC.bind("message", (event) => {
          const rawData = typeof event.detail.data === "string"
            ? event.detail.data
            : new TextDecoder().decode(event.detail.data);
          try {
            const parsed = JSON.parse(rawData);
            if (parsed.type === "relay" && parsed.from_user_id === userD.userId) {
              localMessageDetail = {
                fromUserId: parsed.from_user_id,
                fromSessionId: parsed.from_session_id,
                data: parsed.data,
                viaServer: event.detail.url,
              };
            }
          } catch {}
        });

        // userD 发送消息给 userC（使用纯服务端转发模式，不发起 WebRTC）
        const remoteC = await userD.connectUser(userC.userId, { mode: "relay" });
        await remoteC.send(userC.sessionId, "hello from D");

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const remoteEventReceived =
          remoteMessageDetail !== null &&
          remoteMessageDetail.fromUserId === userD.userId &&
          remoteMessageDetail.data === "hello from D";

        const localEventReceived =
          localMessageDetail !== null &&
          localMessageDetail.fromUserId === userD.userId &&
          localMessageDetail.data === "hello from D";

        return {
          assert: remoteEventReceived && localEventReceived,
          content: {
            message: "RemoteUser message 事件测试成功",
            remoteEventDetail: remoteMessageDetail,
            localEventDetail: localMessageDetail,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Binary Relay Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsE = "connect-user-e";
        const nsF = "connect-user-f";
        const serverUrl3 = "ws://localhost:8081";

        const userE = new LocalUser(nsE);
        const userF = new LocalUser(nsF);

        await Promise.all([userE.ready(), userF.ready()]);

        await Promise.all([
          userE.server.connect(serverUrl3),
          userF.server.connect(serverUrl3),
        ]);

        // userE 连接 userF
        const remoteF = await userE.connectUser(userF.userId);

        // userF 监听收到的二进制消息
        let receivedBinary = null;
        let receivedFromUserId = null;
        let receivedFromSessionId = null;
        userF.bind("message", async (event) => {
          const rawData = event.detail.data;
          // 二进制消息：e.data 为 Blob
          if (rawData instanceof Blob) {
            const buffer = await rawData.arrayBuffer();
            const view = new DataView(buffer);

            // 解析帧：[4 字节 header 长度 u32 BE] + [header JSON] + [payload]
            const headerLen = view.getUint32(0, false);
            const headerBytes = new Uint8Array(buffer, 4, headerLen);
            const header = JSON.parse(new TextDecoder().decode(headerBytes));
            const payload = new Uint8Array(buffer, 4 + headerLen);

            receivedFromUserId = header.from_user_id;
            receivedFromSessionId = header.from_session_id;
            receivedBinary = payload;
          }
        });

        // userE 发送二进制数据给 userF
        const binaryPayload = new Uint8Array([0x00, 0x01, 0x02, 0x66, 0x77, 0x88, 0x99, 0xaa, 0xbb, 0xcc]);
        await remoteF.send(userF.sessionId, binaryPayload);

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 500));

        const binaryReceived = receivedBinary !== null;
        const payloadMatch =
          binaryReceived &&
          receivedBinary.length === binaryPayload.length &&
          receivedBinary.every((b, i) => b === binaryPayload[i]);
        const fromUserMatch = receivedFromUserId === userE.userId;
        const fromSessionMatch = receivedFromSessionId === userE.sessionId;

        return {
          assert: binaryReceived && payloadMatch && fromUserMatch && fromSessionMatch,
          content: {
            message: "二进制 relay 测试成功",
            expectedPayload: Array.from(binaryPayload),
            receivedPayload: receivedBinary ? Array.from(receivedBinary) : null,
            fromUserId: receivedFromUserId,
            fromSessionId: receivedFromSessionId,
          },
        };
      </script>
    </template>
  </sb-test>
  <sb-test name="WebRTC Direct Communication Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsWrA = "webrtc-test-a";
        const nsWrB = "webrtc-test-b";
        const serverUrlWr = "ws://localhost:8081";

        const wrUserA = new LocalUser(nsWrA);
        const wrUserB = new LocalUser(nsWrB);

        await Promise.all([wrUserA.ready(), wrUserB.ready()]);

        await Promise.all([
          wrUserA.server.connect(serverUrlWr),
          wrUserB.server.connect(serverUrlWr),
        ]);

        // userA 连接 userB（作为 initiator 发起 WebRTC）
        const wrRemoteB = await wrUserA.connectUser(wrUserB.userId);

        // 等待 WebRTC 连接建立（最多 15 秒）
        let webrtcConnected = false;
        const webrtcConnectPromise = new Promise((resolve) => {
          wrRemoteB.bind("webrtc_state", (event) => {
            if (event.detail.state === "connected") {
              webrtcConnected = true;
              resolve();
            }
          });
        });

        await Promise.race([
          webrtcConnectPromise,
          new Promise((resolve) => setTimeout(resolve, 15000)),
        ]);

        // 获取 userB 端自动创建的 RemoteUser(A)（通过 connectUser 复用缓存）
        const wrRemoteA = await wrUserB.connectUser(wrUserA.userId);

        // 监听 userB 端 RemoteUser(A) 的 message 事件
        let wrReceivedMessage = null;
        let wrReceivedDetail = null;
        wrRemoteA.bind("message", (event) => {
          wrReceivedDetail = event.detail;
          wrReceivedMessage = event.detail.data;
        });

        // 通过 WebRTC DataChannel 发送消息
        const wrSendResult = await wrRemoteB.send(
          wrUserB.sessionId,
          "hello via webrtc",
        );

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 1000));

        const wrMessageReceived = wrReceivedMessage === "hello via webrtc";
        const wrSentViaWebrtc = wrSendResult && wrSendResult.via === "webrtc";
        const wrFromUserMatch =
          wrReceivedDetail && wrReceivedDetail.fromUserId === wrUserA.userId;

        return {
          assert: webrtcConnected && wrSentViaWebrtc && wrMessageReceived && wrFromUserMatch,
          content: {
            message: "WebRTC 直接通信测试成功，send() 走 DataChannel",
            webrtcConnected,
            sentViaWebrtc: wrSentViaWebrtc,
            messageReceived: wrMessageReceived,
            fromUserMatch: wrFromUserMatch,
            sendResult: wrSendResult,
            receivedDetail: wrReceivedDetail,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="WebRTC Not Established - Relay Fallback Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsRlyA = "webrtc-relay-a";
        const nsRlyB = "webrtc-relay-b";
        const serverUrlRly = "ws://localhost:8081";

        const rlyUserA = new LocalUser(nsRlyA);
        const rlyUserB = new LocalUser(nsRlyB);

        await Promise.all([rlyUserA.ready(), rlyUserB.ready()]);

        await Promise.all([
          rlyUserA.server.connect(serverUrlRly),
          rlyUserB.server.connect(serverUrlRly),
        ]);

        // userA 连接 userB（发起 WebRTC，但立即发送消息，此时 WebRTC 尚未建立）
        const rlyRemoteB = await rlyUserA.connectUser(rlyUserB.userId);

        // 立即发送消息（WebRTC 尚未建立，应走 relay）
        let rlyReceivedMessage = null;
        rlyUserB.bind("message", (event) => {
          const rawData =
            typeof event.detail.data === "string"
              ? event.detail.data
              : new TextDecoder().decode(event.detail.data);
          try {
            const parsed = JSON.parse(rawData);
            if (
              parsed.type === "relay" &&
              parsed.from_user_id === rlyUserA.userId &&
              parsed.data !== "__webrtc" &&
              (typeof parsed.data !== "object" || parsed.data.type !== "__webrtc")
            ) {
              rlyReceivedMessage = parsed.data;
            }
          } catch {}
        });

        const rlySendResult = await rlyRemoteB.send(
          rlyUserB.sessionId,
          "hello via relay (before webrtc)",
        );

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 1000));

        const rlyMessageReceived =
          rlyReceivedMessage === "hello via relay (before webrtc)";
        // send() 在 WebRTC 未建立时应走 relay，返回 relay_response
        const rlySentViaRelay =
          rlySendResult &&
          (rlySendResult.via !== "webrtc") &&
          (rlySendResult.type === "relay_response" || rlySendResult.status === "ok");

        return {
          assert: rlyMessageReceived && rlySentViaRelay,
          content: {
            message: "WebRTC 建立前 send() 通过服务端 relay 通信成功",
            messageReceived: rlyMessageReceived,
            sentViaRelay: rlySentViaRelay,
            sendResult: rlySendResult,
            receivedMessage: rlyReceivedMessage,
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="WebRTC Message Event Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/local/user.js";

        const nsEvtA = "webrtc-evt-a";
        const nsEvtB = "webrtc-evt-b";
        const serverUrlEvt = "ws://localhost:8081";

        const evtUserA = new LocalUser(nsEvtA);
        const evtUserB = new LocalUser(nsEvtB);

        await Promise.all([evtUserA.ready(), evtUserB.ready()]);

        await Promise.all([
          evtUserA.server.connect(serverUrlEvt),
          evtUserB.server.connect(serverUrlEvt),
        ]);

        // userA 连接 userB
        const evtRemoteB = await evtUserA.connectUser(evtUserB.userId);

        // 等待 WebRTC 建立
        const evtConnectPromise = new Promise((resolve) => {
          evtRemoteB.bind("webrtc_state", (event) => {
            if (event.detail.state === "connected") {
              resolve();
            }
          });
        });

        await Promise.race([
          evtConnectPromise,
          new Promise((resolve) => setTimeout(resolve, 15000)),
        ]);

        // 获取 userB 端的 RemoteUser(A)
        const evtRemoteA = await evtUserB.connectUser(evtUserA.userId);

        // 监听 RemoteUser message 事件（P2P 消息）
        let evtP2PMessage = null;
        let evtP2PDetail = null;
        evtRemoteA.bind("message", (event) => {
          evtP2PDetail = event.detail;
          evtP2PMessage = event.detail.data;
        });

        // 通过 WebRTC 发送
        await evtRemoteB.send(evtUserB.sessionId, "p2p message event");

        // 等待消息到达
        await new Promise((resolve) => setTimeout(resolve, 1000));

        const p2pEventReceived =
          evtP2PMessage === "p2p message event" &&
          evtP2PDetail !== null &&
          evtP2PDetail.fromUserId === evtUserA.userId &&
          evtP2PDetail.fromSessionId === evtUserA.sessionId;

        // 同时验证 relay 消息也能触发 message 事件
        // userB 通过 RemoteUser(A) 发送消息给 userA（如果 WebRTC 已建立则走 P2P，否则走 relay）
        let evtReverseMessage = null;
        evtRemoteB.bind("message", (event) => {
          evtReverseMessage = event.detail.data;
        });

        await evtRemoteA.send(evtUserA.sessionId, "reverse message");
        await new Promise((resolve) => setTimeout(resolve, 1000));

        const reverseEventReceived = evtReverseMessage === "reverse message";

        return {
          assert: p2pEventReceived && reverseEventReceived,
          content: {
            message: "WebRTC message 事件测试成功（P2P 和反向通信均触发 message 事件）",
            p2pEventReceived,
            reverseEventReceived,
            p2pDetail: evtP2PDetail,
          },
        };
      </script>
    </template>
  </sb-test>
</body>
