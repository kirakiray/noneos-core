  <body>
    <h1>Connect Session Tests</h1>

    <sb-test name="Per-Server Session Left Event Test">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/user.js";

          const psNsA = "srv-left-a";
          const psNsB = "srv-left-b";
          const psServerUrl = "ws://localhost:8081";

          const psUserA = new LocalUser(psNsA);
          const psUserB = new LocalUser(psNsB);

          await Promise.all([psUserA.ready(), psUserB.ready()]);

          await Promise.all([
            psUserA.server.connect(psServerUrl),
            psUserB.server.connect(psServerUrl),
          ]);

          // psUserA 连接 psUserB（自动 watch）
          await psUserA.connectUser(psUserB.userId);

          // 监听 session_server_left 事件（per-server，聚合前触发）
          const leftPms = new Promise((resolve, reject) => {
            psUserA.bind("session_server_left", (event) => {
              resolve(event.detail);
            });

            setTimeout(() => {
              reject("session_server_left 事件未触发");
            }, 10000);
          });

          // 断开 psUserB 的所有服务器连接
          psUserB.server.disconnectAll();

          // 等待 session_server_left 事件触发
          const psServerLeftEvent = await leftPms;

          const psEventReceived = psServerLeftEvent !== null;
          const psUrlMatch = psServerLeftEvent?.url === psServerUrl;
          const psUserIdMatch = psServerLeftEvent?.userId === psUserB.userId;
          const psSessionIdMatch =
            psServerLeftEvent?.sessionId === psUserB.sessionId;
          const psAllPassed =
            psEventReceived && psUrlMatch && psUserIdMatch && psSessionIdMatch;

          psUserA.server.disconnectAll();

          return {
            assert: psAllPassed,
            content: {
              message: psAllPassed
                ? "Per-server session_server_left 事件测试成功"
                : "Per-server session_server_left 事件测试失败",
              userAId: psUserA.userId,
              userBId: psUserB.userId,
              serverLeftEvent: psServerLeftEvent,
              checks: {
                eventReceived: psEventReceived,
                urlMatch: psUrlMatch,
                userIdMatch: psUserIdMatch,
                sessionIdMatch: psSessionIdMatch,
                expectedUrl: psServerUrl,
                actualUrl: psServerLeftEvent?.url,
                expectedUserId: psUserB.userId,
                actualUserId: psServerLeftEvent?.userId,
                expectedSessionId: psUserB.sessionId,
                actualSessionId: psServerLeftEvent?.sessionId,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Session Left Notification Test">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";

        const nsK = "session-left-k";
        const nsL = "session-left-l";
        const slUrl = "ws://localhost:8081";

        const userK = new LocalUser(nsK);
        const userL = new LocalUser(nsL);

        await Promise.all([userK.ready(), userL.ready()]);

        await Promise.all([
          userK.server.connect(slUrl),
          userL.server.connect(slUrl),
        ]);

        // userK 连接 userL（自动 watch）
        const remoteL = await userK.connectUser(userL.userId);

        // 监听 session_left 事件
        let sessionLeftEvent = null;
        remoteL.bind("session_left", (event) => {
          sessionLeftEvent = event.detail;
        });

        // 断开 userL 的 WebSocket，模拟 session 下线
        // 通过关闭 userL 的所有服务器连接实现
        userL.server.disconnectAll();

        // 等待 session_left 事件触发（聚合检测需要时间）
        for (let i = 0; i < 30; i++) {
          if (sessionLeftEvent !== null) break;
          await new Promise((resolve) => setTimeout(resolve, 200));
        }

        const eventReceived = sessionLeftEvent !== null;
        const sessionIdMatch = sessionLeftEvent?.sessionId === userL.sessionId;
        const allPassed = eventReceived && sessionIdMatch;

        userK.server.disconnectAll();

        return {
          assert: allPassed,
          content: {
            message: allPassed
              ? "Session left 通知测试成功"
              : "Session left 通知测试失败",
            userKId: userK.userId,
            userLId: userL.userId,
            userLSessionId: userL.sessionId,
            sessionLeftEvent,
            // 错误诊断字段
            checks: {
              eventReceived,
              eventNotNull: sessionLeftEvent !== null,
              sessionIdMatch,
              expectedSessionId: userL.sessionId,
              actualSessionId: sessionLeftEvent?.sessionId,
              remoteUserId: remoteL.userId,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="Partial Server Disconnect Should NOT Trigger Session Left">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";

        const nsM = "partial-srv-m";
        const nsN = "partial-srv-n";
        const srv1 = "ws://localhost:8081";
        const srv2 = "ws://localhost:8082";

        const userM = new LocalUser(nsM);
        const userN = new LocalUser(nsN);

        await Promise.all([userM.ready(), userN.ready()]);

        // 都连接到两台服务器
        await Promise.all([
          userM.server.connect(srv1),
          userM.server.connect(srv2),
          userN.server.connect(srv1),
          userN.server.connect(srv2),
        ]);

        // userM 连接 userN（自动 watch 两台服务器）
        const remoteN = await userM.connectUser(userN.userId);

        // 监听 session_left 事件，不应触发
        let partialSrvTriggered = false;
        let partialSrvDetail = null;
        remoteN.bind("session_left", (event) => {
          partialSrvTriggered = true;
          partialSrvDetail = event.detail;
        });

        // 只断开 userN 在一台服务器上的连接（8081）
        userN.server.disconnect(srv1);

        // 等待一段时间，确保不会触发 session_left
        for (let i = 0; i < 15; i++) {
          if (partialSrvTriggered) break;
          await new Promise((resolve) => setTimeout(resolve, 200));
        }

        // 清理：断开另一台服务器的连接，这样不会影响后续测试
        userN.server.disconnectAll();
        userM.server.disconnectAll();

        const partialAllPassed = !partialSrvTriggered;

        return {
          assert: partialAllPassed,
          content: {
            message: partialAllPassed
              ? "部分服务器断开未错误触发 session_left，测试通过"
              : "部分服务器断开错误触发了 session_left，测试失败",
            sessionLeftTriggered: partialSrvTriggered,
            sessionLeftDetail: partialSrvDetail,
            userMId: userM.userId,
            userNId: userN.userId,
            checks: {
              sessionLeftTriggered: partialSrvTriggered,
              sessionLeftDetail: partialSrvDetail,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <sb-test name="RTC Connected Then All Servers Down Should NOT Trigger Session Left">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";

        const nsO = "rtc-survive-o";
        const nsP = "rtc-survive-p";
        const rtcSrv1 = "ws://localhost:8081";
        const rtcSrv2 = "ws://localhost:8082";

        const userO = new LocalUser(nsO);
        const userP = new LocalUser(nsP);

        await Promise.all([userO.ready(), userP.ready()]);

        // 都连接到两台服务器
        await Promise.all([
          userO.server.connect(rtcSrv1),
          userO.server.connect(rtcSrv2),
          userP.server.connect(rtcSrv1),
          userP.server.connect(rtcSrv2),
        ]);

        // 双向连接
        const remoteP = await userO.connectUser(userP.userId);
        const remoteO = await userP.connectUser(userO.userId);

        // 通过多次 send 触发后台 RTC 连接（第二次 send 起触发 RTC 配对）
        // CI 上的 WebRTC 配对较慢，需要更多触发次数和等待时间
        for (let i = 0; i < 8; i++) {
          try {
            await remoteP.send(userP.sessionId, { ping: i });
          } catch {}
          await new Promise((resolve) => setTimeout(resolve, 500));
        }

        // 等待 RTC 建立（CI 上 WebRTC 可能较慢）
        let rtcConnected = false;
        for (let i = 0; i < 40; i++) {
          const dc = userO.rtc.getChannel(userP.userId, userP.sessionId);
          if (dc && dc.readyState === "open") {
            rtcConnected = true;
            break;
          }
          await new Promise((resolve) => setTimeout(resolve, 200));
        }

        // 监听 session_left 事件，不应触发
        let rtcLeftTriggered = false;
        let rtcLeftDetail = null;
        remoteP.bind("session_left", (event) => {
          rtcLeftTriggered = true;
          rtcLeftDetail = event.detail;
        });

        // 断开 userP 的所有服务器连接
        userP.server.disconnectAll();

        // 等待一段时间，确保不会触发 session_left
        for (let i = 0; i < 15; i++) {
          if (rtcLeftTriggered) break;
          await new Promise((resolve) => setTimeout(resolve, 200));
        }

        // 清理
        userO.server.disconnectAll();

        const rtcEstablished = rtcConnected;
        const rtcAllPassed = rtcEstablished && !rtcLeftTriggered;

        return {
          assert: rtcAllPassed,
          content: {
            message: rtcAllPassed
              ? "RTC 连接后断开所有服务器，未错误触发 session_left，测试通过"
              : rtcConnected
                ? "RTC 已建立但错误触发了 session_left，测试失败"
                : "RTC 未能在超时内建立连接，测试无效",
            rtcConnected,
            sessionLeftTriggered: rtcLeftTriggered,
            sessionLeftDetail: rtcLeftDetail,
            userOId: userO.userId,
            userPId: userP.userId,
            checks: {
              rtcConnected,
              sessionLeftTriggered: rtcLeftTriggered,
              sessionLeftDetail: rtcLeftDetail,
            },
          },
        };
      </script>
    </template>
  </sb-test>
  </body>
