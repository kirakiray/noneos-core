    <!-- ============================================================ -->
    <!-- Admin 使用说明                                               -->
    <!-- ============================================================ -->
    <!--
    Admin（管理员）功能用于管理 WebSocket 服务器上的已连接用户。

    ## 1. 配置管理员

    在自己的用户空间中获取 userId，将其拷贝到服务器配置中：

        port = 8081
        host = "localhost"
        admin_user_id = "你的 userId"

    只有 userId 匹配该值的用户在握手后会被标记为 is_admin = true。

    ## 2. Admin 命令

    管理员可以发送以下 JSON 命令：

    ### 2.1 list_users - 列出已连接用户（支持分页）

    发送：
        { "type": "admin", "action": "list_users" }
        // 可选分页参数（默认 page=1, page_size=20）：
        { "type": "admin", "action": "list_users", "page": 1, "page_size": 20 }

    响应：
        {
          "type": "admin_response",
          "action": "list_users",
          "status": "ok",
          "message": "3 user(s) connected",
          "users": [
            { "userId": "...", "sessionId": "s-...", "username": "...", "addr": "localhost:54321" },
            ...
          ],
          "total": 3,        // 总用户数（分页用）
          "page": 1,         // 当前页码
          "page_size": 20    // 每页数量
        }

    ### 2.2 disconnect_user - 断开指定用户的连接

    发送：
        { "type": "admin", "action": "disconnect_user", "user_id": "<target_userId>" }

    响应：
        {
          "type": "admin_response",
          "action": "disconnect_user",
          "status": "ok",
          "message": "User <userId> disconnected (1 session(s))"
        }

    ## 3. 非管理员权限限制

    普通用户（is_admin = false）发送 admin 命令会收到：
        {
          "type": "admin_response",
          "action": "list_users",
          "status": "error",
          "message": "Permission denied: not an admin"
        }
    -->

    <sb-test name="Import Admin User from admin.json">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { deleteUser } from "/nos/user/main.js";

          const adminData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminImportNs = "admin-test-ns";

          // 前置清理
          try {
            await deleteUser(adminImportNs, { skipConfirm: true });
          } catch (e) { /* 不存在则忽略 */ }

          // 直接写入数据库
          await saveUserKeys(adminImportNs, adminData.keys);
          await saveUserInfo(adminImportNs, adminData.info);

          // 创建 AdminUser 实例
          const adminImportedUser = new AdminUser(adminImportNs);
          await adminImportedUser.ready();
          const adminImportedInfo = await adminImportedUser.getInfo();

          const isUserIdMatch = adminImportedUser.userId === adminData.info.userId;
          const isUsernameMatch = adminImportedInfo.username === adminData.info.username;

          adminImportedUser.server.disconnectAll();

          return {
            assert: isUserIdMatch && isUsernameMatch,
            content: {
              message: isUserIdMatch && isUsernameMatch ? "Admin user imported successfully" : "Import failed",
              importedUserId: adminImportedUser.userId,
              expectedUserId: adminData.info.userId,
              importedUsername: adminImportedInfo.username,
              expectedUsername: adminData.info.username,
              checks: {
                isUserIdMatch,
                isUsernameMatch,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin Connect Identity Verification">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";

          const adminData2 = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminConNs = "admin-connect-ns";

          try {
            await deleteUser(adminConNs, { skipConfirm: true });
          } catch (e) { /* ignore */ }

          await saveUserKeys(adminConNs, adminData2.keys);
          await saveUserInfo(adminConNs, adminData2.info);

          const adminConUser = new AdminUser(adminConNs);
          await adminConUser.ready();

          const adminConUrl = "ws://localhost:8081";

          // 通过成功执行管理员命令来验证管理员身份
          let listResult;
          let listError;
          try {
            listResult = await adminConUser.listUsers(adminConUrl, { pageSize: 100 });
          } catch (e) {
            listError = e;
          }

          const isAdminAuth = listResult?.status === "ok" && Array.isArray(listResult?.users);

          // 退出登录：断开服务器连接
          adminConUser.server.disconnectAll();

          return {
            assert: isAdminAuth,
            content: {
              message: isAdminAuth ? "Admin user verified via list_users command" : "Admin verification failed",
              listResponse: listResult,
              error: listError?.message,
              checks: {
                isAdminAuth,
                listStatusOk: listResult?.status === "ok",
                hasUsersArray: Array.isArray(listResult?.users),
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin List Connected Users">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";

          const adminData3 = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminListNs = "admin-list-ns";

          try {
            await deleteUser(adminListNs, { skipConfirm: true });
          } catch (e) { /* ignore */ }

          await saveUserKeys(adminListNs, adminData3.keys);
          await saveUserInfo(adminListNs, adminData3.info);

          const adminListUser = new AdminUser(adminListNs);
          await adminListUser.ready();

          const adminListUrl = "ws://localhost:8081";

          const adminListResponse = await adminListUser.listUsers(adminListUrl, { pageSize: 100 });
          // 也测试显式指定分页参数
          const adminListResponse2 = await adminListUser.listUsers(adminListUrl, { page: 1, pageSize: 10 });

          const isListOK = adminListResponse && adminListResponse.status === "ok";
          const hasUsers = isListOK && Array.isArray(adminListResponse.users) && adminListResponse.users.length > 0;
          const selfInList = hasUsers && adminListResponse.users.some(
            u => u.userId === adminListUser.userId
          );

          // 验证分页字段
          const hasPaginationFields = adminListResponse.total != null
            && adminListResponse.page === 1
            && adminListResponse.page_size === 100;
          // 带分页参数的响应也正确
          const paginationWithParamsOK = adminListResponse2?.page === 1
            && adminListResponse2?.page_size === 10;

          // 退出登录：断开服务器连接
          adminListUser.server.disconnectAll();

          return {
            assert: isListOK && selfInList && hasPaginationFields && paginationWithParamsOK,
            content: {
              message: selfInList
                ? `Admin listed ${adminListResponse.users.length} user(s) (total ${adminListResponse.total}), pagination verified`
                : "list_users failed",
              status: adminListResponse?.status,
              userCount: adminListResponse?.users?.length,
              totalUsers: adminListResponse?.total,
              page: adminListResponse?.page,
              pageSize: adminListResponse?.page_size,
              paginationWithParamsOK,
              users: adminListResponse?.users,
              responseMessage: adminListResponse?.message,
              checks: {
                isListOK,
                hasUsers,
                selfInList,
                hasPaginationFields,
                paginationWithParamsOK,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Non-Admin Connect Identity Verification">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/user.js";

          const normNs = "norm-connect-ns";
          const normUser = new LocalUser(normNs);

          await normUser.ready();

          const normUrl = "ws://localhost:8081";
          let normHandshake = null;

          const normPromise = new Promise((resolve) => {
            const ws = new WebSocket(normUrl);
            let pendingSend = null;
            let hasResolved = false;

            const safeResolve = (value) => {
              if (!hasResolved) {
                hasResolved = true;
                resolve(value);
              }
            };

            ws.onopen = () => {
              if (pendingSend !== null) {
                ws.send(pendingSend);
                pendingSend = null;
              }
            };

            ws.onmessage = async (e) => {
              const data = JSON.parse(e.data);
              if (data.type === "handshake_challenge") {
                const normInfo = await normUser.getInfo();
                const response = await normUser._sign({
                  type: "handshake_response",
                  challenge: data.challenge,
                  userId: normUser.userId,
                  sessionId: normUser.sessionId,
                  username: normInfo.username,
                });
                const payload = JSON.stringify(response);
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(payload);
                } else {
                  pendingSend = payload;
                }
                return;
              }
              if (data.type === "handshake") {
                normHandshake = data;
                ws.close();
                safeResolve(data);
              }
            };

            ws.onclose = () => {
              if (!normHandshake) {
                safeResolve({ status: "error", message: "Connection closed" });
              }
            };

            ws.onerror = () => {
              setTimeout(() => {
                if (!hasResolved) {
                  safeResolve({ status: "error", message: "WebSocket error" });
                }
              }, 300);
            };

            setTimeout(() => {
              ws.close();
              safeResolve({ status: "error", message: "timeout" });
            }, 5000);
          });

          await normPromise;

          const isNormAuth = normHandshake.status === "success" && normHandshake.is_admin === false;

          return {
            assert: isNormAuth,
            content: {
              message: isNormAuth ? "Non-admin user authenticated with is_admin=false" : "Non-admin auth unexpected result",
              status: normHandshake.status,
              is_admin: normHandshake.is_admin,
              handshakeMessage: normHandshake.message,
              checks: {
                isNormAuth,
                handshakeSuccess: normHandshake?.status === "success",
                isAdminFalse: normHandshake?.is_admin === false,
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Non-Admin Permission Denied for Admin Commands">
      <template>
        <script type="module">
          import { LocalUser } from "/nos/user/user.js";

          const norm2Ns = "norm-deny-ns";
          const norm2User = new LocalUser(norm2Ns);

          await norm2User.ready();

          const norm2Url = "ws://localhost:8081";

          // 使用 server.connect 建立连接
          await norm2User.server.connect(norm2Url);

          // 发送 admin 命令，验证被拒绝
          const norm2AdminResp = await new Promise((resolve) => {
            const handler = (e) => {
              let data;
              try {
                data = typeof e.detail.data === "string" ? JSON.parse(e.detail.data) : e.detail.data;
              } catch { return; }
              if (data?.type === "admin_response") {
                cancel();
                resolve(data);
              }
            };
            const cancel = norm2User.bind("message", handler);
            norm2User.server.sendToServer(norm2Url, JSON.stringify({ type: "admin", action: "list_users" }));

            setTimeout(() => {
              cancel();
              resolve({ status: "error", message: "timeout" });
            }, 5000);
          });

          const isDenied = norm2AdminResp?.status === "error"
            && norm2AdminResp?.message?.includes("Permission denied");

          // 退出登录：断开连接
          norm2User.server.disconnectAll();

          return {
            assert: isDenied,
            content: {
              message: isDenied ? "Non-admin correctly denied permission" : "Permission check failed",
              response: norm2AdminResp,
              checks: {
                isDenied,
                responseStatusError: norm2AdminResp?.status === "error",
                messageIncludesPermissionDenied: norm2AdminResp?.message?.includes("Permission denied"),
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin Disconnect Regular User">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/user.js";

          // 准备管理员用户
          const adminData6 = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminDiscNs = "admin-disc-ns";

          try {
            await deleteUser(adminDiscNs, { skipConfirm: true });
          } catch (e) { /* ignore */ }

          await saveUserKeys(adminDiscNs, adminData6.keys);
          await saveUserInfo(adminDiscNs, adminData6.info);

          const adminDiscUser = new AdminUser(adminDiscNs);
          await adminDiscUser.ready();

          // 准备普通用户
          const victimNs = "victim-disc-ns";
          const victimUser = new LocalUser(victimNs);
          await victimUser.ready();

          const discUrl = "ws://localhost:8081";

          // 先连接普通用户（使用 server.connect 建立连接）
          let victimClosed = false;

          await victimUser.server.connect(discUrl);
          victimUser.addEventListener("close", () => { victimClosed = true; });

          // 管理员发送 disconnect 命令
          const adminDiscResult = await adminDiscUser.disconnectUser(discUrl, victimUser.userId);

          // 轮询等待 victim 收到 close 事件
          for (let i = 0; i < 10; i++) {
            if (victimClosed) break;
            await new Promise(r => setTimeout(r, 100));
          }

          const isDisconnectOK = adminDiscResult?.status === "ok"
            && adminDiscResult?.action === "disconnect_user";

          // 退出登录：断开管理员的连接和 victim 的连接
          adminDiscUser.server.disconnectAll();
          victimUser.server.disconnectAll();

          return {
            assert: isDisconnectOK && victimClosed,
            content: {
              message: isDisconnectOK && victimClosed
                ? `Admin disconnected victim user (victim closed: ${victimClosed})`
                : "Disconnect test failed",
              disconnectResult: adminDiscResult,
              victimClosed: victimClosed,
              checks: {
                isDisconnectOK,
                victimClosed,
                disconnectAction: adminDiscResult?.action === "disconnect_user",
              },
            },
          };
        </script>
      </template>
    </sb-test>

    <sb-test name="Admin List All History Users (Offline Support)">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/user.js";

          const adminHistData = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminHistNs = "admin-hist-list-ns";

          try { await deleteUser(adminHistNs, { skipConfirm: true }); } catch (e) {}
          await saveUserKeys(adminHistNs, adminHistData.keys);
          await saveUserInfo(adminHistNs, adminHistData.info);

          const adminHistUser = new AdminUser(adminHistNs);
          await adminHistUser.ready();

          const victimHistNs = "victim-hist-ns";
          const victimHistUser = new LocalUser(victimHistNs);
          await victimHistUser.ready();
          const victimId = victimHistUser.userId;

          const histUrl = "ws://localhost:8081";

          // 1. 让 victim 上线，然后下线
          await adminHistUser.server.connect(histUrl);
          await victimHistUser.server.connect(histUrl);
          // 轮询确认 victim 已注册到服务器
          for (let i = 0; i < 10; i++) {
            const q = await adminHistUser.server.queryUserOnline(histUrl, victimId);
            if (q.online) break;
            await new Promise(r => setTimeout(r, 200));
          }
          victimHistUser.server.disconnect(histUrl);
          // 轮询确认 victim 已下线
          for (let i = 0; i < 10; i++) {
            const q = await adminHistUser.server.queryUserOnline(histUrl, victimId);
            if (!q.online) break;
            await new Promise(r => setTimeout(r, 200));
          }

          // 2. 管理员查询所有历史用户
          const histResponse = await adminHistUser.listAllUsers(histUrl);

          const isHistOK = histResponse?.status === "ok";
          const hasVictim = isHistOK && Array.isArray(histResponse.users) && histResponse.users.some(
            u => u.userId === victimId
          );

          // 3. 验证 victim 的在线状态（应该是 false）
          const victimRecord = hasVictim ? histResponse.users.find(u => u.userId === victimId) : null;
          const victimOffline = victimRecord && victimRecord.isOnline === false;

          // 4. 验证管理员自己也在列表中（且 isOnline 为 true）
          const adminRecord = isHistOK ? histResponse.users.find(u => u.userId === adminHistUser.userId) : null;
          const adminOnline = adminRecord && adminRecord.isOnline === true;

          adminHistUser.server.disconnectAll();
          victimHistUser.server.disconnectAll();

          return {
            assert: isHistOK && hasVictim && victimOffline && adminOnline,
            content: {
              message: hasVictim && victimOffline && adminOnline
                ? "Admin successfully listed history users with correct online status"
                : "History user list verification failed",
              histResponse,
              victimRecord,
              adminRecord,
              checks: {
                isHistOK,
                hasVictim,
                victimOffline,
                adminOnline,
              },
            },
          };
        </script>
      </template>
    </sb-test>
    <sb-test name="Admin Disconnect Specific Session">
      <template>
        <script type="module">
          import { saveUserKeys, saveUserInfo } from "/nos/user/db.js";
          import { deleteUser } from "/nos/user/main.js";
          import { AdminUser } from "/nos/user/admin-user.js";
          import { LocalUser } from "/nos/user/user.js";

          // 准备管理员用户
          const adminDataSess = await fetch("/tests/user/local/admin.json").then(r => r.json());
          const adminSessNs = "admin-sess-ns";

          try {
            await deleteUser(adminSessNs, { skipConfirm: true });
          } catch (e) { /* ignore */ }

          await saveUserKeys(adminSessNs, adminDataSess.keys);
          await saveUserInfo(adminSessNs, adminDataSess.info);

          const adminSessUser = new AdminUser(adminSessNs);
          await adminSessUser.ready();

          // 准备普通用户（通过 server.connect 连接第一个 session）
          const sessUserNs = "sess-target-ns";
          const sessUser1 = new LocalUser(sessUserNs);
          await sessUser1.ready();

          const sessUrl = "ws://localhost:8081";

          // 连接普通用户的第一个 session（使用 server.connect 建立长连接）
          let sess1Closed = false;

          await sessUser1.server.connect(sessUrl);
          sessUser1.addEventListener("close", () => { sess1Closed = true; });

          // 连接普通用户的第二个 session（模拟另一个 LocalUser 实例，不同 sessionId）
          let sess2Connected = false;
          let sess2Closed = false;
          const sess2Data = await sessUser1.getInfo();

          const sess2Promise = new Promise((resolve) => {
            const ws = new WebSocket(sessUrl);
            let pendingSend = null;

            ws.onopen = () => {
              if (pendingSend !== null) {
                ws.send(pendingSend);
                pendingSend = null;
              }
            };

            ws.onmessage = async (e) => {
              const data = JSON.parse(e.data);
              if (data.type === "handshake_challenge") {
                // 使用相同的 userId 但不同的 sessionId（通过 _sign 传入）
                const fakeSessionId = "s-fake-" + Math.random().toString(36).substring(2, 8);
                const response = await sessUser1._sign({
                  type: "handshake_response",
                  challenge: data.challenge,
                  userId: sessUser1.userId,
                  sessionId: fakeSessionId,
                  username: sess2Data.username,
                });
                const payload = JSON.stringify(response);
                if (ws.readyState === WebSocket.OPEN) {
                  ws.send(payload);
                } else {
                  pendingSend = payload;
                }
                return;
              }
              if (data.type === "handshake" && data.status === "success") {
                sess2Connected = true;
                resolve(ws);
              }
            };

            ws.onclose = () => {
              sess2Closed = true;
            };

            ws.onerror = () => {};

            setTimeout(() => {
              if (!sess2Connected) {
                ws.close();
                resolve(null);
              }
            }, 5000);
          });

          const ws2 = await sess2Promise;

          // 管理员使用 AdminUser API 分步操作
          const adminSessListResult = await adminSessUser.listUsers(sessUrl, { pageSize: 100 });

          let adminSessDisconnectResult = null;
          let adminSessAfterList = null;

          // 找到第二个 session（fake session）
          const targetSessions = (adminSessListResult.users || []).filter(
            u => u.userId === sessUser1.userId && u.sessionId !== sessUser1.sessionId
          );

          if (targetSessions.length > 0) {
            adminSessDisconnectResult = await adminSessUser.disconnectSession(
              sessUrl,
              sessUser1.userId,
              targetSessions[0].sessionId,
            );
            // 再次 list_users 确认只有一个 session 剩余
            adminSessAfterList = await adminSessUser.listUsers(sessUrl, { pageSize: 100 });
          } else {
            adminSessDisconnectResult = { status: "error", message: "Fake session not found in list" };
          }

          // 轮询等待 session2 收到 close 事件
          for (let i = 0; i < 10; i++) {
            if (sess2Closed) break;
            await new Promise(r => setTimeout(r, 100));
          }

          const session1StillConnected = !sess1Closed;
          const session2Disconnected = sess2Connected && sess2Closed;
          const disconnectOK = adminSessDisconnectResult?.status === "ok";
          const afterListOK = adminSessAfterList?.status === "ok";
          const onlyOneSessionLeft = afterListOK && Array.isArray(adminSessAfterList.users)
            && adminSessAfterList.users.filter(u => u.userId === sessUser1.userId).length === 1;
          // 验证分页字段
          const hasPagination = adminSessListResult.total != null
            && adminSessListResult.page != null
            && adminSessListResult.page_size != null;

          // 清理：关闭原始 WebSocket 连接
          if (ws2 && ws2.readyState === WebSocket.OPEN) ws2.close();
          // 退出登录：断开管理员和普通用户的连接
          adminSessUser.server.disconnectAll();
          sessUser1.server.disconnectAll();

          return {
            assert: disconnectOK && session1StillConnected && session2Disconnected && onlyOneSessionLeft && hasPagination,
            content: {
              message: disconnectOK && session1StillConnected && session2Disconnected
                ? `Disconnected session2, session1 still alive (remaining: ${onlyOneSessionLeft}, pagination: ${hasPagination})`
                : "Disconnect session test failed",
              session1Closed: sess1Closed,
              session2Connected: sess2Connected,
              session2Closed: sess2Closed,
              disconnectResult: adminSessDisconnectResult,
              afterList: adminSessAfterList,
              hasPagination,
              initialTotal: adminSessListResult.total,
              initialPage: adminSessListResult.page,
              initialPageSize: adminSessListResult.page_size,
              checks: {
                disconnectOK,
                session1StillConnected,
                session2Disconnected,
                onlyOneSessionLeft,
                hasPagination,
              },
            },
          };
        </script>
      </template>
    </sb-test>
