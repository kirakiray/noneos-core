<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RTC Glare 与 ICE 缓冲测试</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
</head>

<body>
  <h1>WebRTC Glare / ICE 乱序 健壮性测试</h1>

  <!-- Test 1: 双方同时 connect() 触发 glare，应能稳定建连并双向收发 -->
  <sb-test name="Glare - Both Sides Call connect() Simultaneously">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";

        const t1_nsA = "rtc-glare-1-a";
        const t1_nsB = "rtc-glare-1-b";
        const t1_url = "ws://localhost:8081";

        const t1_userA = new LocalUser(t1_nsA);
        const t1_userB = new LocalUser(t1_nsB);
        await Promise.all([t1_userA.ready(), t1_userB.ready()]);
        await Promise.all([
          t1_userA.server.connect(t1_url),
          t1_userB.server.connect(t1_url),
        ]);

        const t1_remoteB = await t1_userA.connectUser(t1_userB.userId);
        const t1_remoteA = await t1_userB.connectUser(t1_userA.userId);

        // 双方几乎同时触发 RTC connect() —— 模拟 glare
        // 不 await 任一方，让两边并发 createOffer / setLocalDescription
        const t1_glarePromise = Promise.all([
          t1_userA.rtc.connect(t1_userB.userId, t1_userB.sessionId),
          t1_userB.rtc.connect(t1_userA.userId, t1_userA.sessionId),
        ]);

        // 轮询等待任一方向 DataChannel 就绪（双方都应最终进入 open）
        const t1_waitForOpen = (user, otherUserId, otherSessionId, timeoutMs = 8000) => {
          return new Promise((resolve) => {
            const start = Date.now();
            const tick = () => {
              const dc = user.rtc.getChannel(otherUserId, otherSessionId);
              if (dc?.readyState === "open") return resolve(true);
              if (Date.now() - start > timeoutMs) return resolve(false);
              setTimeout(tick, 100);
            };
            tick();
          });
        };

        await t1_glarePromise;
        const t1_aOpen = await t1_waitForOpen(t1_userA, t1_userB.userId, t1_userB.sessionId);
        const t1_bOpen = await t1_waitForOpen(t1_userB, t1_userA.userId, t1_userA.sessionId);

        // 双向 RTC 消息验证
        // 注意：rtc_message 也会收到内部协议消息（ping/pong、service_*），
        // 必须按内容过滤，否则 path-change 触发的 pong 会抢占断言变量。
        let t1_aGot = null;
        let t1_bGot = null;
        t1_userA.bind("rtc_message", (e) => {
          if (e.detail.fromUserId !== t1_userB.userId) return;
          const d = e.detail.data;
          if (typeof d === "string" && d.startsWith("hello-from-")) t1_aGot = d;
        });
        t1_userB.bind("rtc_message", (e) => {
          if (e.detail.fromUserId !== t1_userA.userId) return;
          const d = e.detail.data;
          if (typeof d === "string" && d.startsWith("hello-from-")) t1_bGot = d;
        });

        if (t1_aOpen && t1_bOpen) {
          const t1_dcA = t1_userA.rtc.getChannel(t1_userB.userId, t1_userB.sessionId);
          const t1_dcB = t1_userB.rtc.getChannel(t1_userA.userId, t1_userA.sessionId);
          t1_dcA.send("hello-from-A");
          t1_dcB.send("hello-from-B");
          // 等待消息到达
          for (let i = 0; i < 30 && (!t1_aGot || !t1_bGot); i++) {
            await new Promise((r) => setTimeout(r, 100));
          }
        }

        t1_userA.server.disconnectAll();
        t1_userB.server.disconnectAll();

        const t1_pass = t1_aOpen && t1_bOpen && t1_aGot === "hello-from-B" && t1_bGot === "hello-from-A";
        return {
          assert: t1_pass,
          content: {
            message: t1_pass ? "glare 协商成功，RTC 双向通信正常" : "glare 场景 RTC 建连失败",
            checks: {
              aDataChannelOpen: t1_aOpen,
              bDataChannelOpen: t1_bOpen,
              aReceived: t1_aGot,
              bReceived: t1_bGot,
            },
          },
        };
      </script>
    </template>
  </sb-test>

  <!-- Test 2: 多轮 sendToService 双向触发，验证多次 glare 后仍稳定 -->
  <sb-test name="Repeated Bidirectional sendToService - RTC Stays Stable">
    <template>
      <script type="module">
        import { LocalUser } from "/nos/user/user.js";

        const t2_nsA = "rtc-glare-2-a";
        const t2_nsB = "rtc-glare-2-b";
        const t2_url = "ws://localhost:8081";
        const t2_rounds = 5;

        const t2_userA = new LocalUser(t2_nsA);
        const t2_userB = new LocalUser(t2_nsB);
        await Promise.all([t2_userA.ready(), t2_userB.ready()]);
        await Promise.all([
          t2_userA.server.connect(t2_url),
          t2_userB.server.connect(t2_url),
        ]);

        const t2_remoteB = await t2_userA.connectUser(t2_userB.userId);
        const t2_remoteA = await t2_userB.connectUser(t2_userA.userId);

        const t2_aReceived = [];
        const t2_bReceived = [];
        t2_userA.registerService("glare-app", {
          onMessage(data) { t2_aReceived.push(data); },
        });
        t2_userB.registerService("glare-app", {
          onMessage(data) { t2_bReceived.push(data); },
        });

        await new Promise((r) => setTimeout(r, 300));

        // 多轮双向并发 sendToService —— 第二轮起双方都会触发 rtc.connect()（glare）
        for (let i = 0; i < t2_rounds; i++) {
          await Promise.all([
            t2_remoteB.sendToService("glare-app", { round: i, from: "A" }),
            t2_remoteA.sendToService("glare-app", { round: i, from: "B" }),
          ]);
          await new Promise((r) => setTimeout(r, 300));
        }

        // 轮询等待全部消息到达
        for (let i = 0; i < 40; i++) {
          if (t2_aReceived.length >= t2_rounds && t2_bReceived.length >= t2_rounds) break;
          await new Promise((r) => setTimeout(r, 100));
        }

        // 等待并验证 RTC 是否最终建立（任一方向 DataChannel open）
        const t2_dcA = t2_userA.rtc.getChannel(t2_userB.userId, t2_userB.sessionId);
        const t2_dcB = t2_userB.rtc.getChannel(t2_userA.userId, t2_userA.sessionId);
        const t2_rtcEstablished =
          t2_dcA?.readyState === "open" || t2_dcB?.readyState === "open";

        const t2_aCountOk = t2_aReceived.length === t2_rounds;
        const t2_bCountOk = t2_bReceived.length === t2_rounds;

        t2_userA.server.disconnectAll();
        t2_userB.server.disconnectAll();

        const t2_pass = t2_aCountOk && t2_bCountOk && t2_rtcEstablished;
        return {
          assert: t2_pass,
          content: {
            message: t2_pass
              ? "多轮双向通信后 RTC 稳定建立，无信令错误"
              : "多轮双向通信失败或 RTC 未建立",
            checks: {
              aReceivedCount: t2_aReceived.length,
              bReceivedCount: t2_bReceived.length,
              expectedCount: t2_rounds,
              rtcEstablished: t2_rtcEstablished,
              dcAState: t2_dcA?.readyState ?? "absent",
              dcBState: t2_dcB?.readyState ?? "absent",
            },
          },
        };
      </script>
    </template>
  </sb-test>

</body>

</html>
