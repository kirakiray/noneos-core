<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>installHostCache 核心逻辑测试</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
    <script type="module">
      import registration from "/nos-tool/_install/register.js";
      await registration;
    </script>
  </head>
  <body>
    <h1>installHostCache 核心逻辑测试</h1>

    <sb-test name="安装后文件被正确写入 OPFS host-cache 目录">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";
          import { get, init } from "/nos/fs/main.js";

          {
            const manifestUrl = "/tests/host-cache/manifest-v1.json";

            await installHostCache(manifestUrl);

            // 验证 file-a.txt
            const fileA = await get("host-cache/tests/host-cache/file-a.txt");
            const textA = await fileA.text();

            // 验证 file-b.txt
            const fileB = await get("host-cache/tests/host-cache/file-b.txt");
            const textB = await fileB.text();

            return {
              assert:
                textA === "host cache test file A v1" &&
                textB === "host cache test file B v1",
              content: {
                textA,
                textB,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="安装后 manifest 副本被写入 OPFS">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";
          import { get } from "/nos/fs/main.js";

          {
            await installHostCache("/tests/host-cache/manifest-v1.json");

            const manifestHandle = await get("host-cache/manifest.json");
            const manifestText = await manifestHandle.text();
            const manifest = JSON.parse(manifestText);

            return {
              assert:
                manifest.version === "1.0.0" &&
                Array.isArray(manifest.files) &&
                manifest.files.length === 2,
              content: {
                version: manifest.version,
                filesCount: manifest.files.length,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="安装后 system.json 中记录正确的 hostCache 信息">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";
          import { get } from "/nos/fs/main.js";

          {
            await installHostCache("/tests/host-cache/manifest-v1.json");

            const configFile = await get("nos-config/system.json");
            const systemConfig = await configFile.json();

            return {
              assert:
                systemConfig.hostCache?.version === "1.0.0" &&
                systemConfig.hostCache?.cachePath === "host-cache" &&
                systemConfig.hostCache?.mode === "local",
              content: {
                hostCache: systemConfig.hostCache,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="版本相同时跳过安装">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";
          import { get } from "/nos/fs/main.js";

          {
            // 先安装 v1
            await installHostCache("/tests/host-cache/manifest-v1.json");

            // 记录 manifest 副本的内容
            const beforeHandle = await get("host-cache/manifest.json");
            const beforeText = await beforeHandle.text();

            // 再次安装相同版本，应跳过
            // 手动篡改 manifest 副本以验证未被覆盖
            await beforeHandle.write(JSON.stringify({ tampered: true }));

            await installHostCache("/tests/host-cache/manifest-v1.json");

            // 如果跳过了，篡改的内容应该保留
            const afterHandle = await get("host-cache/manifest.json");
            const afterText = await afterHandle.text();

            const skipped = afterText.includes('"tampered":true');

            return {
              assert: skipped,
              content: {
                skipped,
                afterText: afterText.slice(0, 50),
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="版本不同时触发升级并更新文件">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";
          import { get } from "/nos/fs/main.js";

          {
            // 先安装 v1
            await installHostCache("/tests/host-cache/manifest-v1.json");

            // 升级到 v2
            await installHostCache("/tests/host-cache/manifest-v2.json");

            // 验证 system.json 已更新到 v2
            const configFile = await get("nos-config/system.json");
            const systemConfig = await configFile.json();

            // 验证 manifest 副本已更新到 v2
            const manifestHandle = await get("host-cache/manifest.json");
            const manifest = JSON.parse(await manifestHandle.text());

            return {
              assert:
                systemConfig.hostCache?.version === "2.0.0" &&
                manifest.version === "2.0.0",
              content: {
                systemVersion: systemConfig.hostCache?.version,
                manifestVersion: manifest.version,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="进度回调被正确触发">
      <template>
        <script type="module">
          import { installHostCache } from "/nos-tool/_install/main.js";

          {
            const steps = [];

            // 上一个测试已安装 v2，这里装 v1 触发完整下载流程
            await installHostCache(
              "/tests/host-cache/manifest-v1.json",
              (e) => {
                steps.push({ ...e });
              },
            );

            // manifest-v1 有 2 个文件，total = 2 + 2 = 4
            // 期望回调序列：loading(1/1) → file1(2/4) → file2(3/4) → finalizing(4/4)
            const hasLoading = steps.some(
              (s) => s.desc === "loading host cache manifest",
            );
            const hasCaching = steps.some((s) =>
              s.desc?.startsWith("caching:"),
            );
            const hasFinalizing = steps.some(
              (s) => s.desc === "finalizing host cache",
            );
            const lastStep = steps[steps.length - 1];

            return {
              assert:
                hasLoading && hasCaching && hasFinalizing,
              content: {
                totalSteps: steps.length,
                lastStep,
                steps: steps.map((s) => s.desc),
              },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
