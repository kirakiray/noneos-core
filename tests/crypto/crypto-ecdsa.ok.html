<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate KeyPair Test</title>
    <script type="module" src="/nos-tool/test/test.mjs"></script>
  </head>
  <body>
    <h1>ECDSA Crypto Tests</h1>

    <ok-test name="Generate KeyPair Test">
      <template>
        <script type="module">
          import { generateKeyPair } from "/nos/crypto/crypto-ecdsa.js";
          {
            const keyPair = await generateKeyPair();

            const hasPublicKey = !!keyPair.publicKey;
            const hasPrivateKey = !!keyPair.privateKey;

            const isBase64 = (str) => {
              try {
                return btoa(atob(str)) === str;
              } catch (err) {
                return false;
              }
            };

            const isPublicKeyBase64 = isBase64(keyPair.publicKey);
            const isPrivateKeyBase64 = isBase64(keyPair.privateKey);

            return {
              assert:
                hasPublicKey &&
                hasPrivateKey &&
                isPublicKeyBase64 &&
                isPrivateKeyBase64,
              content: {
                message: "ECDSA 密钥对生成成功",
                publicKeyLength: keyPair.publicKey.length,
                privateKeyLength: keyPair.privateKey.length,
                algorithm: "ECDSA P-256",
              },
            };
          }
        </script>
      </template>
    </ok-test>

    <ok-test name="Sign and Verify Test">
      <template>
        <script type="module">
          import {
            generateKeyPair,
            importPrivateKey,
            importPublicKey,
          } from "/nos/crypto/crypto-ecdsa.js";
          {
            const keyPair = await generateKeyPair();

            const privateKey = await importPrivateKey(keyPair.privateKey);
            const publicKey = await importPublicKey(keyPair.publicKey);

            const message = "Hello, NoneOS!";
            const encoder = new TextEncoder();
            const data = encoder.encode(message);

            const signature = await window.crypto.subtle.sign(
              {
                name: "ECDSA",
                hash: { name: "SHA-256" },
              },
              privateKey,
              data,
            );

            const isValid = await window.crypto.subtle.verify(
              {
                name: "ECDSA",
                hash: { name: "SHA-256" },
              },
              publicKey,
              signature,
              data,
            );

            return {
              assert: isValid,
              content: {
                message: "签名验证成功",
                originalMessage: message,
                signatureLength: signature.byteLength,
              },
            };
          }
        </script>
      </template>
    </ok-test>

    <ok-test name="Create Signer and Verifier Test">
      <template>
        <script type="module">
          import {
            generateKeyPair,
            createSigner,
            createVerifier,
          } from "/nos/crypto/crypto-ecdsa.js";

          const keyPair = await generateKeyPair();

          const sign = await createSigner(keyPair.privateKey);
          const verify = await createVerifier(keyPair.publicKey);

          const message = "Hello, NoneOS Signature!";

          const signature = await sign(message);

          const isValid = await verify(message, signature);

          const tamperedMessage = "Tampered Message";
          const isInvalid = await verify(tamperedMessage, signature);

          return {
            assert: isValid && !isInvalid,
            content: {
              message: "签名器和验证器测试成功",
              originalMessage: message,
              signatureValid: isValid,
              tamperedMessageValid: isInvalid,
              signatureLength: signature.byteLength,
            },
          };
        </script>
      </template>
    </ok-test>
  </body>
</html>
