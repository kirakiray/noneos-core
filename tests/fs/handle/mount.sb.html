<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount Test</title>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"
    ></script>
  </head>
  <body>
    <h1>Mount Tests</h1>

    <script>
      const isSafari = /^((?!chrome|android).)*safari/i.test(
        navigator.userAgent,
      );
    </script>

    <sb-test name="Mount Handle Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, getMounted, unmount } from "/nos/fs/main.js";
          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-mount-dir");

            const mountedHandle = await mount(testDirectory);

            const path = mountedHandle.path;

            const hasMountPath = path.startsWith("$mount-");

            const allHandles = await getMounted();

            const foundInList = allHandles.find(
              (item) => item.path === mountedHandle.path
            );

            if (foundInList) {
              await unmount(foundInList.handle);
            }

            return {
              assert: hasMountPath && !!foundInList,
              content: `Expected mounted handle to have $mount- prefix and be found in mounted list`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Get Mounted Handles Test">
      <template>
        <script>
          import { getMounted } from "/nos/fs/main.js";
          {
            const mountedHandles = await getMounted();

            return {
              assert: Array.isArray(mountedHandles),
              content: `Expected getMounted to return an array, got ${typeof mountedHandles}`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Unmount Handle Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, getMounted, unmount } from "/nos/fs/main.js";
          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-unmount-dir");

            await mount(testDirectory);

            const allHandles = await getMounted();

            const foundInList = allHandles.find(
              (item) => item.path === testDirectory.path
            );

            if (foundInList) {
              await unmount(foundInList.handle);
            }

            const afterUnmount = await getMounted();

            const stillExists = afterUnmount.find(
              (item) => item.path === testDirectory.path
            );

            return {
              assert: foundInList && !stillExists,
              content: `Expected handle to be removed after unmount`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Get Mounted Handle by Path Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, get, unmount, getMounted } from "/nos/fs/main.js";
          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-get-mount-dir");

            await testDirectory.get("test.txt", { create: "file" });

            const mountedHandle = await mount(testDirectory);

            const retrievedHandle = await get(mountedHandle.path);

            const isSame = await mountedHandle.isSame(retrievedHandle);

            const allHandles = await getMounted();
            const foundInList = allHandles.find(
              (item) => item.path === mountedHandle.path
            );

            if (foundInList) {
              await unmount(foundInList.handle);
            }

            return {
              assert: isSame,
              content: `Expected retrieved handle to be the same as mounted handle`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Mount Handle with Subdirectory Access Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, get, unmount, getMounted } from "/nos/fs/main.js";
          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-mount-subdir");

            const subDir = await testDirectory.get("subdir", { create: "dir" });
            const testFile = await subDir.get("test.txt", { create: "file" });
            await testFile.write("mount test content");

            const mountedHandle = await mount(testDirectory);

            const subDirHandle = await get(`${mountedHandle.path}/subdir`);

            const fileHandle = await subDirHandle.get("test.txt");
            const content = await fileHandle.text();

            const allHandles = await getMounted();
            const foundInList = allHandles.find(
              (item) => item.path === mountedHandle.path
            );

            if (foundInList) {
              await unmount(foundInList.handle);
            }

            return {
              assert: content === "mount test content",
              content: `Expected file content to be 'mount test content', got '${content}'`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Mount Handle Fetch Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, unmount, getMounted } from "/nos/fs/main.js";

          import registration from "/nos-tool/_install/register.js";
          await registration;

          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-mount-fetch");

            const testFile = await testDirectory.get("fetch-test.txt", {
              create: "file",
            });
            const testContent = "fetch content " + Math.random();
            await testFile.write(testContent);

            const mountedHandle = await mount(testDirectory);

            await new Promise((resolve) => setTimeout(resolve, 300));

            const fetchContent = await fetch(
              `/${mountedHandle.path}/fetch-test.txt`
            ).then((e) => e.text());

            const allHandles = await getMounted();
            const foundInList = allHandles.find(
              (item) => item.path === mountedHandle.path
            );

            if (foundInList) {
              await unmount(foundInList.handle);
            }

            return {
              assert: fetchContent === testContent,
              content: `Expected fetch content to be '${testContent}', got '${fetchContent}'`,
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="Unmount Handle with Handle Object Test">
      <template>
        <script>
          import { init } from "/nos/fs/main.js";
          import { mount, unmount, getMounted } from "/nos/fs/main.js";
          {
            if (isSafari) {
              return { assert: true, content: "Safari skipped" };
            }

            const testDirectory = await init("test-unmount-handle");

            const mountedHandle = await mount(testDirectory);

            const beforeUnmount = await getMounted();
            const existsBefore = beforeUnmount.find(
              (item) => item.path === mountedHandle.path
            );

            await unmount(mountedHandle);

            const afterUnmount = await getMounted();
            const existsAfter = afterUnmount.find(
              (item) => item.path === mountedHandle.path
            );

            return {
              assert: existsBefore && !existsAfter,
              content: `Expected handle to be removed when unmounting with handle object`,
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
