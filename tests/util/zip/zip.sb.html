<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zip Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
  </head>
  <body>
    <h1>Zip Tests（zip 写路径：目录下载产物）</h1>

    <sb-test name="zip - 单文件压缩产出合法 ZIP 头">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { zip } from "/nos/util/zip.js";
          {
            const file = new File(["Hello World"], "hello.txt", { type: "text/plain" });
            const zipBlob = await zip([{ file, path: "hello.txt" }]);

            const head = new Uint8Array(await zipBlob.slice(0, 4).arrayBuffer());
            const isPK = head[0] === 0x50 && head[1] === 0x4b && head[2] === 0x03 && head[3] === 0x04;

            return {
              assert: zipBlob instanceof Blob && zipBlob.size > 0 && isPK,
              content: {
                message: "单文件 zip：Blob 且以 PK\\x03\\x04 开头",
                isBlob: zipBlob instanceof Blob,
                size: zipBlob.size,
                isPK,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="zip - 多文件条目可被独立解析还原（中央目录 + deflate-raw）">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { zip } from "/nos/util/zip.js";
          {
            // 测试内置一个独立的 ZIP 读取器（不依赖被测代码的解压实现），
            // 用于交叉验证写出的容器结构正确
            const readZipEntries = async (blob) => {
              const bytes = new Uint8Array(await blob.arrayBuffer());
              const view = new DataView(bytes.buffer);

              // EOCD 固定位于尾部 22 字节（本写入器不写注释）
              const eocd = bytes.length - 22;
              if (view.getUint32(eocd, true) !== 0x06054b50) {
                throw new Error("EOCD not found");
              }
              const count = view.getUint16(eocd + 10, true);
              let offset = view.getUint32(eocd + 16, true);

              const entries = [];
              for (let i = 0; i < count; i++) {
                const method = view.getUint16(offset + 10, true);
                const compSize = view.getUint32(offset + 20, true);
                const size = view.getUint32(offset + 24, true);
                const nameLen = view.getUint16(offset + 28, true);
                const extraLen = view.getUint16(offset + 30, true);
                const commentLen = view.getUint16(offset + 32, true);
                const localOffset = view.getUint32(offset + 42, true);
                const name = new TextDecoder().decode(
                  bytes.subarray(offset + 46, offset + 46 + nameLen),
                );

                const localNameLen = view.getUint16(localOffset + 26, true);
                const localExtraLen = view.getUint16(localOffset + 28, true);
                const dataStart = localOffset + 30 + localNameLen + localExtraLen;
                const compressed = bytes.subarray(dataStart, dataStart + compSize);

                let content;
                if (method === 8) {
                  const stream = new Blob([compressed])
                    .stream()
                    .pipeThrough(new DecompressionStream("deflate-raw"));
                  content = new TextDecoder().decode(
                    await new Response(stream).arrayBuffer(),
                  );
                } else {
                  content = new TextDecoder().decode(compressed);
                }

                entries.push({ name, size, content });
                offset += 46 + nameLen + extraLen + commentLen;
              }
              return entries;
            };

            const files = [
              { file: new File(["Content 1"], "file1.txt"), path: "dir1/file1.txt" },
              { file: new File(["内容2"], "file2.txt"), path: "dir2/file2.txt" },
            ];
            const zipBlob = await zip(files);
            const entries = await readZipEntries(zipBlob);

            return {
              assert:
                entries.length === 2 &&
                entries[0].name === "dir1/file1.txt" &&
                entries[0].content === "Content 1" &&
                entries[1].name === "dir2/file2.txt" &&
                entries[1].content === "内容2",
              content: {
                message: "多文件 zip：条目名与解压内容均与原文件一致",
                entries: entries.map(({ name, size }) => ({ name, size })),
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="zip - 空文件列表返回 null">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { zip } from "/nos/util/zip.js";
          {
            const result = await zip([]);

            return {
              assert: result === null,
              content: { message: "zip([]) 应返回 null", result },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
