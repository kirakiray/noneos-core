<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unzip Test</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/sibyl-test/components/sb-test.mjs"></script>
  </head>
  <body>
    <h1>Unzip Tests（unzip 读路径：系统包 nos.tgz 解包）</h1>

    <sb-test name="unzip - 解包真实系统包，条目与 nos.json 清单完全一致">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { unzip } from "/nos/util/zip.js";
          {
            // 直接解包 Node 端产出的真实 nos.tgz（读写端实现解耦），
            // 条目集合应与安装签名清单 nos.json 的 hashes 路径完全一致
            const [packageBlob, manifest] = await Promise.all([
              fetch("/nos.tgz", { cache: "no-store" }).then((res) => res.blob()),
              fetch("/nos.json", { cache: "no-store" }).then((res) => res.json()),
            ]);

            const extracted = await unzip(packageBlob);
            const extractedPaths = extracted.map((item) => item.path).sort();
            const manifestPaths = manifest.hashes
              .map((item) => item.path)
              .sort();

            const missing = manifestPaths.filter(
              (p) => !extractedPaths.includes(p),
            );
            const extra = extractedPaths.filter(
              (p) => !manifestPaths.includes(p),
            );

            return {
              assert:
                missing.length === 0 &&
                extra.length === 0 &&
                extractedPaths.length === manifestPaths.length,
              content: {
                message: "解包条目集合与清单一致",
                packageSize: packageBlob.size,
                extractedCount: extractedPaths.length,
                manifestCount: manifestPaths.length,
                missing,
                extra,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="unzip - 抽查条目内容哈希与签名清单一致">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { unzip } from "/nos/util/zip.js";
          import { getFileHash } from "/nos/util/hash/get-file-hash.js";
          {
            const [packageBlob, manifest] = await Promise.all([
              fetch("/nos.tgz", { cache: "no-store" }).then((res) => res.blob()),
              fetch("/nos.json", { cache: "no-store" }).then((res) => res.json()),
            ]);

            const extracted = await unzip(packageBlob);
            const byPath = new Map(extracted.map((item) => [item.path, item]));

            // 抽查若干关键文件（含被测模块自身）的内容哈希
            const samplePaths = [
              "util/zip.js",
              "fs/main.js",
              "user/main.js",
              "storage/main.js",
            ];
            const results = [];
            let allMatch = true;
            for (const p of samplePaths) {
              const declared = manifest.hashes.find((h) => h.path === p);
              const item = byPath.get(p);
              if (!declared || !item) {
                allMatch = false;
                results.push({ path: p, found: Boolean(item) });
                continue;
              }
              const actualHash = await getFileHash(item.file);
              const match = actualHash === declared.hash;
              allMatch = allMatch && match;
              results.push({ path: p, match });
            }

            return {
              assert: allMatch,
              content: {
                message: "抽查文件的内容哈希与清单一致",
                results,
              },
            };
          }
        </script>
      </template>
    </sb-test>

    <sb-test name="unzip - 非 gzip 输入应报 unsupported archive">
      <template>
        <script>
          import registration from "/nos-lib/_install/register.js";
          await registration;
          import { unzip } from "/nos/util/zip.js";
          {
            let errorMessage = "";
            try {
              await unzip(new Blob(["plain text, not an archive"]));
            } catch (err) {
              errorMessage = err.message;
            }

            return {
              assert: errorMessage.includes("unsupported archive"),
              content: { message: "非 gzip 输入应抛出明确错误", errorMessage },
            };
          }
        </script>
      </template>
    </sb-test>
  </body>
</html>
