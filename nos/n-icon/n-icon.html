<template component>
  <style>
    :host {
      display: block;
    }
    svg {
      display: block;
    }
  </style>
  <div class="main"></div>
  <script>
    import { EverCache } from "/gh/kirakiray/ever-cache/src/main.js";

    // 持久化缓存实例
    const iconStorage = new EverCache("n-icons");
    // 内存 Promise 缓存，防止并发请求相同图标
    const promiseCache = {};

    export default {
      tag: "n-icon",
      attrs: {
        icon: null,
      },
      watch: {
        icon(icon) {
          this.loadIcon();
        },
      },
      proto: {
        async loadIcon() {
          const name = this.icon;
          if (!name) return;

          // 1. 优先从内存或持久化缓存获取
          let content = promiseCache[name]
            ? await promiseCache[name]
            : await iconStorage[name];

          // 2. 缓存未命中则从网络获取
          if (!content) {
            promiseCache[name] = fetch(
              `https://api.iconify.design/${name}.svg`
            ).then((res) => (res.ok ? res.text() : Promise.reject()));

            try {
              content = await promiseCache[name];
              iconStorage[name] = content; // 存入持久化缓存
            } catch (error) {
              console.error(`Failed to load icon: ${name}`, error);
            } finally {
              delete promiseCache[name];
            }
          }

          if (this.icon === name && content) {
            this.shadow.$(".main").html = content;
          }
        },
      },
    };
  </script>
</template>
