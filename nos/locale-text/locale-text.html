<template component>
  <style>
    :host {
      display: contents;
    }
    ::slotted(*) {
      display: none;
    }
  </style>
  <style id="lang-style"></style>
  <slot></slot>
  <script>
    // 转义 CSS 属性选择器中的特殊字符，避免选择器解析失败或注入
    const escapeCSSAttr = (val) => {
      return String(val).replace(/["\\]/g, "\\$&");
    };

    export default async ({ load }) => {
      const { getLang } = await load("./get-locale-text.js");

      return {
        tag: "locale-text",
        attrs: {
          lang: null,
        },
        watch: {
          lang() {
            this.refreshStyle();
          },
        },
        ready() {
          // 初次挂载时计算一次样式
          this.refreshStyle();

          // 监听 slot 内子元素变化，自动重算显示语言
          this._mo = new MutationObserver(() => this.refreshStyle());
          this._mo.observe(this.ele, {
            childList: true,
            subtree: false,
            attributes: true,
            attributeFilter: ["lang"],
          });

          // 监听全局语言切换事件（由 setLang 派发）
          this._onLangChange = () => this.refreshStyle();
          window.addEventListener("locale-text:lang-change", this._onLangChange);
        },
        detached() {
          // 清理监听，避免内存泄漏
          if (this._mo) {
            this._mo.disconnect();
            this._mo = null;
          }
          if (this._onLangChange) {
            window.removeEventListener("locale-text:lang-change", this._onLangChange);
            this._onLangChange = null;
          }
        },
        proto: {
          refreshStyle() {
            let finalLang = this.lang || getLang();

            let allLang = new Set();

            // 判断是否存在对应的语言元素
            this.forEach((el) => {
              let lang = el.attr("lang");
              if (lang) {
                allLang.add(lang);
              }
            });

            // 没有任何带 lang 的子元素时，直接清空样式，避免生成脏 CSS
            if (allLang.size === 0) {
              this.shadow.$("#lang-style").html = "";
              return;
            }

            // 判断是否有当前的lang
            if (!allLang.has(finalLang)) {
              // 第二替代为英语
              if (allLang.has("en")) {
                finalLang = "en";
              } else {
                // 默认第一个
                finalLang = allLang.values().next().value;
              }
            }

            this.shadow.$("#lang-style").html = `
              ::slotted([lang="${escapeCSSAttr(finalLang)}"]) {
                display: revert;
              }
            `;
          },
        },
      };
    };
  </script>
</template>
