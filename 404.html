<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - NoneOS Core</title>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.js"></script>
    <style>
      html,
      body {
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Microsoft Yahei,
          Helvetica,
          Arial,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--md-sys-color-surface, #ffffff);
        color: var(--md-sys-color-on-surface, #1f1f1f);
      }

      .container {
        text-align: center;
        padding: 32px;
        max-width: 480px;
      }

      .error-code {
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        margin: 0 0 16px;
        color: var(--md-sys-color-primary, #3498db);
      }

      .title {
        font-size: 24px;
        font-weight: 500;
        margin: 0 0 12px;
      }

      .description {
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 24px;
        color: var(--md-sys-color-on-surface-variant, #5f5f5f);
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 24px;
        background-color: var(--md-sys-color-primary, #3498db);
        color: var(--md-sys-color-on-primary, #ffffff);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: opacity 0.2s ease;
      }

      .home-link:hover {
        opacity: 0.9;
      }
    </style>
    <!-- senti-ui 颜色体系引导（替代原 nos-tool/css palette+theme；SW 就绪前的静态页走完整 URL） -->
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@1.0.6/packages/boot/st-boot.js"></script>
  </head>
  <body>
    <div class="container">
      <h1 class="error-code">404</h1>
      <h2 class="title">
        <locale-text>
          <span lang="cn">页面未找到</span>
          <span lang="en">Page Not Found</span>
          <span lang="ja">ページが見つかりません</span>
        </locale-text>
      </h2>
      <p class="description">
        <locale-text>
          <span lang="cn">抱歉，您访问的页面不存在或已被移除。</span>
          <span lang="en">Sorry, the page you visited does not exist or has been removed.</span>
          <span lang="ja">アクセスしたページは存在しないか、削除されました。</span>
        </locale-text>
      </p>
      <a href="/" class="home-link">
        <locale-text>
          <span lang="cn">返回首页</span>
          <span lang="en">Back to Home</span>
          <span lang="ja">ホームに戻る</span>
        </locale-text>
      </a>
    </div>

    <script type="module">
      const load = lm(import.meta);
      await load("/nos/locale-text/locale-text.html");
    </script>
  </body>
</html>
